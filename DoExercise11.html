<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>粵語運動計時器</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;
    background:#0b0d12;color:#e9ecf1;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","PingFang TC","Microsoft JhengHei","Noto Sans HK",sans-serif;
  }
  body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;}

  #topbar{
    padding:10px 14px;display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid #1c2029;flex:none;padding-top:calc(10px + env(safe-area-inset-top));
  }
  #title{font-size:15px;font-weight:700;letter-spacing:.5px;}
  #status{
    font-size:12px;padding:4px 11px;border-radius:999px;background:#1a1f2b;
    color:#8b95a7;border:1px solid #262c38;white-space:nowrap;transition:.2s;
  }
  #status.on{background:#0d2a1a;color:#4ade80;border-color:#14532d;}
  #status.warn{background:#2a1a0d;color:#fbbf24;border-color:#78350f;}

  #mainBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px 4px;flex:none;}
  .big{
    padding:16px 8px;font-size:16px;font-weight:700;border-radius:14px;
    border:1px solid #2a3140;background:#161b25;color:#e9ecf1;cursor:pointer;
    transition:transform .08s, background .2s;font-family:inherit;
  }
  .big:active{transform:scale(.97);}
  .big.primary{background:linear-gradient(180deg,#2563eb,#1d4ed8);border-color:#3b82f6;color:#fff;}
  .big.primary.active{background:linear-gradient(180deg,#dc2626,#b91c1c);border-color:#ef4444;}

  .section{padding:6px 14px;flex:none;}
  .label{font-size:12px;color:#7b8494;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;}
  .btnrow button{
    padding:8px 13px;font-size:13px;border-radius:10px;border:1px solid #2a3140;
    background:#161b25;color:#c8d0dd;cursor:pointer;font-family:inherit;transition:.15s;
  }
  .btnrow button:active{transform:scale(.96);}
  .btnrow button.active{background:#1e3a8a;border-color:#3b82f6;color:#fff;font-weight:700;}

  #stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px 14px 6px;flex:none;}
  .stat{background:#12161f;border:1px solid #1e242f;border-radius:12px;padding:9px 4px;text-align:center;}
  .stat .k{font-size:11px;color:#7b8494;margin-bottom:3px;}
  .stat .v{font-size:17px;font-weight:800;color:#e9ecf1;font-variant-numeric:tabular-nums;letter-spacing:-.5px;}
  .stat .v.run{color:#4ade80;}

  #histWrap{flex:1;display:flex;flex-direction:column;min-height:0;padding:2px 14px 14px;padding-bottom:calc(14px + env(safe-area-inset-bottom));}
  #histHead{display:flex;justify-content:space-between;align-items:center;padding:8px 0 6px;font-size:13px;color:#9aa4b5;flex:none;font-weight:600;}
  #btnExport{
    padding:7px 11px;font-size:12px;border-radius:9px;border:1px solid #1e40af;
    background:#12203a;color:#93c5fd;cursor:pointer;font-family:inherit;
  }
  #btnExport:active{transform:scale(.96);}
  #histList{
    flex:1;overflow-y:auto;border:1px solid #1e242f;border-radius:12px;
    background:#0e121a;-webkit-overflow-scrolling:touch;min-height:60px;
  }
  .empty{color:#4b5563;font-size:13px;text-align:center;padding:24px 0;}

  .hist-item{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:10px 12px;border-bottom:1px solid #161b24;font-size:13px;
  }
  .hist-item:last-child{border-bottom:none;}
  .hi-left{display:flex;align-items:center;gap:9px;min-width:0;}
  .hi-idx{font-weight:800;color:#cbd5e1;font-variant-numeric:tabular-nums;}
  .hi-type{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700;}
  .hi-type.ok{background:#0d2a1a;color:#4ade80;}
  .hi-type.no{background:#2a1414;color:#f87171;}
  .hi-right{display:flex;align-items:baseline;gap:10px;flex:none;}
  .hi-time{font-weight:800;color:#e2e8f0;font-variant-numeric:tabular-nums;}
  .hi-clock{font-size:11px;color:#5c6675;font-variant-numeric:tabular-nums;}

  #toast{
    position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);
    background:#1e293b;color:#e2e8f0;padding:10px 20px;border-radius:10px;
    font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;
    border:1px solid #334155;max-width:88vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .banner{
    margin:0 14px 8px;padding:9px 12px;border-radius:10px;font-size:12px;
    background:#1a1408;border:1px solid #78350f;color:#fbbf24;display:none;line-height:1.5;
  }
</style>
</head>
<body>

  <div id="topbar">
    <div id="title">🎙️ 粵語運動計時器</div>
    <div id="status">未啟動</div>
  </div>

  <div id="mainBtns">
    <button id="btnVoice" class="big primary">啟動語音控制</button>
    <button id="btnReset" class="big">重置</button>
  </div>

  <div id="supportWarn" class="banner"></div>

  <div class="section">
    <div class="label">報時間隔（選一個）</div>
    <div id="intervals" class="btnrow"></div>
  </div>

  <div class="section">
    <div class="label"><span>語速</span><span id="rateVal">2.0×</span></div>
    <div class="btnrow">
      <button id="rateDown">− 慢啲</button>
      <button id="rateUp">＋ 快啲</button>
      <button id="rateTest">🔊 試聽</button>
    </div>
  </div>

  <div id="stats">
    <div class="stat"><div class="k">總時間</div><div class="v" id="totalTime">0秒</div></div>
    <div class="stat"><div class="k">已完成</div><div class="v" id="completedCount">0</div></div>
    <div class="stat"><div class="k">本回合（秒）</div><div class="v" id="roundSeconds">0</div></div>
  </div>

  <div id="histWrap">
    <div id="histHead">
      <span>歷史記錄</span>
      <button id="btnExport">📋 匯出到剪貼簿</button>
    </div>
    <div id="histList"><div class="empty">未有記錄</div></div>
  </div>

  <div id="toast"></div>

<script>
(function () {
  'use strict';

  /* =====================================================
     0. 基本工具
     ===================================================== */
  const $ = (id) => document.getElementById(id);
  const DIGITS = ['零','一','二','三','四','五','六','七','八','九'];

  function num2yue(n) {
    n = Math.floor(n);
    if (!isFinite(n) || n <= 0) return '零';
    if (n < 10) return DIGITS[n];
    if (n < 20) return '十' + (n % 10 ? DIGITS[n % 10] : '');
    if (n < 100) {
      const t = Math.floor(n / 10), o = n % 10;
      return DIGITS[t] + '十' + (o ? DIGITS[o] : '');
    }
    if (n < 1000) {
      const h = Math.floor(n / 100), r = n % 100;
      return DIGITS[h] + '百' + (r ? (r < 10 ? '零' + num2yue(r) : num2yue(r)) : '');
    }
    return String(n);
  }

  // 秒數 → 粵語：1→「一」…59→「五十九」60→「一分鐘」61→「一分一秒」…
  function sec2yue(s) {
    s = Math.max(0, Math.floor(s));
    if (s < 60) return num2yue(s);
    const m = Math.floor(s / 60), r = s % 60;
    const mw = (m === 2) ? '兩' : num2yue(m);
    if (r === 0) return mw + '分鐘';
    return mw + '分' + num2yue(r) + '秒';
  }

  function fmtTime(s) {
    s = Math.max(0, Math.floor(s));
    const m = Math.floor(s / 60), r = s % 60;
    if (m === 0) return r + '秒';
    return m + '分' + String(r).padStart(2, '0') + '秒';
  }

  const pad2 = (n) => String(n).padStart(2, '0');
  const fmtClock = (d) => pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
  const fmtFull = (d) =>
    d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + fmtClock(d);

  // 語音文字正規化（繁簡／標點歸一）
  function canon(s) {
    return String(s || '')
      .replace(/[\s\u3000,，。.、!！?？:：;；"'「」『』“”‘’]/g, '')
      .replace(/開/g, '开')
      .replace(/結/g, '结')
      .replace(/鐘/g, '钟')
      .replace(/語/g, '语')
      .replace(/聲/g, '声')
      .replace(/暫/g, '暂');
  }

  function toast(msg, ms) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), ms || 1800);
  }

  /* =====================================================
     1. 語音合成（TTS）
     ===================================================== */
  const synth = window.speechSynthesis || null;
  let yueVoice = null;
  let rate = 2.0;
  let ttsLog = [];          // 記錄自己講過乜，用嚟做回音過濾

  function pickVoice() {
    if (!synth) return;
    let vs = [];
    try { vs = synth.getVoices() || []; } catch (e) { vs = []; }
    if (!vs.length) return;

    const score = (v) => {
      const l = String(v.lang || '').toLowerCase();
      const n = String(v.name || '');
      let s = 0;
      if (l.indexOf('zh-hk') === 0 || l.indexOf('yue') === 0 || l.indexOf('zh_hk') === 0) s += 200;
      if (/粵|粤|cantonese|yue|hk/i.test(n)) s += 120;
      if (l.indexOf('zh-tw') === 0 || l.indexOf('zh-hant') === 0) s += 60;
      if (l.indexOf('zh') === 0) s += 30;
      if (v.localService) s += 5;
      return s;
    };
    vs.sort((a, b) => score(b) - score(a));
    yueVoice = score(vs[0]) > 0 ? vs[0] : null;
  }

  if (synth) {
    pickVoice();
    synth.onvoiceschanged = pickVoice;
    setTimeout(pickVoice, 400);
    setTimeout(pickVoice, 1200);
  }

  // 解鎖 TTS（iOS 需要 user gesture）
  let primed = false;
  function primeSpeech() {
    if (primed || !synth) return;
    primed = true;
    try {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0; u.rate = 3;
      synth.speak(u);
    } catch (e) {}
  }

  function speak(text) {
    if (!synth) return;
    const clean = String(text);
    const now = Date.now();
    ttsLog.push({ t: canon(clean), time: now });
    if (ttsLog.length > 40) ttsLog.splice(0, ttsLog.length - 40);

    try {
      if (synth.speaking || synth.pending) synth.cancel();
      const u = new SpeechSynthesisUtterance(clean);
      u.lang = 'zh-HK';
      if (yueVoice) u.voice = yueVoice;
      u.rate = rate;
      u.pitch = 1;
      u.volume = 1;
      setTimeout(() => { try { synth.speak(u); } catch (e) {} }, 10);
    } catch (e) { /* ignore */ }
  }

  // 判斷聽到的字係咪自己啱啱講過（回音）
  function isEcho(heard) {
    if (!heard) return true;
    const now = Date.now();
    for (let i = ttsLog.length - 1; i >= 0; i--) {
      const e = ttsLog[i];
      if (now - e.time > 1800) break;
      if (!e.t) continue;
      if (e.t === heard) return true;
      if (heard.length >= 2 && e.t.indexOf(heard) >= 0) return true;
      if (e.t.length >= 2 && heard.indexOf(e.t) >= 0) return true;
    }
    return false;
  }

  /* =====================================================
     2. 語音辨識（STT）
     ===================================================== */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recog = null;
  let wantListen = false;
  let recogRunning = false;

  function detectCommand(t) {
    if (!t) return null;
    if (t.indexOf('结束') >= 0) return 'end';
    if (t.indexOf('取消') >= 0) return 'cancel';
    if (t.indexOf('停') >= 0) return 'stop';
    if (t.indexOf('开始') >= 0) return 'start';
    return null;
  }

  let lastFire = { cmd: null, time: 0 };

  function buildRecog() {
    if (!SR) return null;
    const r = new SR();
    r.lang = 'zh-HK';
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 3;

    r.onstart = function () { recogRunning = true; };

    r.onresult = function (ev) {
      const now = Date.now();
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const res = ev.results[i];
        for (let j = 0; j < res.length; j++) {
          const raw = (res[j] && res[j].transcript) || '';
          const t = canon(raw);
          const cmd = detectCommand(t);
          if (!cmd) continue;
          if (isEcho(t)) continue;
          if (lastFire.cmd === cmd && now - lastFire.time < 2200) return;
          lastFire = { cmd: cmd, time: now };
          execCommand(cmd);
          return;
        }
      }
    };

    r.onerror = function (e) {
      const err = e && e.error;
      if (err === 'not-allowed' || err === 'service-not-allowed') {
        wantListen = false;
        setStatus('麥克風權限被拒', 'warn');
        updateVoiceBtn();
        showWarn('❌ 麥克風權限被拒絕。請在瀏覽器設定中允許麥克風權限，然後重新載入頁面。');
      } else if (err === 'audio-capture') {
        wantListen = false;
        setStatus('找不到麥克風', 'warn');
        updateVoiceBtn();
      }
    };

    r.onend = function () {
      recogRunning = false;
      if (wantListen) {
        setTimeout(function () {
          if (!wantListen || !recog) return;
          try { recog.start(); } catch (e) {}
        }, 120);
      } else {
        setStatus('已停止');
      }
    };

    return r;
  }

  function startListening() {
    if (!SR) {
      setStatus('不支援語音辨識', 'warn');
      showWarn('❌ 此瀏覽器不支援語音辨識，請使用 Chrome / Edge / Safari（iOS 14.5+）。');
      return;
    }
    primeSpeech();
    if (!recog) recog = buildRecog();
    if (!recog) return;
    wantListen = true;
    try { recog.start(); } catch (e) { /* 已經啟動緊 */ }
    setStatus('聆聽中…', 'on');
    updateVoiceBtn();
  }

  function stopListening() {
    wantListen = false;
    try { if (recog) recog.stop(); } catch (e) {}
    setStatus('已停止');
    updateVoiceBtn();
  }

  function updateVoiceBtn() {
    const b = $('btnVoice');
    if (wantListen) {
      b.textContent = '停止語音控制';
      b.classList.add('active');
    } else {
      b.textContent = '啟動語音控制';
      b.classList.remove('active');
    }
  }

  function setStatus(txt, cls) {
    const el = $('status');
    el.textContent = txt;
    el.className = cls || '';
  }

  function showWarn(msg) {
    const w = $('supportWarn');
    w.textContent = msg;
    w.style.display = 'block';
  }

  /* =====================================================
     3. 狀態
     ===================================================== */
  function freshState() {
    return {
      running: false,
      roundStart: 0,
      lastSpokenSec: 0,
      completedCount: 0,
      totalSeconds: 0,
      history: [],
      exerciseStart: null,
      intervalSec: 1,
      ended: false,
      summary: ''
    };
  }

  let state = freshState();
  let tickHandle = null;

  /* =====================================================
     4. 報時循環
     ===================================================== */
  function startTicker() {
    stopTicker();
    tickHandle = setInterval(tick, 100);
    tick();
  }
  function stopTicker() {
    if (tickHandle) { clearInterval(tickHandle); tickHandle = null; }
  }

  function tick() {
    if (!state.running) return;
    const elapsed = (performance.now() - state.roundStart) / 1000;
    const sec = Math.floor(elapsed);

    const step = Math.max(1, state.intervalSec);
    const due = Math.floor(sec / step) * step;
    if (due > 0 && due > state.lastSpokenSec) {
      state.lastSpokenSec = due;
      speak(sec2yue(due));
    }
    updateStats();
  }

  /* =====================================================
     5. 指令執行
     ===================================================== */
  function execCommand(cmd) {
    if (cmd === 'start')  return doStart();
    if (cmd === 'stop')   return doStop();
    if (cmd === 'cancel') return doCancel();
    if (cmd === 'end')    return doEnd();
  }

  function doStart() {
    if (state.ended) { toast('已結束，請先重置'); return; }
    if (state.running) return;              // 已經計緊時，忽略重複

    state.running = true;
    state.roundStart = performance.now();   // 一聽到就即刻開始計
    state.lastSpokenSec = 0;
    if (!state.exerciseStart) state.exerciseStart = new Date();

    speak('開始');                          // 回應「開始」
    startTicker();
    updateStats();
  }

  function doStop() {
    if (!state.running) return;
    const secs = Math.round((performance.now() - state.roundStart) / 1000);

    state.running = false;
    stopTicker();
    state.completedCount += 1;
    state.totalSeconds += secs;
    state.history.push({
      idx: state.completedCount,
      type: '完成',
      secs: secs,
      at: new Date()
    });

    speak('第' + num2yue(state.completedCount) + '次完成');
    renderHistory();
    updateStats();
  }

  function doCancel() {
    if (!state.running) return;
    const secs = Math.round((performance.now() - state.roundStart) / 1000);
    const idx = state.completedCount + 1;   // x 維持不變 → 用同一個回合編號

    state.running = false;
    stopTicker();
    state.totalSeconds += secs;
    state.history.push({
      idx: idx,
      type: '取消',
      secs: secs,
      at: new Date()
    });

    speak('第' + num2yue(idx) + '次取消');
    renderHistory();
    updateStats();
  }

  function doEnd() {
    if (state.ended) return;
    state.ended = true;

    if (state.running) {
      state.running = false;
      stopTicker();
      // 未完結嘅回合唔計入完成次數
    }

    wantListen = false;
    try { if (recog) recog.stop(); } catch (e) {}
    updateVoiceBtn();
    setStatus('已結束');

    const done = state.completedCount;
    const total = Math.floor(state.totalSeconds);
    const m = Math.floor(total / 60), s = total % 60;

    let msg = '今次運動，總共完成咗' + num2yue(done) + '次，用咗';
    if (m > 0 && s === 0)      msg += num2yue(m) + '分鐘';
    else if (m > 0)            msg += num2yue(m) + '分' + num2yue(s) + '秒';
    else                       msg += num2yue(s) + '秒';

    speak(msg);
    state.summary = msg;

    renderHistory();
    updateStats();
    toast('運動結束 — ' + msg, 4000);
  }

  /* =====================================================
     6. 畫面更新
     ===================================================== */
  function updateStats() {
    const cur = state.running
      ? Math.floor((performance.now() - state.roundStart) / 1000)
      : 0;

    $('totalTime').textContent = fmtTime(state.totalSeconds + cur);
    $('completedCount').textContent = state.completedCount;
    const rs = $('roundSeconds');
    rs.textContent = cur;
    rs.className = 'v' + (state.running ? ' run' : '');
  }

  function renderHistory() {
    const list = $('histList');
    if (!state.history.length) {
      list.innerHTML = '<div class="empty">未有記錄</div>';
      return;
    }
    // 最新嘅喺最上面
    const arr = state.history.slice().reverse();
    list.innerHTML = arr.map(function (h) {
      const cls = h.type === '完成' ? 'ok' : 'no';
      return '<div class="hist-item">' +
        '<div class="hi-left">' +
          '<span class="hi-idx">第 ' + h.idx + ' 次</span>' +
          '<span class="hi-type ' + cls + '">' + h.type + '</span>' +
        '</div>' +
        '<div class="hi-right">' +
          '<span class="hi-time">' + fmtTime(h.secs) + '</span>' +
          '<span class="hi-clock">' + fmtClock(h.at) + '</span>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  /* =====================================================
     7. 匯出到剪貼簿
     ===================================================== */
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        toast('✅ 已複製到剪貼簿');
      }).catch(function () {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      const ok = document.execCommand('copy');
      toast(ok ? '✅ 已複製到剪貼簿' : '❌ 複製失敗');
    } catch (e) {
      toast('❌ 複製失敗');
    }
    document.body.removeChild(ta);
  }

  function exportHistory() {
    const now = new Date();
    const lines = [];
    lines.push('════ 粵語運動計時器 記錄 ════');
    lines.push('匯出日期：' + fmtFull(now));
    if (state.exerciseStart) {
      lines.push('開始時間：' + fmtFull(state.exerciseStart));
      const dur = Math.floor((now - state.exerciseStart) / 1000);
      lines.push('實際經過：' + fmtTime(dur));
    }
    lines.push('────────────────────────');

    if (!state.history.length) {
      lines.push('（無記錄）');
    } else {
      state.history.forEach(function (h) {
        lines.push(
          '第 ' + h.idx + ' 次  |  ' + h.type +
          '  |  ' + fmtTime(h.secs) +
          '  |  ' + fmtClock(h.at)
        );
      });
    }

    lines.push('────────────────────────');
    const total = Math.floor(state.totalSeconds);
    const m = Math.floor(total / 60), s = total % 60;
    lines.push('總完成次數：' + state.completedCount + ' 次');
    lines.push('總耗時：' + m + '分' + pad2(s) + '秒');
    if (state.summary) lines.push('總結：' + state.summary);
    lines.push('════════════════════════');

    copyText(lines.join('\n'));
  }

  /* =====================================================
     8. 建立報時間隔按鈕
     ===================================================== */
  const INTERVALS = [
    { v: 1,   l: '1秒' },
    { v: 2,   l: '2秒' },
    { v: 5,   l: '5秒' },
    { v: 10,  l: '10秒' },
    { v: 30,  l: '30秒' },
    { v: 60,  l: '1分鐘' },
    { v: 120, l: '2分鐘' },
    { v: 300, l: '5分鐘' }
  ];

  (function buildIntervalButtons() {
    const wrap = $('intervals');
    INTERVALS.forEach(function (it) {
      const b = document.createElement('button');
      b.textContent = it.l;
      b.dataset.v = it.v;
      b.addEventListener('click', function () {
        state.intervalSec = it.v;
        // 避免即刻重複報同一個時間點
        state.lastSpokenSec = Math.floor(state.lastSpokenSec / it.v) * it.v;
        markIntervalActive();
        toast('報時間隔：' + it.l);
      });
      wrap.appendChild(b);
    });
    markIntervalActive();
  })();

  function markIntervalActive() {
    const btns = $('intervals').querySelectorAll('button');
    for (let i = 0; i < btns.length; i++) {
      const v = parseInt(btns[i].dataset.v, 10);
      if (v === state.intervalSec) btns[i].classList.add('active');
      else btns[i].classList.remove('active');
    }
  }

  /* =====================================================
     9. 主按鈕事件
     ===================================================== */
  $('btnVoice').addEventListener('click', function () {
    primeSpeech();
    if (wantListen) stopListening();
    else startListening();
  });

  $('btnReset').addEventListener('click', function () {
    stopTicker();
    if (synth) { try { synth.cancel(); } catch (e) {} }
    state = freshState();
    markIntervalActive();
    renderHistory();
    updateStats();
    setStatus(wantListen ? '聆聽中…' : '已重置', wantListen ? 'on' : '');
    toast('已重置');
  });

  $('rateUp').addEventListener('click', function () {
    rate = Math.min(4, +(rate + 0.2).toFixed(1));
    $('rateVal').textContent = rate.toFixed(1) + '×';
  });

  $('rateDown').addEventListener('click', function () {
    rate = Math.max(0.5, +(rate - 0.2).toFixed(1));
    $('rateVal').textContent = rate.toFixed(1) + '×';
  });

  $('rateTest').addEventListener('click', function () {
    primeSpeech();
    speak('開始，一，二，三，一分鐘，一分一秒，第' + num2yue(3) + '次完成');
  });

  $('btnExport').addEventListener('click', exportHistory);

  /* =====================================================
     10. 初始化
     ===================================================== */
  $('rateVal').textContent = rate.toFixed(1) + '×';
  renderHistory();
  updateStats();

  if (!SR) {
    showWarn('⚠️ 此瀏覽器不支援語音辨識（Web Speech API）。建議使用 Chrome / Edge / Android Chrome / iOS Safari 14.5+。');
  }
  if (!synth) {
    showWarn('⚠️ 此瀏覽器不支援語音合成，將無法朗讀報時。');
  }

  // 離開頁面時停止語音
  window.addEventListener('beforeunload', function () {
    try { if (synth) synth.cancel(); } catch (e) {}
    try { if (recog) recog.stop(); } catch (e) {}
  });

  // 由後台返回前台時，若正在計時，立即校正
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && state.running) tick();
  });

})();
</script>
</body>
</html>
