<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0f14">
<title>V11多功能計時</title>
<!--
  V11多功能計時
  ------------------------------------------------------------------
  基礎：DoExercise6.html（V6）——iOS 鎖屏後仍可朗讀 + 收音 + 執行語音命令
  功能：DoExercise7.html（V7）——完整 UI / 匯出 / 報時 chips / 回音過濾 / 總結
  本版：V11——項目名稱系統 / 暫停繼續 / 完成a次 / 計時選擇（含全日）/
        獨立回數 / 摘要匯總 / 語音數字完整性（P0）

  【核心不可改動區】（V6 鎖屏續航的來源，任何重構都不得破壞）
   1. speak() 必須「同步」：cancel() 之後立即 speechSynthesis.speak()，
      嚴禁加入 setTimeout / requestAnimationFrame 等延遲。
   2. 啟動語音控制時，必須在 click 手勢中呼叫「有聲」的 speak('準備好', true)
      （volume = 1），不可改成靜音 utterance。
   3. 計時用常駐 setInterval(tick, 30)，不可因 visibilitychange 而停止。
   4. recognition.onend 必須自動重啟（120ms），startRecognition() 需有
      try/catch + 250ms 重試。
   5. 朗讀內容避免出現觸發字（開始／取消／結束），以免自我觸發。
      「完成」靠回音過濾（4000ms）阻擋。
  ==================================================================
-->
<style>
  :root{
    --bg:#0d0f14; --panel:#171b23; --panel2:#1f242e; --panel3:#262c38;
    --accent:#4ade80; --accent2:#22d3ee; --danger:#f87171; --warn:#fbbf24;
    --text:#e6e9ef; --dim:#8b93a3; --line:#2a3140;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg); color:var(--text); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans CJK HK","Microsoft JhengHei",sans-serif;
    height:100vh; height:100dvh;
    -webkit-user-select:none; user-select:none;
    overscroll-behavior:none;
  }
  .wrap{
    display:flex; flex-direction:column; height:100%;
    max-width:560px; margin:0 auto; padding:10px 12px 12px; gap:8px;
  }

  /* ---------- 頂欄狀態（最上一行） ---------- */
  .status{
    text-align:center; font-size:16px; font-weight:800; letter-spacing:1px;
    padding:9px; border-radius:10px; background:var(--panel);
    color:var(--dim); transition:all .2s;
  }
  .status.off{color:var(--danger);}                    /* 未啟動：紅字 */
  .status.idle-on{color:var(--accent2);}               /* 待機：淺藍字 */
  .status.running{color:#052e16;background:linear-gradient(90deg,#4ade80,#22d3ee);}
  .status.paused{color:#450a0a;background:linear-gradient(90deg,#fde68a,#fbbf24);}
  .status.ended{color:#450a0a;background:linear-gradient(90deg,#fca5a5,#f87171);}

  /* ---------- 數據卡 ---------- */
  .stats{display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:8px;}
  .stat{
    background:var(--panel); border-radius:12px; padding:10px 8px;
    text-align:center; border:1px solid var(--line);
  }
  .stat .label{font-size:12px;color:var(--dim);margin-bottom:4px;letter-spacing:.5px;}
  .stat .value{
    font-size:22px; font-weight:800; font-variant-numeric:tabular-nums;
    color:var(--text);
  }
  .stat .value.acc{color:var(--accent);}
  .stat .value.cy{color:var(--accent2);}

  /* ---------- 報數間隔 chips ---------- */
  .chips{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .rowLbl{font-size:12px; color:var(--dim); letter-spacing:1px; flex:0 0 auto;}
  .chipWrap{display:flex; gap:6px; flex-wrap:wrap; flex:1;}
  .chip{
    border:1px solid var(--line); background:var(--panel); color:var(--dim);
    border-radius:999px; padding:5px 10px; font-size:12px;
    font-family:inherit; font-weight:700; cursor:pointer; transition:all .15s;
  }
  .chip.active{background:#1d6ef5; border-color:#1d6ef5; color:#fff;}
  .chip:active{transform:scale(.95);}

  /* ---------- 歷史標題 ---------- */
  .hist-head{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:2px 4px; font-size:13px; color:var(--dim); letter-spacing:.5px;
  }
  .hist-head b{color:var(--text);}

  /* ---------- 控制列 ---------- */
  .controlbar{display:flex; gap:5px; align-items:stretch;}
  .controlbar .btn{
    flex:1 1 0; min-width:0; padding:9px 4px; font-size:11px; font-weight:700;
    border-radius:10px; white-space:nowrap; overflow:hidden; border:none;
    color:var(--text); background:var(--panel2); font-family:inherit;
    cursor:pointer; transition:transform .08s, background .15s, box-shadow .15s;
  }
  .controlbar .btn:active{transform:scale(.96);}
  .controlbar .btn.primary{flex:1.25 1 0;background:linear-gradient(135deg,#2563eb,#1d4ed8);}
  .controlbar .btn.primary.on{
    background:linear-gradient(135deg,#059669,#10b981);
    box-shadow:0 0 0 2px rgba(74,222,128,.35), 0 0 14px rgba(74,222,128,.35);
  }
  .controlbar .btn.ghost{background:var(--panel2);}
  .controlbar .btn:disabled{opacity:.45;}

  .controlbar .rate{
    flex:1.4 1 0; min-width:0;
    display:flex; align-items:center; justify-content:space-between;
    background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:2px 3px; gap:2px;
  }
  .controlbar .btn.tiny{
    flex:0 0 auto; width:28px; height:28px; padding:0; border-radius:8px;
    font-size:15px; line-height:1; background:var(--panel3); color:var(--text);
    border:none; font-family:inherit; cursor:pointer; font-weight:700;
  }
  .controlbar .btn.tiny:active{transform:scale(.92);}
  #rateVal{
    flex:1 1 auto; font-size:11px; font-weight:700; min-width:0;
    text-align:center; font-variant-numeric:tabular-nums; color:var(--warn);
  }

  /* ---------- 歷史 ---------- */
  .history{
    flex:1; min-height:80px; overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:var(--panel); border-radius:12px; border:1px solid var(--line);
    padding:6px; display:flex; flex-direction:column; gap:6px;
  }
  .history::-webkit-scrollbar{width:4px;}
  .history::-webkit-scrollbar-thumb{background:#3a4254;border-radius:4px;}
  .empty{color:var(--dim);font-size:13px;text-align:center;padding:18px 0;}
  .hist-item{
    display:flex; align-items:center; gap:8px;
    padding:9px 11px; border-radius:9px; background:var(--panel2);
    border-left:4px solid var(--accent);
    animation:slideIn .22s ease-out;
  }
  .hist-item.cancel{border-left-color:var(--danger);}
  @keyframes slideIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
  .hi-seq{font-size:11px;color:var(--dim);font-weight:700;min-width:22px;}
  .hi-idx{font-weight:800;font-size:13px;min-width:86px;}
  .hi-res{
    font-size:12px; font-weight:700; padding:2px 9px; border-radius:20px;
    background:rgba(74,222,128,.15); color:var(--accent);
  }
  .hist-item.cancel .hi-res{background:rgba(248,113,113,.15);color:var(--danger);}
  .hi-time{margin-left:auto;font-variant-numeric:tabular-nums;font-size:13px;color:var(--dim);}

  /* ---------- 總結 ---------- */
  .summary{
    background:linear-gradient(135deg,#1e293b,#0f172a);
    border:1px solid var(--accent2); border-radius:12px;
    padding:12px 14px; font-size:15px; line-height:1.7; text-align:center;
    animation:slideIn .3s ease-out;
  }
  .summary .big{font-size:20px;font-weight:800;color:var(--accent2);}
  .hidden{display:none !important;}

  /* 提示 */
  .hint{font-size:11px;color:var(--dim);text-align:center;letter-spacing:.3px;line-height:1.6;}

  /* Toast */
  #toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px);
    background:#e6e9ef; color:#0d0f14; padding:10px 20px; border-radius:999px;
    font-size:13px; font-weight:700; opacity:0; pointer-events:none;
    transition:all .25s; z-index:99; max-width:86vw; text-align:center;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">

  <!-- 最上一行：狀態（未啟動 / 待機 / 計時中 / 已暫停 / 已結束） -->
  <div id="status" class="status">未啟動</div>

  <div class="stats">
    <div class="stat"><div class="label">總時間</div><div id="totalTime" class="value acc">00:00</div></div>
    <div class="stat"><div class="label">完成次數</div><div id="completedVal" class="value cy">0</div></div>
    <div class="stat"><div class="label">本回合</div><div id="roundSec" class="value">0.0</div></div>
  </div>

  <div class="chips">
    <span class="rowLbl">計時選擇</span>
    <div id="intervalBtns" class="chipWrap"></div>
  </div>

  <div class="hist-head">
    <span>歷史記錄</span>
    <span>共 <b id="histCount">0</b> 條</span>
  </div>

  <!-- 控制列：由左至右 = 語速 / 複製記錄 / 重置 / 語音控制 -->
  <div class="controlbar">
    <div class="rate">
      <button id="rateDown" class="btn tiny" aria-label="減慢語速">−</button>
      <span id="rateVal">1.3x</span>
      <button id="rateUp" class="btn tiny" aria-label="加快語速">＋</button>
    </div>
    <button id="exportBtn" class="btn ghost">📋 複製記錄</button>
    <button id="resetBtn" class="btn ghost">🔄 重置</button>
    <button id="voiceBtn" class="btn primary">🎤 語音控制</button>
  </div>

  <div id="history" class="history">
    <div class="empty">暫無記錄</div>
  </div>

  <div id="summary" class="summary hidden"></div>
  <div class="hint">
    說「開始」+項目名稱 開始計時・「完成」或「完成a次」結束<br>
    說「暫停」暫停計時・「繼續」恢復・「取消」取消・「結束」總結<br>
    說「報數」即時報數・「報時」報日期時間（僅待機或暫停時）・「知道」回復正常報數
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  'use strict';

  /* =========================================================
     一、DOM 與狀態
     ========================================================= */
  const $ = (id) => document.getElementById(id);

  const voiceBtn     = $('voiceBtn');
  const resetBtn     = $('resetBtn');
  const exportBtn    = $('exportBtn');
  const statusEl     = $('status');
  const totalTimeEl  = $('totalTime');
  const completedEl  = $('completedVal');
  const roundSecEl   = $('roundSec');
  const rateValEl    = $('rateVal');
  const rateDownBtn  = $('rateDown');
  const rateUpBtn    = $('rateUp');
  const intervalEl   = $('intervalBtns');
  const historyEl    = $('history');
  const histCountEl  = $('histCount');
  const summaryEl    = $('summary');
  const toastEl      = $('toast');

  const STATE = { IDLE: 'idle', RUNNING: 'running', PAUSED: 'paused', ENDED: 'ended' };

  let state            = STATE.IDLE;
  let completedCount   = 0;          // 累計「次」數（a 的總和）
  let completedTotalSec = 0;         // 累計秒數
  let firstStartMs     = null;
  let sessionDate      = null;
  let totalMs          = 0;
  let roundStartMs     = 0;
  let roundSec         = 0;
  let roundPauseMs     = 0;          // 本回合內累計暫停毫秒
  let totalPauseMs     = 0;          // 全部累計暫停毫秒
  let pauseStartMs     = 0;          // 暫停起點 perfNow
  let lastReportedSec  = 0;
  let reportInterval   = 1;          // 0 = 全日（不自動報數）
  let speechRate       = 1.3;
  let voiceControlOn   = false;
  let history          = [];         // {seq, project, round, result, sec, count}
  let tickTimer        = null;
  let cantoVoice       = null;
  let sessionEnded     = false;

  let fastReportMode   = false;
  let numberHold       = false;

  // 項目系統
  let currentProject   = null;       // 目前的默認項目名稱
  let projectRounds    = {};         // 項目名 → 已完成的回數

  const REPORT_STEPS  = [1, 2, 5, 10, 30, 60, 120, 300, 600, 900, 1800, 2700, 3600, 0];
  const REPORT_LABELS = {
    1:'1秒', 2:'2秒', 5:'5秒', 10:'10秒', 30:'30秒',
    60:'1分鐘', 120:'2分鐘', 300:'5分鐘',
    600:'10分鐘', 900:'15分鐘', 1800:'30分鐘', 2700:'45分鐘', 3600:'60分鐘',
    0:'全日'
  };

  function perfNow() {
    return (window.performance && window.performance.now)
      ? window.performance.now()
      : Date.now();
  }

  /* =========================================================
     二、粵語數字 / 時間朗讀字串
     ========================================================= */
  const DIGITS = ['零','一','二','三','四','五','六','七','八','九'];

  function numToCanto(n) {
    n = Math.floor(n);
    if (n <= 0) return '零';
    if (n < 10) return DIGITS[n];
    if (n < 20) return '十' + (n % 10 ? DIGITS[n % 10] : '');
    if (n < 100) {
      const t = Math.floor(n / 10), o = n % 10;
      return DIGITS[t] + '十' + (o ? DIGITS[o] : '');
    }
    const h = Math.floor(n / 100), r = n % 100;
    return DIGITS[h] + '百' + (r === 0 ? '' : (r < 10 ? '零' + DIGITS[r] : numToCanto(r)));
  }

  function numToCanto2(n) {
    n = Math.floor(n);
    return n === 2 ? '兩' : numToCanto(n);
  }

  function secToCanto(sec) {
    sec = Math.floor(sec);
    if (sec < 60) return sec <= 0 ? '零' : numToCanto(sec);
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    let mStr;
    if (m === 1) mStr = '一分';
    else if (m === 2) mStr = '兩分';
    else mStr = numToCanto(m) + '分';
    if (s === 0) return mStr + '鐘';
    return mStr + numToCanto(s);
  }

  function formatSec(sec) {
    sec = Math.floor(sec);
    if (sec < 60) return sec + '秒';
    const m = Math.floor(sec / 60), s = sec % 60;
    return m + '分' + String(s).padStart(2, '0') + '秒';
  }

  // 顯示用（例：2分鐘 / 50秒 / 1分05秒）
  function formatDuration(sec) {
    sec = Math.floor(sec);
    if (sec < 60) return sec + '秒';
    const m = Math.floor(sec / 60), s = sec % 60;
    if (s === 0) return m + '分鐘';
    return m + '分' + String(s).padStart(2, '0') + '秒';
  }

  function formatMs(ms) {
    const t = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(t / 3600);
    const m = Math.floor((t % 3600) / 60);
    const s = t % 60;
    const mm = String(m).padStart(2, '0');
    const ss = String(s).padStart(2, '0');
    return h > 0 ? h + ':' + mm + ':' + ss : mm + ':' + ss;
  }

  function fmtClock(d) {
    const p = n => String(n).padStart(2, '0');
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  const WEEK_CANTO = ['日','一','二','三','四','五','六'];

  function yearToCanto(y) {
    return String(y).split('').map(function (c) {
      const d = DIGITS[+c];
      return (d === undefined) ? '' : d;
    }).join('');
  }

  function cantoDate(d) {
    const y  = d.getFullYear();
    const mo = d.getMonth() + 1;
    const da = d.getDate();
    const wk = WEEK_CANTO[d.getDay()];
    const h24 = d.getHours();
    const mi  = d.getMinutes();
    const se  = d.getSeconds();

    let period, h12;
    if (h24 >= 5 && h24 < 12) {
      period = '早上'; h12 = h24;
    } else if (h24 >= 12 && h24 < 18) {
      period = '下午'; h12 = (h24 - 12) || 12;
    } else {
      period = '晚上'; h12 = (h24 % 12) || 12;
    }

    return '今日係' + yearToCanto(y) + '年' + numToCanto(mo) + '月' + numToCanto(da) + '日，'
         + '星期' + wk + '，'
         + period + numToCanto(h12) + '時' + numToCanto(mi) + '分' + numToCanto(se) + '秒';
  }

  /* ---- 中文數字 → 整數（含阿拉伯數字）---- */
  const CN_DIGIT = {'零':0,'〇':0,'一':1,'二':2,'兩':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  const CN_UNIT  = {'十':10,'百':100,'千':1000,'萬':10000,'万':10000};

  function cantoToNum(s) {
    s = String(s).trim();
    if (!s) return NaN;
    if (/^\d+$/.test(s)) return parseInt(s, 10);

    let total = 0, section = 0, current = 0;
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (CN_DIGIT[c] !== undefined) {
        current = CN_DIGIT[c];
      } else if (CN_UNIT[c] !== undefined) {
        const u = CN_UNIT[c];
        if (u === 10000) {
          section = (section + current) * u;
          total += section;
          section = 0; current = 0;
        } else {
          if (current === 0) current = 1;
          section += current * u;
          current = 0;
        }
      } else {
        return NaN;
      }
    }
    return total + section + current;
  }

  /* =========================================================
     三、語音合成 (TTS) —— V6 核心，嚴禁改動
     ========================================================= */
  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices() || [];
    cantoVoice =
      vs.find(v => /zh[-_]HK/i.test(v.lang)) ||
      vs.find(v => /yue/i.test(v.lang)) ||
      vs.find(v => /zh[-_]TW/i.test(v.lang)) ||
      vs.find(v => /zh/i.test(v.lang)) ||
      null;
  }
  if ('speechSynthesis' in window) {
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
  }

  const recentSpoken = [];
  const ECHO_WINDOW_MS = 4000;   // 因為會朗讀「完成xxx次」，需較長回音窗

  function speak(text, interrupt, onEnd) {
    if (!('speechSynthesis' in window)) return;

    recentSpoken.push({ text: text, t: Date.now() });
    if (recentSpoken.length > 60) recentSpoken.shift();

    try {
      if (interrupt !== false) speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-HK';
      if (cantoVoice) u.voice = cantoVoice;
      u.rate = speechRate;
      u.pitch = 1;
      u.volume = 1;
      if (typeof onEnd === 'function') u.onend = onEnd;
      speechSynthesis.speak(u);
    } catch (e) { /* ignore */ }
  }

  function isEcho(text, now) {
    const t = String(text).replace(/[\s，。！？、,.!?·]/g, '');
    if (!t) return false;
    for (let i = recentSpoken.length - 1; i >= 0; i--) {
      const s = recentSpoken[i];
      if (now - s.t > ECHO_WINDOW_MS) break;
      if (s.text.indexOf(t) !== -1) return true;
    }
    return false;
  }

  /* =========================================================
     四、語音辨識 (ASR) —— V6 核心，嚴禁改動
     ========================================================= */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let recognitionRunning = false;
  let restartTimer = null;
  let lastCmd = '';
  let lastCmdAt = 0;

  function initRecognition() {
    if (!SR) return null;
    const r = new SR();
    r.lang = 'zh-HK';
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;

    r.onstart = () => { recognitionRunning = true; };

    r.onresult = (e) => {
      let finalText = '';
      let interimText = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const res = e.results[i];
        const t = res[0].transcript;
        if (res.isFinal) finalText += t;
        else interimText += t;
      }
      finalText = finalText.replace(/[\s,，。.!！?？、·]/g, '');
      interimText = interimText.replace(/[\s,，。.!！?？、·]/g, '');
      if (finalText) dispatch(finalText, true);
      if (interimText) dispatch(interimText, false);
    };

    r.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        voiceControlOn = false;
        updateUI();
        alert('麥克風權限被拒絕，請在瀏覽器設定中允許使用麥克風。');
      }
    };

    r.onend = () => {
      recognitionRunning = false;
      if (voiceControlOn && !sessionEnded) {
        clearTimeout(restartTimer);
        restartTimer = setTimeout(startRecognition, 120);
      }
    };

    return r;
  }
  recognition = initRecognition();

  function startRecognition() {
    if (!recognition || recognitionRunning) return;
    try {
      recognition.start();
      recognitionRunning = true;
    } catch (e) {
      recognitionRunning = false;
      clearTimeout(restartTimer);
      restartTimer = setTimeout(() => {
        if (voiceControlOn && !sessionEnded) startRecognition();
      }, 250);
    }
  }

  function stopRecognition() {
    clearTimeout(restartTimer);
    if (!recognition) return;
    try { recognition.stop(); } catch (e) {}
    recognitionRunning = false;
  }

  /* =========================================================
     五、指令分派
     ========================================================= */
  function dispatch(raw, isFinal) {
    if (sessionEnded) return;

    const now = Date.now();
    if (isEcho(raw, now)) return;

    // 順序：先長後短，避免誤判
    if (/結束|结束/.test(raw)) { fire('end', now); return; }
    if (/取消/.test(raw)) { fire('cancel', now); return; }
    if (/暫停|暂停/.test(raw)) { fire('pause', now); return; }
    if (/繼續|继续/.test(raw)) { fire('resume', now); return; }
    if (/完成/.test(raw)) { handleComplete(raw, isFinal, now); return; }
    if (/開始|开始/.test(raw)) { handleStart(raw, isFinal, now); return; }
    if (/報時|报时/.test(raw)) {
      if (state === STATE.IDLE || state === STATE.PAUSED || state === STATE.ENDED) {
        fire('clock', now);
      } else {
        toast('⏱️ 報時只可在待機或暫停時使用');
      }
      return;
    }
    if (/報數|报数/.test(raw)) { fire('count', now); return; }
    if (/知道/.test(raw))     { fire('know',  now); return; }
  }

  function fire(cmd, now) {
    if (cmd === lastCmd && now - lastCmdAt < 900) return;
    lastCmd = cmd; lastCmdAt = now;

    switch (cmd) {
      case 'cancel': if (state === STATE.RUNNING || state === STATE.PAUSED) cancelRound(); break;
      case 'pause':  if (state === STATE.RUNNING) pauseRound();  break;
      case 'resume': if (state === STATE.PAUSED)  resumeRound(); break;
      case 'end':    endSession(); break;
      case 'clock':  reportDateTime(); break;
      case 'count':  reportNow();      break;
      case 'know':   exitFastReport(); break;
    }
  }

  /* ---- 開始xxx 解析（只認 final）---- */
  function handleStart(raw, isFinal, now) {
    if (state === STATE.RUNNING || state === STATE.PAUSED) return;
    if (state === STATE.ENDED) return;
    if (!isFinal) return;  // 只認 final，避免「聽漏xxx」時誤判

    const m = raw.match(/開始(.+)/) || raw.match(/开始(.+)/);
    let project = null;
    if (m) {
      project = m[1].replace(/[\s，。！？,.!?、·]/g, '').trim();
      if (!project) project = null;
    }

    if (project) {
      startRound(project);
    } else {
      // 只說「開始」：用當前默認項目（沒設定過就不動作）
      if (currentProject) startRound(currentProject);
      else toast('請講「開始」+項目名稱');
    }
  }

  /* ---- 完成 / 完成a次 解析（數字完整性 P0）---- */
  let pendingCompleteCount = 0;
  let pendingCompleteTimer = null;
  let lastCompleteAt = 0;

  function parseCompleteCount(text) {
    const idx = text.indexOf('完成');
    if (idx === -1) return 1;
    let rest = text.substring(idx + 2);
    rest = rest.replace(/^[咗了都]/, '');

    // 先試阿拉伯數字
    const am = rest.match(/^(\d+)/);
    if (am) {
      const n = parseInt(am[1], 10);
      if (n > 0) return n;
    }
    // 再試中文數字
    const cm = rest.match(/^([零〇一二兩两三四五六七八九十百千萬万]+)/);
    if (cm) {
      const n = cantoToNum(cm[1]);
      if (!isNaN(n) && n > 0) return n;
    }
    return 1;
  }

  function handleComplete(raw, isFinal, now) {
    if (state !== STATE.RUNNING && state !== STATE.PAUSED) return;
    if (now - lastCompleteAt < 700) return;   // 防抖

    const count = parseCompleteCount(raw);

    if (isFinal) {
      // final：用待處理值與本次值取最大
      const finalCount = Math.max(pendingCompleteCount, count);
      if (pendingCompleteTimer) {
        clearTimeout(pendingCompleteTimer);
        pendingCompleteTimer = null;
      }
      pendingCompleteCount = 0;
      lastCompleteAt = now;
      commitComplete(finalCount);
      return;
    }

    // interim：延遲記錄 + 緩衝
    pendingCompleteCount = Math.max(pendingCompleteCount, count);
    if (!pendingCompleteTimer) {
      pendingCompleteTimer = setTimeout(function () {
        pendingCompleteTimer = null;
        const c = pendingCompleteCount || 1;
        pendingCompleteCount = 0;
        if (state === STATE.RUNNING || state === STATE.PAUSED) {
          lastCompleteAt = Date.now();
          commitComplete(c);
        }
      }, 1500);
    }
  }

  /* =========================================================
     六、核心計時邏輯
     ========================================================= */
  function startRound(project) {
    if (state === STATE.ENDED || state === STATE.RUNNING || state === STATE.PAUSED) return;

    currentProject = project;

    if (firstStartMs === null) {
      firstStartMs = perfNow();
      sessionDate = new Date();
    }

    state = STATE.RUNNING;
    roundStartMs = perfNow();
    roundPauseMs = 0;
    roundSec = 0;
    lastReportedSec = 0;
    fastReportMode = false;
    numberHold = false;

    if (!tickTimer) tickTimer = setInterval(tick, 30);

    speak('開始' + project, true);
    updateUI();
  }

  function tick() {
    const now = perfNow();

    if (firstStartMs !== null && !sessionEnded) {
      if (state === STATE.RUNNING) {
        totalMs = now - firstStartMs - totalPauseMs;
        totalTimeEl.textContent = formatMs(totalMs);
      }
      // PAUSED / IDLE 時凍結
    }

    if (state !== STATE.RUNNING) return;

    const elapsedMs = now - roundStartMs - roundPauseMs;
    const sec = Math.floor(elapsedMs / 1000);

    roundSec = sec;
    roundSecEl.textContent = (elapsedMs / 1000).toFixed(1);

    if (sec < 1 || sec <= lastReportedSec) return;
    if (numberHold) return;

    // 全日模式：不自動報數
    if (reportInterval === 0) {
      lastReportedSec = sec;
      return;
    }

    if (fastReportMode) {
      if (sec % 5 === 0) {
        lastReportedSec = sec;
        speak(secToCanto(sec), true);
      }
      return;
    }

    if (reportInterval === 1 || sec % reportInterval === 0) {
      lastReportedSec = sec;

      if (reportInterval >= 60 && sec >= reportInterval) {
        fastReportMode = true;
        toast('夠鐘！轉為每 5 秒報數，講「知道」回復正常');
        speak('夠鐘', true);
      } else {
        speak(secToCanto(sec), true);
      }
    }
  }

  function stopTick() {
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
  }

  /* ---- 暫停 ---- */
  function pauseRound() {
    if (state !== STATE.RUNNING) return;
    state = STATE.PAUSED;
    pauseStartMs = perfNow();
    try { speechSynthesis.cancel(); } catch (e) {}
    toast('⏸️ 已暫停，講「繼續」恢復');
    updateUI();
  }

  function resumeRound() {
    if (state !== STATE.PAUSED) return;
    const dur = perfNow() - pauseStartMs;
    totalPauseMs += dur;
    roundPauseMs += dur;
    pauseStartMs = 0;
    state = STATE.RUNNING;
    // 從暫停點繼續報數：讓 lastReportedSec 對齊當前
    const sec = Math.floor((perfNow() - roundStartMs - roundPauseMs) / 1000);
    lastReportedSec = sec;
    toast('▶️ 已繼續');
    updateUI();
  }

  /* ---- 完成（commitComplete）---- */
  function commitComplete(count) {
    if (state !== STATE.RUNNING && state !== STATE.PAUSED) return;
    if (!currentProject) return;

    const now = perfNow();
    let elapsedMs;
    if (state === STATE.PAUSED) {
      elapsedMs = pauseStartMs - roundStartMs - roundPauseMs;
    } else {
      elapsedMs = now - roundStartMs - roundPauseMs;
    }
    if (elapsedMs < 0) elapsedMs = 0;
    const sec = Math.floor(elapsedMs / 1000);

    // 回數（該項目獨立序號）
    if (!projectRounds[currentProject]) projectRounds[currentProject] = 0;
    projectRounds[currentProject] += 1;
    const roundNum = projectRounds[currentProject];

    // 主序號
    const seq = history.length + 1;

    const item = {
      seq: seq,
      project: currentProject,
      round: roundNum,
      result: '完成',
      sec: sec,
      count: count
    };
    history.push(item);

    completedCount += count;
    completedTotalSec += sec;

    // 復位
    state = STATE.IDLE;
    fastReportMode = false;
    numberHold = false;
    roundPauseMs = 0;
    pauseStartMs = 0;

    renderHistory();
    updateUI();

    // 朗讀最新一回記錄
    const msg = '第' + numToCanto(roundNum) + '回' + currentProject
              + '完成' + numToCanto(count) + '次用了' + secToCanto(sec);
    speak(msg, true);
    toast('✅ ' + msg);
  }

  /* ---- 取消 ---- */
  function cancelRound() {
    if (state !== STATE.RUNNING && state !== STATE.PAUSED) return;
    if (!currentProject) return;

    const now = perfNow();
    let elapsedMs;
    if (state === STATE.PAUSED) {
      elapsedMs = pauseStartMs - roundStartMs - roundPauseMs;
    } else {
      elapsedMs = now - roundStartMs - roundPauseMs;
    }
    if (elapsedMs < 0) elapsedMs = 0;
    const sec = Math.floor(elapsedMs / 1000);

    const seq = history.length + 1;
    const roundNum = (projectRounds[currentProject] || 0) + 1;

    const item = {
      seq: seq,
      project: currentProject,
      round: roundNum,
      result: '取消',
      sec: sec,
      count: 0
    };
    history.push(item);

    state = STATE.IDLE;
    fastReportMode = false;
    numberHold = false;
    roundPauseMs = 0;
    pauseStartMs = 0;

    renderHistory();
    updateUI();
    speak('第' + numToCanto(roundNum) + '回' + currentProject + '取消', true);
  }

  /* ---- 結束 ---- */
  function endSession() {
    if (sessionEnded) return;

    if (state === STATE.RUNNING || state === STATE.PAUSED) {
      state = STATE.IDLE;
    }
    sessionEnded = true;
    state = STATE.ENDED;
    voiceControlOn = false;
    fastReportMode = false;
    numberHold = false;
    stopRecognition();
    stopTick();

    if (firstStartMs !== null) {
      totalMs = perfNow() - firstStartMs - totalPauseMs;
    }
    const totalSec = Math.floor(totalMs / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;

    let txt = '今次運動，你總共完成咗' + numToCanto(completedCount) + '次，';
    if (m > 0 && s > 0)      txt += '用咗' + numToCanto2(m) + '分' + numToCanto2(s) + '秒';
    else if (m > 0)          txt += '用咗' + numToCanto2(m) + '分鐘';
    else                     txt += '用咗' + numToCanto(s) + '秒';
    speak(txt, true);

    // 建立摘要（同項目匯總）
    const byProject = {};
    const order = [];
    let sumSec = 0;
    for (let i = 0; i < history.length; i++) {
      const it = history[i];
      if (it.result !== '完成') continue;
      if (!byProject[it.project]) {
        byProject[it.project] = { count: 0, sec: 0 };
        order.push(it.project);
      }
      byProject[it.project].count += it.count;
      byProject[it.project].sec += it.sec;
      sumSec += it.sec;
    }

    let html = '🏁 今次運動總結<br>';
    if (order.length === 0) {
      html += '<span style="font-size:13px;color:#8b93a3">（未有任何完成記錄）</span>';
    } else {
      html += '<div style="text-align:left;display:inline-block;font-size:14px;line-height:1.8">';
      for (let i = 0; i < order.length; i++) {
        const p = order[i];
        const d = byProject[p];
        html += (i + 1) + '. ' + p + '：<b>' + d.count + '次</b>共 ' + formatDuration(d.sec) + '<br>';
      }
      html += '<span style="color:#22d3ee">總耗時：' + formatDuration(sumSec) + '</span>';
      html += '</div>';
    }
    summaryEl.classList.remove('hidden');
    summaryEl.innerHTML = html;

    updateUI();
  }

  /* =========================================================
     六之二、額外指令實作
     ========================================================= */

  /** 「報時」：朗讀現在日期時間；期間暫停報數，講完自動回復 */
  function reportDateTime() {
    const now = Date.now();
    if (reportDateTime._last && now - reportDateTime._last < 2000) return;
    reportDateTime._last = now;

    const txt = cantoDate(new Date());
    numberHold = true;

    clearTimeout(reportDateTime._t);
    reportDateTime._t = setTimeout(function () { numberHold = false; }, 20000);

    speak(txt, true, function () {
      clearTimeout(reportDateTime._t);
      numberHold = false;
    });

    toast('🗓️ 報時中…');
  }

  /** 「報數」：即時報一次現在數目 */
  function reportNow() {
    const now = Date.now();
    if (reportNow._last && now - reportNow._last < 1200) return;
    reportNow._last = now;

    let sec = 0;
    if (state === STATE.RUNNING) {
      sec = Math.floor((perfNow() - roundStartMs - roundPauseMs) / 1000);
    } else if (state === STATE.PAUSED) {
      sec = Math.floor((pauseStartMs - roundStartMs - roundPauseMs) / 1000);
    }
    if (sec < 0) sec = 0;
    lastReportedSec = sec;
    speak(secToCanto(sec), true);
    toast('🔢 即時報數：' + sec + ' 秒');
  }

  /** 「知道」：結束每 5 秒快速報數，回復原本間隔 */
  function exitFastReport() {
    if (!fastReportMode) return;
    fastReportMode = false;
    if (state === STATE.RUNNING) {
      lastReportedSec = Math.floor((perfNow() - roundStartMs - roundPauseMs) / 1000);
    } else {
      lastReportedSec = 0;
    }
    toast('✅ 已回復原本報數間隔');
  }

  /* =========================================================
     七、UI 更新
     ========================================================= */
  function updateUI() {
    statusEl.className = 'status';
    if (state === STATE.RUNNING) {
      statusEl.textContent = '🔴 計時中… 講「完成」或「取消」';
      statusEl.classList.add('running');
    } else if (state === STATE.PAUSED) {
      statusEl.textContent = '⏸️ 已暫停 — 講「繼續」恢復';
      statusEl.classList.add('paused');
    } else if (state === STATE.ENDED) {
      statusEl.textContent = '✅ 已結束';
      statusEl.classList.add('ended');
    } else if (voiceControlOn) {
      statusEl.textContent = '待機 — 請講「開始」+項目名稱';
      statusEl.classList.add('idle-on');
    } else {
      statusEl.textContent = '未啟動';
      statusEl.classList.add('off');
    }

    if (voiceControlOn) {
      voiceBtn.textContent = '🎤 語音控制中';
      voiceBtn.classList.add('on');
    } else {
      voiceBtn.textContent = '🎤 語音控制';
      voiceBtn.classList.remove('on');
    }
    voiceBtn.disabled = sessionEnded;

    totalTimeEl.textContent = formatMs(totalMs);
    if (state !== STATE.RUNNING && state !== STATE.PAUSED) roundSecEl.textContent = '0.0';
    completedEl.textContent = completedCount;
    histCountEl.textContent = history.length;
  }

  /* =========================================================
     八、歷史記錄
     ========================================================= */
  function renderHistory() {
    if (!history.length) {
      historyEl.innerHTML = '<div class="empty">暫無記錄</div>';
      histCountEl.textContent = '0';
      return;
    }
    historyEl.innerHTML = history.map(h => {
      const cls = h.result === '完成' ? '' : 'cancel';
      const roundLabel = '第' + h.round + '回' + (h.project || '');
      let timeTxt;
      if (h.result === '完成') {
        timeTxt = formatDuration(h.sec) + '完成' + h.count + '次';
      } else {
        timeTxt = formatDuration(h.sec);
      }
      return '<div class="hist-item ' + cls + '">' +
               '<span class="hi-seq">' + h.seq + '.</span>' +
               '<span class="hi-idx">' + roundLabel + '</span>' +
               '<span class="hi-res">' + h.result + '</span>' +
               '<span class="hi-time">' + timeTxt + '</span>' +
             '</div>';
    }).join('');
    histCountEl.textContent = history.length;
    historyEl.scrollTop = historyEl.scrollHeight;
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove('show'), 1600);
  }

  /* =========================================================
     九、複製記錄
     ========================================================= */
  function buildRecordText() {
    const now = new Date();
    const p = n => String(n).padStart(2, '0');
    let out = '';
    out += 'V11多功能計時\n';
    out += '日期：' + now.getFullYear() + '-' + p(now.getMonth() + 1) + '-' + p(now.getDate()) + '\n';
    if (sessionDate) out += '開始時間：' + fmtClock(sessionDate) + '\n';
    out += '結束時間：' + fmtClock(now) + '\n';
    out += '\n記錄：\n';

    if (!history.length) {
      out += '（無記錄）\n';
    } else {
      for (let i = 0; i < history.length; i++) {
        const it = history[i];
        if (it.result === '完成') {
          out += it.seq + '. 第' + it.round + '回' + it.project + '\t'
              + formatDuration(it.sec) + '完成' + it.count + '次\n';
        } else {
          out += it.seq + '. 第' + it.round + '回' + it.project + '\t'
              + formatDuration(it.sec) + '（' + it.result + '）\n';
        }
      }
    }

    out += '\n完成摘要：\n';
    const byProject = {};
    const order = [];
    let sumSec = 0;
    for (let i = 0; i < history.length; i++) {
      const it = history[i];
      if (it.result !== '完成') continue;
      if (!byProject[it.project]) {
        byProject[it.project] = { count: 0, sec: 0 };
        order.push(it.project);
      }
      byProject[it.project].count += it.count;
      byProject[it.project].sec += it.sec;
      sumSec += it.sec;
    }

    if (order.length === 0) {
      out += '（無）\n';
    } else {
      for (let i = 0; i < order.length; i++) {
        const pj = order[i];
        const d = byProject[pj];
        out += (i + 1) + '. ' + pj + '：' + d.count + '次共' + formatDuration(d.sec) + '\n';
      }
      out += '總耗時：' + formatDuration(sumSec) + '\n';
    }

    return out;
  }

  async function copyRecords() {
    const txt = buildRecordText();
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(txt);
      } else {
        throw new Error('no clipboard');
      }
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = txt;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand('copy'); } catch (e2) {}
      document.body.removeChild(ta);
    }
    toast('✅ 已複製到剪貼簿');
  }

  /* =========================================================
     十、計時選擇 chips
     ========================================================= */
  (function buildIntervalButtons() {
    REPORT_STEPS.forEach((v) => {
      const b = document.createElement('button');
      b.className = 'chip' + (v === reportInterval ? ' active' : '');
      b.textContent = REPORT_LABELS[v];
      b.dataset.v = v;
      b.addEventListener('click', () => {
        reportInterval = v;
        fastReportMode = false;
        const all = intervalEl.querySelectorAll('.chip');
        for (let i = 0; i < all.length; i++) all[i].classList.remove('active');
        b.classList.add('active');
        lastReportedSec = state === STATE.RUNNING ? roundSec : 0;
        toast('計時選擇：' + REPORT_LABELS[v]);
      });
      intervalEl.appendChild(b);
    });
  })();

  /* =========================================================
     十一、按鈕事件
     ========================================================= */
  voiceBtn.addEventListener('click', () => {
    if (sessionEnded) { toast('已結束，請先按「重置」'); return; }
    if (!recognition) {
      alert('此瀏覽器不支援語音辨識。\n請使用 Chrome 或 Edge（桌面版 / Android）。');
      return;
    }
    voiceControlOn = !voiceControlOn;
    if (voiceControlOn) {
      startRecognition();
      speak('準備好', true);
    } else {
      stopRecognition();
      speechSynthesis.cancel();
    }
    updateUI();
  });

  resetBtn.addEventListener('click', () => {
    stopTick();
    state = STATE.IDLE;
    sessionEnded = false;
    completedCount = 0;
    completedTotalSec = 0;
    totalMs = 0;
    roundSec = 0;
    lastReportedSec = 0;
    roundStartMs = 0;
    roundPauseMs = 0;
    totalPauseMs = 0;
    pauseStartMs = 0;
    firstStartMs = null;
    sessionDate = null;
    history = [];
    currentProject = null;
    projectRounds = {};
    lastCmd = ''; lastCmdAt = 0;
    fastReportMode = false;
    numberHold = false;
    pendingCompleteCount = 0;
    if (pendingCompleteTimer) { clearTimeout(pendingCompleteTimer); pendingCompleteTimer = null; }
    lastCompleteAt = 0;
    reportDateTime._last = 0;
    reportNow._last = 0;
    recentSpoken.length = 0;
    summaryEl.classList.add('hidden');
    summaryEl.innerHTML = '';
    try { speechSynthesis.cancel(); } catch (e) {}
    renderHistory();
    updateUI();
    if (voiceControlOn && !sessionEnded) startRecognition();
    toast('已重置');
  });

  exportBtn.addEventListener('click', copyRecords);

  rateDownBtn.addEventListener('click', () => changeRate(-0.1));
  rateUpBtn.addEventListener('click', () => changeRate(0.1));

  function changeRate(d) {
    speechRate = Math.round((speechRate + d) * 10) / 10;
    speechRate = Math.max(0.5, Math.min(2.5, speechRate));
    rateValEl.textContent = speechRate.toFixed(1) + 'x';
  }

  /* =========================================================
     十二、初始化 —— V6 核心
     ========================================================= */
  function init() {
    rateValEl.textContent = speechRate.toFixed(1) + 'x';
    renderHistory();
    updateUI();

    if ('speechSynthesis' in window) {
      try {
        const u = new SpeechSynthesisUtterance(' ');
        u.volume = 0;
        u.lang = 'zh-HK';
        speechSynthesis.speak(u);
      } catch (e) {}
    }
  }
  init();

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      // 保留計時
    } else {
      if ((state === STATE.RUNNING) && !tickTimer) {
        tickTimer = setInterval(tick, 30);
      }
    }
  });

  document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());

})();
</script>
</body>
</html>
