<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0f14">
<title>多功能計時 V11</title>
<!--
  多功能計時 V11
  ------------------------------------------------------------------
  基礎：DoExercise6.html（V6）——iOS 鎖屏後仍可朗讀 + 收音 + 執行語音命令
  功能：DoExercise7.html（V7）——完整 UI / 匯出 / 報時 chips / 回音過濾 / 總結
  本版：V11 —— 項目名稱 / 計時選擇(含全日) / 暫停繼續 / 完成a次 / 第n回 / 主序號 z

  【核心不可改動區】（V6 鎖屏續航的來源，任何重構都不得破壞）
   1. speak() 必須「同步」：cancel() 之後立即 speechSynthesis.speak()，
      嚴禁加入 setTimeout / requestAnimationFrame 等延遲。
   2. 啟動語音控制時，必須在 click 手勢中呼叫「有聲」的 speak('準備好', true)
      （volume = 1），不可改成靜音 utterance。
   3. 計時用常駐 setInterval(tick, 30)，不可因 visibilitychange 而停止。
   4. recognition.onend 必須自動重啟（120ms），startRecognition() 需有
      try/catch + 250ms 重試。
   5. 朗讀內容避免出現觸發字（開始／完成／取消／結束），以免自我觸發。
  ==================================================================
-->
<style>
  :root{
    --bg:#0d0f14; --panel:#171b23; --panel2:#1f242e; --panel3:#262c38;
    --accent:#4ade80; --accent2:#22d3ee; --danger:#f87171; --warn:#fbbf24;
    --text:#e6e9ef; --dim:#8b93a3; --line:#2a3140;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg); color:var(--text); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans CJK HK","Microsoft JhengHei",sans-serif;
    height:100vh; height:100dvh;
    -webkit-user-select:none; user-select:none;
    overscroll-behavior:none;
  }
  .wrap{
    display:flex; flex-direction:column; height:100%;
    max-width:560px; margin:0 auto; padding:10px 12px 12px; gap:8px;
  }

  /* ---------- 頂欄狀態 ---------- */
  .status{
    text-align:center; font-size:16px; font-weight:800; letter-spacing:1px;
    padding:9px; border-radius:10px; background:var(--panel);
    color:var(--dim); transition:all .2s;
  }
  .status.off{color:var(--danger);}
  .status.idle-on{color:var(--accent2);}
  .status.running{color:#052e16;background:linear-gradient(90deg,#4ade80,#22d3ee);}
  .status.paused{color:#451a03;background:linear-gradient(90deg,#fcd34d,#fbbf24);}
  .status.finishing{color:#0c4a6e;background:linear-gradient(90deg,#7dd3fc,#38bdf8);}
  .status.ended{color:#450a0a;background:linear-gradient(90deg,#fca5a5,#f87171);}

  /* ---------- 數據卡 ---------- */
  .stats{display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:8px;}
  .stat{
    background:var(--panel); border-radius:12px; padding:10px 8px;
    text-align:center; border:1px solid var(--line);
  }
  .stat .label{font-size:12px;color:var(--dim);margin-bottom:4px;letter-spacing:.5px;}
  .stat .value{
    font-size:22px; font-weight:800; font-variant-numeric:tabular-nums;
    color:var(--text);
  }
  .stat .value.acc{color:var(--accent);}
  .stat .value.cy{color:var(--accent2);}

  /* ---------- 計時選擇 chips ---------- */
  .chips{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .rowLbl{font-size:12px; color:var(--dim); letter-spacing:1px; flex:0 0 auto;}
  .chipWrap{display:flex; gap:6px; flex-wrap:wrap; flex:1;}
  .chip{
    border:1px solid var(--line); background:var(--panel); color:var(--dim);
    border-radius:999px; padding:5px 10px; font-size:12px;
    font-family:inherit; font-weight:700; cursor:pointer; transition:all .15s;
  }
  .chip.active{background:#1d6ef5; border-color:#1d6ef5; color:#fff;}
  .chip.allday{border-color:#f59e0b; color:#f59e0b;}
  .chip.allday.active{background:#b45309; border-color:#f59e0b; color:#fff;}
  .chip:active{transform:scale(.95);}

  /* ---------- 歷史標題 ---------- */
  .hist-head{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:2px 4px; font-size:13px; color:var(--dim); letter-spacing:.5px;
  }
  .hist-head b{color:var(--text);}

  /* ---------- 控制列 ---------- */
  .controlbar{display:flex; gap:5px; align-items:stretch;}
  .controlbar .btn{
    flex:1 1 0; min-width:0; padding:9px 4px; font-size:11px; font-weight:700;
    border-radius:10px; white-space:nowrap; overflow:hidden; border:none;
    color:var(--text); background:var(--panel2); font-family:inherit;
    cursor:pointer; transition:transform .08s, background .15s, box-shadow .15s;
  }
  .controlbar .btn:active{transform:scale(.96);}
  .controlbar .btn.primary{flex:1.25 1 0;background:linear-gradient(135deg,#2563eb,#1d4ed8);}
  .controlbar .btn.primary.on{
    background:linear-gradient(135deg,#059669,#10b981);
    box-shadow:0 0 0 2px rgba(74,222,128,.35), 0 0 14px rgba(74,222,128,.35);
  }
  .controlbar .btn.ghost{background:var(--panel2);}
  .controlbar .btn:disabled{opacity:.45;}

  .controlbar .rate{
    flex:1.4 1 0; min-width:0;
    display:flex; align-items:center; justify-content:space-between;
    background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:2px 3px; gap:2px;
  }
  .controlbar .btn.tiny{
    flex:0 0 auto; width:28px; height:28px; padding:0; border-radius:8px;
    font-size:15px; line-height:1; background:var(--panel3); color:var(--text);
    border:none; font-family:inherit; cursor:pointer; font-weight:700;
  }
  .controlbar .btn.tiny:active{transform:scale(.92);}
  #rateVal{
    flex:1 1 auto; font-size:11px; font-weight:700; min-width:0;
    text-align:center; font-variant-numeric:tabular-nums; color:var(--warn);
  }

  /* ---------- 歷史 ---------- */
  .history{
    flex:1; min-height:80px; overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:var(--panel); border-radius:12px; border:1px solid var(--line);
    padding:6px; display:flex; flex-direction:column; gap:6px;
  }
  .history::-webkit-scrollbar{width:4px;}
  .history::-webkit-scrollbar-thumb{background:#3a4254;border-radius:4px;}
  .empty{color:var(--dim);font-size:13px;text-align:center;padding:18px 0;}
  .hist-item{
    display:flex; align-items:center; gap:8px;
    padding:9px 11px; border-radius:9px; background:var(--panel2);
    border-left:4px solid var(--accent);
    animation:slideIn .22s ease-out;
  }
  .hist-item.cancel{border-left-color:var(--danger);}
  @keyframes slideIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
  .hi-idx{font-weight:800;font-size:12px;color:var(--dim);white-space:nowrap;}
  .hi-proj{font-weight:700;font-size:13px;color:var(--accent2);}
  .hi-res{margin-left:auto;font-size:12px;color:var(--dim);white-space:nowrap;}

  /* ---------- 總結 ---------- */
  .summary{
    background:linear-gradient(135deg,#1e293b,#0f172a);
    border:1px solid var(--accent2); border-radius:12px;
    padding:12px 14px; font-size:15px; line-height:1.7; text-align:center;
    animation:slideIn .3s ease-out;
  }
  .summary .big{font-size:20px;font-weight:800;color:var(--accent2);}
  .summary .sline{font-size:13px;text-align:left;margin:6px 0;color:var(--dim);}
  .summary .sline b{color:var(--text);}
  .hidden{display:none !important;}

  .hint{font-size:11px;color:var(--dim);text-align:center;letter-spacing:.3px;line-height:1.6;}

  #toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px);
    background:#e6e9ef; color:#0d0f14; padding:10px 20px; border-radius:999px;
    font-size:13px; font-weight:700; opacity:0; pointer-events:none;
    transition:all .25s; z-index:99; max-width:86vw; text-align:center;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">

  <div id="status" class="status">未啟動</div>

  <div class="stats">
    <div class="stat"><div class="label">總時間</div><div id="totalTime" class="value acc">00:00</div></div>
    <div class="stat"><div class="label">完成次數</div><div id="completedVal" class="value cy">0</div></div>
    <div class="stat"><div class="label">本回合</div><div id="roundSec" class="value">0.0</div></div>
  </div>

  <div class="chips">
    <span class="rowLbl">計時選擇</span>
    <div id="intervalBtns" class="chipWrap"></div>
  </div>

  <div class="hist-head">
    <span>歷史記錄</span>
    <span>共 <b id="histCount">0</b> 條</span>
  </div>

  <div class="controlbar">
    <div class="rate">
      <button id="rateDown" class="btn tiny" aria-label="減慢語速">−</button>
      <span id="rateVal">1.3x</span>
      <button id="rateUp" class="btn tiny" aria-label="加快語速">＋</button>
    </div>
    <button id="exportBtn" class="btn ghost">📋 複製記錄</button>
    <button id="resetBtn" class="btn ghost">🔄 重置</button>
    <button id="voiceBtn" class="btn primary">🎤 語音控制</button>
  </div>

  <div id="history" class="history">
    <div class="empty">暫無記錄</div>
  </div>

  <div id="summary" class="summary hidden"></div>
  <div class="hint">
    說「開始＋項目名稱」開始計時・「完成」或「完成a次」結束該回<br>
    說「暫停」暫停計時及朗讀・「繼續」由暫停點繼續<br>
    說「報數」即時報數・「知道」回復正常報數・「結束」總結<br>
    「報時」只可在待機或暫停時使用
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  'use strict';

  /* =========================================================
     一、DOM 與狀態
     ========================================================= */
  const $ = (id) => document.getElementById(id);

  const voiceBtn     = $('voiceBtn');
  const resetBtn     = $('resetBtn');
  const exportBtn    = $('exportBtn');
  const statusEl     = $('status');
  const totalTimeEl  = $('totalTime');
  const completedEl  = $('completedVal');
  const roundSecEl   = $('roundSec');
  const rateValEl    = $('rateVal');
  const rateDownBtn  = $('rateDown');
  const rateUpBtn    = $('rateUp');
  const intervalEl   = $('intervalBtns');
  const historyEl    = $('history');
  const histCountEl  = $('histCount');
  const summaryEl    = $('summary');
  const toastEl      = $('toast');

  /* 狀態機：idle / running / paused / finishing / ended */
  let state            = 'idle';
  let completedCount   = 0;      // 總完成次數（a 的累加）
  let completedTotalSec = 0;     // 完成回合的總耗時
  let firstStartMs     = null;
  let sessionDate      = null;
  let sessionEndTime   = null;
  let sessionEnded     = false;
  let totalMs          = 0;

  let roundBaseMs      = 0;      // 已累積毫秒（暫停前的部分）
  let roundStartMs     = 0;      // 本段開始時間
  let lastReportedSec  = 0;
  let reportInterval   = 1;
  let allDayMode       = false;
  let speechRate       = 1.3;
  let voiceControlOn   = false;
  let tickTimer        = null;
  let cantoVoice       = null;

  let fastReportMode   = false;
  let numberHold       = false;

  /* 項目 / 回數 / 主序號 */
  let projects         = {};     // name -> { round, totalCount, totalSec }
  let history          = [];     // { z, project, round, count, sec }
  let historySeq       = 0;      // 主序號 z
  let defaultProject   = '運動';
  let currentProject   = '運動';

  /* 完成緩衝（等待「完成a次」講完） */
  let pendingFinishTimer = null;

  /* 開始緩衝（等待「開始xxx」講完） */
  let pendingStartTimer  = null;
  let pendingStartName   = null;

  const CHIPS = [
    { v: 1,    label: '1秒' },
    { v: 2,    label: '2秒' },
    { v: 5,    label: '5秒' },
    { v: 10,   label: '10秒' },
    { v: 30,   label: '30秒' },
    { v: 60,   label: '1分鐘' },
    { v: 120,  label: '2分鐘' },
    { v: 300,  label: '5分鐘' },
    { v: 600,  label: '10分鐘' },
    { v: 900,  label: '15分鐘' },
    { v: 1800, label: '30分鐘' },
    { v: 2700, label: '45分鐘' },
    { v: 3600, label: '60分鐘' },
    { v: 'allday', label: '全日' }
  ];
  const CHIP_LABELS = {};
  CHIPS.forEach(c => { CHIP_LABELS[c.v] = c.label; });

  function perfNow() {
    return (window.performance && window.performance.now)
      ? window.performance.now()
      : Date.now();
  }

  function elapsedRoundMs() {
    if (state === 'running') {
      return roundBaseMs + (perfNow() - roundStartMs);
    }
    return roundBaseMs;
  }

  /* =========================================================
     二、粵語數字 / 時間朗讀字串
     ========================================================= */
  const DIGITS = ['零','一','二','三','四','五','六','七','八','九'];

  function numToCanto(n) {
    n = Math.floor(n);
    if (n <= 0) return '零';
    if (n < 10) return DIGITS[n];
    if (n < 20) return '十' + (n % 10 ? DIGITS[n % 10] : '');
    if (n < 100) {
      const t = Math.floor(n / 10), o = n % 10;
      return DIGITS[t] + '十' + (o ? DIGITS[o] : '');
    }
    const h = Math.floor(n / 100), r = n % 100;
    return DIGITS[h] + '百' + (r === 0 ? '' : (r < 10 ? '零' + DIGITS[r] : numToCanto(r)));
  }

  function numToCanto2(n) {
    n = Math.floor(n);
    return n === 2 ? '兩' : numToCanto(n);
  }

  function secToCanto(sec) {
    sec = Math.floor(sec);
    if (sec < 60) return sec <= 0 ? '零' : numToCanto(sec);
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    let mStr;
    if (m === 1) mStr = '一分';
    else if (m === 2) mStr = '兩分';
    else mStr = numToCanto(m) + '分';
    if (s === 0) return mStr + '鐘';
    return mStr + numToCanto(s);
  }

  /* 文字版時長：2分鐘 / 20秒 / 1分30秒 */
  function fmtDur(sec) {
    sec = Math.max(0, Math.floor(sec));
    if (sec < 60) return sec + '秒';
    const m = Math.floor(sec / 60), s = sec % 60;
    return s === 0 ? m + '分鐘' : m + '分' + s + '秒';
  }

  function formatSec(sec) {
    sec = Math.floor(sec);
    if (sec < 60) return sec + '秒';
    const m = Math.floor(sec / 60), s = sec % 60;
    return m + '分' + String(s).padStart(2, '0') + '秒';
  }

  function formatMs(ms) {
    const t = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(t / 3600);
    const m = Math.floor((t % 3600) / 60);
    const s = t % 60;
    const mm = String(m).padStart(2, '0');
    const ss = String(s).padStart(2, '0');
    return h > 0 ? h + ':' + mm + ':' + ss : mm + ':' + ss;
  }

  function fmtClock(d) {
    const p = n => String(n).padStart(2, '0');
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  const WEEK_CANTO = ['日','一','二','三','四','五','六'];

  function yearToCanto(y) {
    return String(y).split('').map(function (c) {
      const d = DIGITS[+c];
      return (d === undefined) ? '' : d;
    }).join('');
  }

  function cantoDate(d) {
    const y  = d.getFullYear();
    const mo = d.getMonth() + 1;
    const da = d.getDate();
    const wk = WEEK_CANTO[d.getDay()];
    const h24 = d.getHours();
    const mi  = d.getMinutes();
    const se  = d.getSeconds();

    let period, h12;
    if (h24 >= 5 && h24 < 12) {
      period = '早上'; h12 = h24;
    } else if (h24 >= 12 && h24 < 18) {
      period = '下午'; h12 = (h24 - 12) || 12;
    } else {
      period = '晚上'; h12 = (h24 % 12) || 12;
    }

    return '今日係' + yearToCanto(y) + '年' + numToCanto(mo) + '月' + numToCanto(da) + '日，'
         + '星期' + wk + '，'
         + period + numToCanto(h12) + '時' + numToCanto(mi) + '分' + numToCanto(se) + '秒';
  }

  /* 中文數字 → 阿拉伯數字（1~999 足夠） */
  function cn2num(s) {
    if (/^[0-9]+$/.test(s)) return parseInt(s, 10);
    const map = { '零':0,'一':1,'二':2,'兩':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9 };
    let n = 0, section = 0, num = 0;
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (c === '百') { section += (num || 1) * 100; num = 0; }
      else if (c === '十') { section += (num || 1) * 10; num = 0; }
      else if (map[c] !== undefined) { num = map[c]; }
    }
    return section + num || 1;
  }

  /* =========================================================
     三、語音合成 (TTS) —— V6 核心，嚴禁改動
     ========================================================= */
  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices() || [];
    cantoVoice =
      vs.find(v => /zh[-_]HK/i.test(v.lang)) ||
      vs.find(v => /yue/i.test(v.lang)) ||
      vs.find(v => /zh[-_]TW/i.test(v.lang)) ||
      vs.find(v => /zh/i.test(v.lang)) ||
      null;
  }
  if ('speechSynthesis' in window) {
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
  }

  const recentSpoken = [];

  function speak(text, interrupt, onEnd) {
    if (!('speechSynthesis' in window)) return;

    recentSpoken.push({ text: text, t: Date.now() });
    if (recentSpoken.length > 40) recentSpoken.shift();

    try {
      if (interrupt !== false) speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-HK';
      if (cantoVoice) u.voice = cantoVoice;
      u.rate = speechRate;
      u.pitch = 1;
      u.volume = 1;
      if (typeof onEnd === 'function') u.onend = onEnd;
      speechSynthesis.speak(u);
    } catch (e) { /* ignore */ }
  }

  function isEcho(text, now) {
    const t = String(text).replace(/[\s，。！？、,.!?·]/g, '');
    if (!t) return false;
    for (let i = recentSpoken.length - 1; i >= 0; i--) {
      const s = recentSpoken[i];
      if (now - s.t > 1700) break;
      if (s.text.indexOf(t) !== -1) return true;
    }
    return false;
  }

  /* =========================================================
     四、語音辨識 (ASR) —— V6 核心，嚴禁改動
     ========================================================= */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let recognitionRunning = false;
  let restartTimer = null;

  function initRecognition() {
    if (!SR) return null;
    const r = new SR();
    r.lang = 'zh-HK';
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;

    r.onstart = () => { recognitionRunning = true; };

    r.onresult = (e) => {
      let text = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        text += e.results[i][0].transcript;
      }
      text = text.replace(/[\s,，。.!！?？、·]/g, '');
      if (text) dispatch(text);
    };

    r.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        voiceControlOn = false;
        updateUI();
        alert('麥克風權限被拒絕，請在瀏覽器設定中允許使用麥克風。');
      }
    };

    r.onend = () => {
      recognitionRunning = false;
      if (voiceControlOn && !sessionEnded) {
        clearTimeout(restartTimer);
        restartTimer = setTimeout(startRecognition, 120);
      }
    };

    return r;
  }
  recognition = initRecognition();

  function startRecognition() {
    if (!recognition || recognitionRunning) return;
    try {
      recognition.start();
      recognitionRunning = true;
    } catch (e) {
      recognitionRunning = false;
      clearTimeout(restartTimer);
      restartTimer = setTimeout(() => {
        if (voiceControlOn && !sessionEnded) startRecognition();
      }, 250);
    }
  }

  function stopRecognition() {
    clearTimeout(restartTimer);
    if (!recognition) return;
    try { recognition.stop(); } catch (e) {}
    recognitionRunning = false;
  }

  /* =========================================================
     五、指令分派（V11：完成 / 暫停 / 繼續 / 開始+項目）
     ========================================================= */
  function parseCount(text) {
    // 完成 15 次 / 完成十五次
    const m = text.match(/(?:完成|做完)\s*([0-9]+|[一二三四五六七八九十百兩两]+)\s*次/);
    if (m) return Math.max(1, cn2num(m[1]));
    const m2 = text.match(/(?:完成|做完)\s*([0-9]+)/);
    if (m2) return Math.max(1, parseInt(m2[1], 10));
    return 1;
  }

  function parseProjectName(text) {
    const i = text.search(/開始|开始/);
    if (i < 0) return '';
    let rest = text.slice(i + 2);
    rest = rest.replace(/[，。！？、,.!?\s]/g, '');
    return rest;
  }

  function dispatch(raw) {
    if (sessionEnded) return;

    const now = Date.now();
    if (isEcho(raw, now)) return;

    if (/繼續|继续/.test(raw)) { doResume(); return; }
    if (/暫停|暂停/.test(raw)) { doPause();  return; }
    if (/結束|结束|完結|完结/.test(raw)) { endSession(); return; }
    if (/取消/.test(raw)) { doCancel(); return; }
    if (/完成|做完/.test(raw)) { doFinish(parseCount(raw)); return; }
    if (/開始|开始/.test(raw)) { doStart(parseProjectName(raw)); return; }

    if (/報時|报时/.test(raw)) { doClock(); return; }
    if (/報數|报数/.test(raw)) { doCount(); return; }
    if (/知道/.test(raw))     { exitFastReport(); return; }
  }

  /* =========================================================
     六、核心計時邏輯
     ========================================================= */

  /** 開始：緩衝 800ms，等「開始xxx」講完 */
  function doStart(name) {
    if (state !== 'idle') return;

    if (name) {
      pendingStartName = name;
      clearTimeout(pendingStartTimer);
      pendingStartTimer = setTimeout(function () {
        pendingStartTimer = null;
        performStart(pendingStartName || defaultProject);
      }, 800);
    } else {
      if (pendingStartTimer) return;   // 已有一個無名「開始」在等，不重複
      pendingStartName = '';
      pendingStartTimer = setTimeout(function () {
        pendingStartTimer = null;
        performStart(defaultProject);
      }, 800);
    }
  }

  function performStart(name) {
    if (state !== 'idle') return;

    currentProject = name || defaultProject;

    if (firstStartMs === null) {
      firstStartMs = perfNow();
      sessionDate = new Date();
    }

    state = 'running';
    roundBaseMs = 0;
    roundStartMs = perfNow();
    lastReportedSec = 0;
    fastReportMode = false;
    numberHold = false;

    if (!tickTimer) tickTimer = setInterval(tick, 30);

    speak('開始' + currentProject, true);
    updateUI();
  }

  /** 完成：先凍結計時，緩衝 1300ms 等「完成a次」講完才記錄 */
  function doFinish(count) {
    if (state === 'running') {
      roundBaseMs += perfNow() - roundStartMs;
      state = 'finishing';
      clearTimeout(pendingFinishTimer);

      if (count > 1) {
        finalizeFinish(count);
      } else {
        pendingFinishTimer = setTimeout(function () {
          pendingFinishTimer = null;
          finalizeFinish(1);
        }, 1300);
      }
      updateUI();
      return;
    }

    if (state === 'finishing') {
      if (count > 1) {
        clearTimeout(pendingFinishTimer);
        pendingFinishTimer = null;
        finalizeFinish(count);
      }
      return;
    }
  }

  function finalizeFinish(count) {
    const sec = Math.floor(roundBaseMs / 1000);
    const project = currentProject;

    if (!projects[project]) {
      projects[project] = { round: 0, totalCount: 0, totalSec: 0 };
    }
    const pj = projects[project];
    pj.round += 1;
    pj.totalCount += count;
    pj.totalSec += sec;

    historySeq += 1;
    history.push({
      z: historySeq,
      project: project,
      round: pj.round,
      count: count,
      sec: sec
    });

    completedCount += count;
    completedTotalSec += sec;
    defaultProject = project;

    state = 'idle';
    fastReportMode = false;
    numberHold = false;

    speak('第' + numToCanto(pj.round) + '回' + project + '，完成'
        + numToCanto(count) + '次，用咗' + secToCanto(sec), true);

    renderHistory();
    updateUI();
  }

  /** 取消 */
  function doCancel() {
    if (state !== 'running' && state !== 'paused' && state !== 'finishing') return;
    clearTimeout(pendingFinishTimer);
    pendingFinishTimer = null;
    roundBaseMs = 0;
    roundStartMs = 0;
    state = 'idle';
    fastReportMode = false;
    numberHold = false;
    speak('已取消', true);
    updateUI();
  }

  /** 暫停 */
  function doPause() {
    if (state !== 'running') return;
    roundBaseMs += perfNow() - roundStartMs;
    state = 'paused';
    try { speechSynthesis.cancel(); } catch (e) {}
    speak('暫停', true);
    updateUI();
  }

  /** 繼續 */
  function doResume() {
    if (state !== 'paused') return;
    roundStartMs = perfNow();
    state = 'running';
    lastReportedSec = Math.floor(roundBaseMs / 1000);
    speak('繼續', true);
    updateUI();
  }

  /** 結束 */
  function endSession() {
    if (sessionEnded) return;

    if (state === 'running') {
      roundBaseMs += perfNow() - roundStartMs;
    }
    clearTimeout(pendingFinishTimer);
    pendingFinishTimer = null;

    sessionEnded = true;
    state = 'ended';
    sessionEndTime = new Date();
    voiceControlOn = false;
    fastReportMode = false;
    numberHold = false;
    allDayMode = false;
    stopRecognition();
    stopTick();

    if (firstStartMs !== null) totalMs = perfNow() - firstStartMs;
    const totalSec = Math.floor(totalMs / 1000);

    let txt = '今次運動，你總共完成咗' + numToCanto(completedCount) + '次，';
    if (totalSec >= 60) {
      const m = Math.floor(totalSec / 60), s = totalSec % 60;
      if (s > 0) txt += '用咗' + numToCanto2(m) + '分' + numToCanto2(s) + '秒';
      else       txt += '用咗' + numToCanto2(m) + '分鐘';
    } else {
      txt += '用咗' + numToCanto(totalSec) + '秒';
    }
    speak(txt, true);

    /* 總結卡 */
    let html = '🏁 今次總結<br>';
    const names = Object.keys(projects).filter(n => projects[n].round > 0);
    if (names.length) {
      html += '<div class="sline">';
      names.forEach(function (n) {
        const pj = projects[n];
        html += '<b>' + n + '</b>：' + pj.totalCount + '次共' + fmtDur(pj.totalSec) + '<br>';
      });
      html += '</div>';
    }
    if (completedCount === 0) {
      html += '<div class="sline" style="text-align:center">（未有任何完成記錄）</div>';
    }
    html += '總耗時 <span class="big">' + fmtDur(totalSec) + '</span>';
    summaryEl.classList.remove('hidden');
    summaryEl.innerHTML = html;

    updateUI();
  }

  function stopTick() {
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
  }

  /* =========================================================
     六之二、報時 / 報數 / 知道
     ========================================================= */

  /** 「報時」：只可在待機或暫停狀態使用 */
  function doClock() {
    if (state !== 'idle' && state !== 'paused') {
      toast('⚠️ 報時只可在待機或暫停時使用');
      return;
    }
    const now = Date.now();
    if (doClock._last && now - doClock._last < 2000) return;
    doClock._last = now;

    const txt = cantoDate(new Date());

    if (state === 'paused') {
      numberHold = true;
      clearTimeout(doClock._t);
      doClock._t = setTimeout(function () { numberHold = false; }, 20000);
      speak(txt, true, function () {
        clearTimeout(doClock._t);
        numberHold = false;
      });
    } else {
      speak(txt, true);
    }
    toast('🗓️ 報時中…');
  }

  /** 「報數」：即時報一次現在數目 */
  function doCount() {
    const now = Date.now();
    if (doCount._last && now - doCount._last < 1200) return;
    doCount._last = now;

    let sec = 0;
    if (state === 'running' || state === 'paused' || state === 'finishing') {
      sec = Math.floor(roundBaseMs / 1000);
      if (state === 'running') sec = Math.floor(elapsedRoundMs() / 1000);
    }
    if (sec < 0) sec = 0;
    lastReportedSec = sec;
    speak(secToCanto(sec), true);
    toast('🔢 即時報數：' + sec + ' 秒');
  }

  /** 「知道」：結束每 5 秒快速報數 */
  function exitFastReport() {
    if (!fastReportMode) return;
    fastReportMode = false;
    lastReportedSec = state === 'running'
      ? Math.floor(elapsedRoundMs() / 1000)
      : 0;
    toast('✅ 已回復原本報數間隔');
  }

  /* =========================================================
     七、tick 計時
     ========================================================= */
  function tick() {
    const now = perfNow();

    if (firstStartMs !== null && !sessionEnded) {
      totalMs = now - firstStartMs;
      totalTimeEl.textContent = formatMs(totalMs);
    }

    if (state === 'running') {
      const elapsedMs = roundBaseMs + (now - roundStartMs);
      roundSecEl.textContent = (elapsedMs / 1000).toFixed(1);

      if (allDayMode) return;                 // 全日模式：不自動報數

      const sec = Math.floor(elapsedMs / 1000);
      if (sec < 1 || sec <= lastReportedSec) return;
      if (numberHold) return;

      if (fastReportMode) {
        if (sec % 5 === 0) {
          lastReportedSec = sec;
          speak(secToCanto(sec), true);
        }
        return;
      }

      if (reportInterval === 1 || sec % reportInterval === 0) {
        lastReportedSec = sec;
        if (reportInterval >= 60 && sec >= reportInterval) {
          fastReportMode = true;
          toast('夠鐘！轉為每 5 秒報數，講「知道」回復正常');
          speak('夠鐘', true);
        } else {
          speak(secToCanto(sec), true);
        }
      }
      return;
    }

    if (state === 'paused' || state === 'finishing') {
      roundSecEl.textContent = (roundBaseMs / 1000).toFixed(1);
    }
  }

  /* =========================================================
     八、UI 更新
     ========================================================= */
  function updateUI() {
    statusEl.className = 'status';
    if (state === 'running') {
      statusEl.textContent = '🔴 計時中…（' + currentProject + '）講「完成」或「暫停」';
      statusEl.classList.add('running');
    } else if (state === 'paused') {
      statusEl.textContent = '⏸️ 已暫停 — 講「繼續」';
      statusEl.classList.add('paused');
    } else if (state === 'finishing') {
      statusEl.textContent = '⏳ 記錄中…';
      statusEl.classList.add('finishing');
    } else if (state === 'ended') {
      statusEl.textContent = '✅ 已結束';
      statusEl.classList.add('ended');
    } else if (voiceControlOn) {
      statusEl.textContent = '待機 — 請講「開始＋項目名」';
      statusEl.classList.add('idle-on');
    } else {
      statusEl.textContent = '未啟動';
      statusEl.classList.add('off');
    }

    if (voiceControlOn) {
      voiceBtn.textContent = '🎤 語音控制中';
      voiceBtn.classList.add('on');
    } else {
      voiceBtn.textContent = '🎤 語音控制';
      voiceBtn.classList.remove('on');
    }
    voiceBtn.disabled = sessionEnded;

    totalTimeEl.textContent = formatMs(totalMs);
    completedEl.textContent = completedCount;
    histCountEl.textContent = history.length;
  }

  /* =========================================================
     九、歷史記錄
     ========================================================= */
  function renderHistory() {
    if (!history.length) {
      historyEl.innerHTML = '<div class="empty">暫無記錄</div>';
      histCountEl.textContent = '0';
      return;
    }
    historyEl.innerHTML = history.map(function (h) {
      return '<div class="hist-item">' +
               '<span class="hi-idx">' + h.z + '. 第' + h.round + '回</span>' +
               '<span class="hi-proj">' + h.project + '</span>' +
               '<span class="hi-res">' + fmtDur(h.sec) + '完成' + h.count + '次</span>' +
             '</div>';
    }).join('');
    histCountEl.textContent = history.length;
    historyEl.scrollTop = historyEl.scrollHeight;
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove('show'), 1600);
  }

  /* =========================================================
     十、複製記錄
     ========================================================= */
  function buildRecordText() {
    const now = new Date();
    const p = n => String(n).padStart(2, '0');
    const d = sessionDate || now;

    let out = '';
    out += 'V11多功能計時\n';
    out += '日期：' + d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + '\n';
    out += '開始時間：' + (sessionDate ? fmtClock(sessionDate) : '--:--:--') + '\n';
    out += '結束時間：' + fmtClock(sessionEndTime || now) + '\n';
    out += '\n記錄：\n';

    if (!history.length) {
      out += '（無記錄）\n';
    } else {
      history.forEach(function (h) {
        out += h.z + '. 第' + h.round + '回\t' + h.project + '\t'
             + fmtDur(h.sec) + '完成' + h.count + '次\n';
      });
    }

    out += '\n完成摘要：\n';
    const names = Object.keys(projects).filter(n => projects[n].round > 0);
    if (!names.length) {
      out += '（無）\n';
    } else {
      names.forEach(function (n, i) {
        const pj = projects[n];
        out += (i + 1) + '. ' + n + '\t：' + pj.totalCount + '次共' + fmtDur(pj.totalSec) + '\n';
      });
    }
    out += '  總耗時：' + fmtDur(Math.floor(totalMs / 1000)) + '\n';
    return out;
  }

  async function copyRecords() {
    const txt = buildRecordText();
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(txt);
      } else {
        throw new Error('no clipboard');
      }
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = txt;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand('copy'); } catch (e2) {}
      document.body.removeChild(ta);
    }
    toast('✅ 已複製到剪貼簿');
  }

  /* =========================================================
     十一、計時選擇 chips（含「全日」）
     ========================================================= */
  (function buildIntervalButtons() {
    CHIPS.forEach(function (c) {
      const b = document.createElement('button');
      b.className = 'chip' + (c.v === reportInterval ? ' active' : '')
                  + (c.v === 'allday' ? ' allday' : '');
      b.textContent = c.label;
      b.dataset.v = String(c.v);
      b.addEventListener('click', function () {
        const all = intervalEl.querySelectorAll('.chip');
        for (let i = 0; i < all.length; i++) all[i].classList.remove('active');
        b.classList.add('active');

        if (c.v === 'allday') {
          allDayMode = true;
          reportInterval = 1;
          fastReportMode = false;
          if (state === 'idle') {
            doStart(defaultProject);
          }
          toast('🌞 全日模式：不自動報數，講「報數」即時報');
        } else {
          allDayMode = false;
          reportInterval = c.v;
          fastReportMode = false;
          lastReportedSec = state === 'running'
            ? Math.floor(elapsedRoundMs() / 1000)
            : 0;
          toast('報數間隔：' + c.label);
        }
      });
      intervalEl.appendChild(b);
    });
  })();

  /* =========================================================
     十二、按鈕事件
     ========================================================= */
  voiceBtn.addEventListener('click', function () {
    if (sessionEnded) { toast('已結束，請先按「重置」'); return; }
    if (!recognition) {
      alert('此瀏覽器不支援語音辨識。\n請使用 Chrome 或 Edge（桌面版 / Android）。');
      return;
    }
    voiceControlOn = !voiceControlOn;
    if (voiceControlOn) {
      startRecognition();
      speak('準備好', true);
    } else {
      stopRecognition();
      speechSynthesis.cancel();
    }
    updateUI();
  });

  resetBtn.addEventListener('click', function () {
    stopTick();
    clearTimeout(pendingStartTimer);
    clearTimeout(pendingFinishTimer);
    pendingStartTimer = null;
    pendingFinishTimer = null;
    pendingStartName = null;

    state = 'idle';
    sessionEnded = false;
    completedCount = 0;
    completedTotalSec = 0;
    totalMs = 0;
    roundBaseMs = 0;
    roundStartMs = 0;
    lastReportedSec = 0;
    firstStartMs = null;
    sessionDate = null;
    sessionEndTime = null;
    history = [];
    historySeq = 0;
    projects = {};
    defaultProject = '運動';
    currentProject = '運動';
    fastReportMode = false;
    numberHold = false;
    allDayMode = false;
    doClock._last = 0;
    doCount._last = 0;
    recentSpoken.length = 0;

    summaryEl.classList.add('hidden');
    summaryEl.innerHTML = '';
    try { speechSynthesis.cancel(); } catch (e) {}

    renderHistory();
    updateUI();
    if (voiceControlOn && !sessionEnded) startRecognition();
    toast('已重置');
  });

  exportBtn.addEventListener('click', copyRecords);

  rateDownBtn.addEventListener('click', function () { changeRate(-0.1); });
  rateUpBtn.addEventListener('click', function () { changeRate(0.1); });

  function changeRate(d) {
    speechRate = Math.round((speechRate + d) * 10) / 10;
    speechRate = Math.max(0.5, Math.min(2.5, speechRate));
    rateValEl.textContent = speechRate.toFixed(1) + 'x';
  }

  /* =========================================================
     十三、初始化 —— V6 核心
     ========================================================= */
  function init() {
    rateValEl.textContent = speechRate.toFixed(1) + 'x';
    renderHistory();
    updateUI();

    if ('speechSynthesis' in window) {
      try {
        const u = new SpeechSynthesisUtterance(' ');
        u.volume = 0;
        u.lang = 'zh-HK';
        speechSynthesis.speak(u);
      } catch (e) {}
    }
  }
  init();

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      // 保留計時
    } else {
      if (state === 'running' && !tickTimer) {
        tickTimer = setInterval(tick, 30);
      }
    }
  });

  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

})();
</script>
</body>
</html>
