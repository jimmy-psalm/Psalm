    currentFilterMajor = majorName;
    applyGridFilter();
}

function getOriginalPsalm(n) {
    const raw = window.PSALM_DATA;
    if (!raw || !Array.isArray(raw.psalms)) return null;
    const key = String(n);
    return raw.psalms.find(p => String(p.id || '').replace(/\D/g, '') === key) || null;
}

function renderGuideAnalysis(n) {
    const box = document.getElementById('guideAnalysis');
    if (!box) return;
    box.innerHTML = '';
    const raw = getOriginalPsalm(n);
    const labels = getGuideLabels(n);
    const groups = GUIDE_FILTER.groups || [];
    if (!groups.length) {
        box.innerHTML = '<p class="text-sm text-gray-400">找不到五向導分析資料。</p>';
        return;
    }
    groups.forEach(group => {
        const guide = group.id;
        const block = document.createElement('div');
        block.className = 'guide-analysis-block';
        const title = document.createElement('div');
        title.className = 'guide-analysis-title';
        title.textContent = guide;
        block.appendChild(title);
        const pills = document.createElement('div');
        pills.className = 'guide-analysis-pills';
        (group.categories || []).forEach(cat => {
            labelsForCat(labels, cat).forEach(tag => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'guide-analysis-pill';
                const selected = asTagList(selectedGuideTags[cat]).includes(tag);
                if (selected) {
                    btn.style.background = '#1f3d3a';
                    btn.style.color = '#fff';
                }
                btn.textContent = `${cat} · ${tag}`;
                btn.setAttribute('aria-label', `篩選 ${guide} ${cat} ${tag}`);
                btn.onclick = () => {
                    setActiveGuideGroup(guide);
                    toggleGuideTag(cat, tag);
                };
                pills.appendChild(btn);
            });
        });
        block.appendChild(pills);
        const desc = document.createElement('div');
        desc.className = 'guide-analysis-desc';
        desc.textContent = (raw && raw.description && raw.description[guide]) || '';
        block.appendChild(desc);
        box.appendChild(block);
    });
}

function renderPsalmTagDots(n) {
    const dots = document.getElementById('tagDots');
    const pills = document.getElementById('tagPills');
    if (!dots || !pills) return;
    const labels = getGuideLabels(n);
    dots.innerHTML = '';
    pills.innerHTML = '';
    (GUIDE_FILTER.groups || []).forEach(group => {
        (group.categories || []).forEach(cat => {
            labelsForCat(labels, cat).forEach(tag => {
                const pill = document.createElement('button');
                pill.type = 'button';
                pill.className = 'tag-pill';
                const selected = asTagList(selectedGuideTags[cat]).includes(tag);
                pill.style.background = selected ? '#1f3d3a' : '#e2e8f0';
                pill.style.color = selected ? '#fff' : '#1e293b';
                pill.textContent = `${cat} · ${tag}`;
                pill.setAttribute('aria-label', `篩選 ${group.id} ${cat} ${tag}`);
                pill.onclick = () => {
                    setActiveGuideGroup(group.id);
                    toggleGuideTag(cat, tag);
                };
                pills.appendChild(pill);
            });
        });
    });
}



function moveToPsalm(newPsalm) {
    if (newPsalm < 1 || newPsalm > 150) return;
    const isDimmedMode = document.querySelectorAll('.psalm-cell.dimmed').length > 0;
    if (isDimmedMode && !psalmMatchesFilter(newPsalm)) return;
    const cells = document.querySelectorAll('.psalm-cell');
    let targetCell = null;
    cells.forEach(cell => { if (parseInt(cell.textContent) === newPsalm) targetCell = cell; });
    if (targetCell) {
        targetCell.click();
        targetCell.classList.add('active');
        if (shouldAutoScrollMatrix()) {
            try {
                targetCell.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
            } catch {
                // Fallback for older iOS Safari that does not support smooth options object
                targetCell.scrollIntoView(true);
            }
        }
    }
}

function selectRelativePsalm(delta) {
    if (!Number.isInteger(delta) || delta === 0) return;
    const cells = Array.from(document.querySelectorAll('.psalm-cell'));
    const visible = cells.filter(cell => !cell.classList.contains('dimmed'));
    const scope = visible.length ? visible : cells;
    if (!scope.length) return;
    const numbers = scope.map(cell => parseInt(cell.textContent)).filter(Number.isFinite);
    if (!numbers.length) return;
    const base = currentPsalm && numbers.includes(currentPsalm) ? currentPsalm : numbers[0];
    const currentIdx = numbers.indexOf(base);
    const nextIdx = (currentIdx + delta + numbers.length) % numbers.length;
    const next = numbers[nextIdx];
    let targetCell = null;
    cells.forEach(cell => { if (parseInt(cell.textContent) === next) targetCell = cell; });
    if (!targetCell) return;
    // 保存朗讀狀態（showDetail 會處理保存和恢復）
    showDetail(next, targetCell);
}

function handleTab(e) {
    if (e.key !== 'Tab') return;
    e.preventDefault();
    const cells = Array.from(document.querySelectorAll('.psalm-cell'));
    let visible = cells.filter(cell => !cell.classList.contains('dimmed'));
    if (!visible.length) return;
    if (!currentPsalm) { moveToPsalm(parseInt(visible[0].textContent)); return; }
    let idx = visible.findIndex(cell => parseInt(cell.textContent) === currentPsalm);
    if (idx === -1) idx = 0;
    let nextIdx = (idx + 1) % visible.length;
    moveToPsalm(parseInt(visible[nextIdx].textContent));
}

function cleanVerseTextForSpeech(rawText) {
    if (!rawText) return '';
    const lines = String(rawText).split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    const cleaned = lines.map(line => line.replace(/^\d+[\.\s、：:]*/u, '').trim()).filter(Boolean);
    return cleaned.join('。');
}

function getSelectedStructureSpeechText() {
    const blocks = document.querySelectorAll('#scriptureText .structured-block');
    if (!blocks.length) return '';
    const idx = Number.isInteger(selectedStructureIndex) ? selectedStructureIndex : 0;
    const target = blocks[idx] || blocks[0];
    const verseNodes = target.querySelectorAll('.verse-line');
    if (verseNodes.length) {
        const lines = [];
        verseNodes.forEach(node => {
            const clone = node.cloneNode(true);
            clone.querySelectorAll('.verse-number').forEach(num => num.remove());
            const t = clone.textContent.trim();
            if (t) lines.push(t);
        });
        return lines.join('。');
    }
    return cleanVerseTextForSpeech(target.textContent);
}

function getWholePsalmSpeechText() {
    if (!currentPsalm) return '';
    if (FULL_TEXTS[currentPsalm] && FULL_TEXTS[currentPsalm].text) {
        return cleanVerseTextForSpeech(FULL_TEXTS[currentPsalm].text);
    }
    const scriptureEl = document.getElementById('scriptureText');
    return cleanVerseTextForSpeech(scriptureEl ? scriptureEl.textContent : '');
}

function getStructuredSpeechChunks() {
    const blocks = document.querySelectorAll('#scriptureText .structured-block');
    if (!blocks.length) return [];
    const chunks = [];
    blocks.forEach((block, idx) => {
        const verseNodes = block.querySelectorAll('.verse-line');
        if (!verseNodes.length) {
            const fallback = cleanVerseTextForSpeech(block.textContent);
            if (fallback) chunks.push({ index: idx, text: fallback });
            return;
        }
        const lines = [];
        verseNodes.forEach(node => {
            const clone = node.cloneNode(true);
            clone.querySelectorAll('.verse-number').forEach(num => num.remove());
            const t = clone.textContent.trim();
            if (t) lines.push(t);
        });
        const text = lines.join('。');
        if (text) chunks.push({ index: idx, text });
    });
    return chunks;
}

function isIOSDevice() {
    const ua = navigator.userAgent || '';
    return /iPad|iPhone|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function pickBestChineseVoice(voices) {
    if (!voices || !voices.length) return null;
    const list = voices.map(v => ({ v, sig: `${v.lang} ${v.name}` }));
    const pick = (patterns) => {
        for (const p of patterns) {
            const hit = list.find(item => p.test(item.sig));
            if (hit) return hit.v;
        }
        return null;
    };
    if (isIOSDevice()) {
        const siri = pick([/siri.*zh-hk/i, /siri.*zh-tw/i, /siri.*zh-cn/i, /ting-ting/i, /sin-ji/i, /mei-jia/i]);
        if (siri) return siri;
    }
    return pick([/yue/i, /cantonese/i, /zh-hk/i, /zh-tw/i, /zh-cn/i, /zh/i]);
}

function clearSpeakingButtonState() {
    if (!activeSpeechBtn) return;
    activeSpeechBtn.classList.remove('speaking-once', 'speaking-loop');
    activeSpeechBtn = null;
}

function applySpeakingButtonState(btn, repeat) {
    clearSpeakingButtonState();
    if (!btn) return;
    activeSpeechBtn = btn;
    btn.classList.toggle('speaking-loop', !!repeat);
    btn.classList.toggle('speaking-once', !repeat);
}

function speakCantonese(text, btn, successMsg, repeat = false) {
    const content = (text || '').trim();
    if (!content) return;
    if (!('speechSynthesis' in window) || typeof window.SpeechSynthesisUtterance !== 'function') return;
    applySpeakingButtonState(btn, repeat);
    speechRepeatEnabled = repeat;
    // 保存朗讀狀態
    speechState.isSpeaking = true;
    speechState.mode = btn && btn.id === 'copySegmentBtn' ? 'segment' : 'whole';
    speechState.isRepeat = repeat;
    speechState.wasFinished = false;
    speechState.wasStopped = false;
    speechState.savedRate = speechRate;
    speechState.savedPitch = speechPitch;
    const mySession = ++speechSessionId;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(content);
    utter.lang = 'zh-HK';
    utter.rate = speechRate;
    utter.pitch = speechPitch;
    const voices = window.speechSynthesis.getVoices();
    const preferred = pickBestChineseVoice(voices);
    if (preferred) utter.voice = preferred;
    utter.onerror = () => {
        speechRepeatEnabled = false;
        clearSpeakingButtonState();
        speechState.isSpeaking = false;
        speechState.wasStopped = true;
    };
    utter.onend = () => {
        if (mySession !== speechSessionId) return;
        if (speechRepeatEnabled && repeat) {
            setTimeout(() => speakCantonese(content, btn, successMsg, true), 200);
            return;
        }
        clearSpeakingButtonState();
        speechState.isSpeaking = false;
        speechState.wasFinished = true;
        // 順序播放中：完成後檢查是否需要跳到下一首詩篇
        if (sequentialPlayActive) {
            onSequentialPsalmEnd();
        } else {
            // 一般單次播完（非按停止）：重設播放列為預設狀態
            resetPlayRowState();
        }
    };

    window.speechSynthesis.speak(utter);
}

function speakSequentialChunks(chunks, btn, repeatCycle = false) {
    if (!chunks.length) return;
    if (!('speechSynthesis' in window) || typeof window.SpeechSynthesisUtterance !== 'function') return;
    applySpeakingButtonState(btn, repeatCycle);
    speechRepeatEnabled = repeatCycle;
    // 保存朗讀狀態
    speechState.isSpeaking = true;
    speechState.mode = 'whole';
    speechState.isRepeat = repeatCycle;
    speechState.wasFinished = false;
    speechState.wasStopped = false;
    speechState.savedRate = speechRate;
    speechState.savedPitch = speechPitch;
    const mySession = ++speechSessionId;
    window.speechSynthesis.cancel();
    const voices = window.speechSynthesis.getVoices();
    const preferred = pickBestChineseVoice(voices);

    const speakAt = (idx) => {
        if (mySession !== speechSessionId) return;
        const item = chunks[idx];
        if (!item) {
            if (speechRepeatEnabled && repeatCycle) {
                // 循環：若有「詩篇第 X 篇」播報 chunk 在前，第二輪起跳過它 → 只唸第一次
                const loopStartIdx = (chunks[0] && chunks[0].announce) ? 1 : 0;
                speakAt(loopStartIdx);
            } else {
                clearSpeakingButtonState();
                speechState.isSpeaking = false;
                speechState.wasFinished = true;
                // 順序播放中：所有段落朗讀完成後跳到下一首詩篇
                if (sequentialPlayActive) {
                    onSequentialPsalmEnd();
                } else {
                    // 單次全篇播完（非按停止）：重設播放列為預設狀態
                    resetPlayRowState();
                }
            }
            return;
        }

        if (Number.isInteger(item.index)) scrollStructureBlockToTop(item.index);
        const utter = new SpeechSynthesisUtterance(item.text);
        utter.lang = 'zh-HK';
        utter.rate = speechRate;
        utter.pitch = speechPitch;
        if (preferred) utter.voice = preferred;
        utter.onerror = () => {
            if (mySession !== speechSessionId) return;
            speechRepeatEnabled = false;
            clearSpeakingButtonState();
            speechState.isSpeaking = false;
            speechState.wasStopped = true;
        };
        utter.onend = () => {
            if (mySession !== speechSessionId) return;
            speakAt(idx + 1);
        };
        window.speechSynthesis.speak(utter);
    };

    speakAt(0);
}

function adjustSpeechSetting(type, delta, btn) {
    if (type === 'rate') {
        const next = Math.max(0.6, Math.min(1.4, speechRate + delta));
        speechRate = Math.round(next * 100) / 100;
        showSpeechSettingHint(`速度 ${speechRate.toFixed(2)}x`, '#b91c1c');
        refreshTpValues();
        return;
    }
    if (type === 'pitch') {
        const next = Math.max(0.7, Math.min(1.5, speechPitch + delta));
        speechPitch = Math.round(next * 100) / 100;
        showSpeechSettingHint(`音調 ${speechPitch.toFixed(2)}`, '#166534');
        refreshTpValues();
    }
}

function showSpeechSettingHint(msg, color) {
    const hint = document.getElementById('speechSettingHint');
    if (!hint) return;
    hint.textContent = msg;
    hint.style.color = color || '#334155';
    hint.classList.add('visible');
    clearTimeout(showSpeechSettingHint._timer);
    showSpeechSettingHint._timer = setTimeout(() => {
        hint.classList.remove('visible');
    }, 1200);
}

// ===== 「詩篇第 X 篇」報篇號（全篇/順序朗讀用；綠色段落播放不加） =====
function psalmAnnounceText() {
    return currentPsalm ? `詩篇第 ${currentPsalm} 篇。` : '';
}

// 單次/順序：把播報放進分段輸入最前面（沿用第一個內容段的 index，唸播報時同步捲動到該段）
function prependPsalmAnnounceToChunks(chunks) {
    const a = psalmAnnounceText();
    if (!a || !chunks.length) return chunks;
    const firstIdx = Number.isInteger(chunks[0].index) ? chunks[0].index : undefined;
    return [firstIdx !== undefined ? { index: firstIdx, text: a } : { text: a }, ...chunks];
}

// 單次/順序：無結構段時，把播報接到整篇文字最前面
function prependPsalmAnnounceToContent(content) {
    const a = psalmAnnounceText();
    return a ? a + content : content;
}

// 循環（紅色全篇重複）：播報 chunk 帶 announce:true 記號，
// speakSequentialChunks 第二輪起會跳過它 → 只唸第一次。
// 若無結構段，把整篇當成單一 chunk，統一走分段循環，邏輯一致。
function buildRepeatPsalmChunks(chunks) {
    let out = (chunks && chunks.length) ? chunks.slice() : [];
    if (!out.length) {
        const t = getWholePsalmSpeechText();
        if (t) out = [{ text: t }];
    }
    const a = psalmAnnounceText();
    if (a && out.length) {
        const firstIdx = Number.isInteger(out[0].index) ? out[0].index : undefined;
        out = [firstIdx !== undefined ? { index: firstIdx, text: a, announce: true } : { text: a, announce: true }, ...out];
    }
    return out;
}

function readWholePsalm() {
    const btn = document.getElementById('copyScriptureBtn');
    if (!currentPsalm) { showCopyFeedback('⚠️ 尚未選擇詩篇', btn); return; }
    const chunks = prependPsalmAnnounceToChunks(getStructuredSpeechChunks());
    if (chunks.length) {
        speakSequentialChunks(chunks, btn, false);
        return;
    }
    const panel = document.getElementById('scripturePanel');
    if (panel) panel.scrollTo({ top: 0, behavior: 'smooth' });
    const content = prependPsalmAnnounceToContent(getWholePsalmSpeechText());
    speakCantonese(content, btn, '🔊 朗讀全篇中');
}

function readSelectedSegment() {
    const btn = document.getElementById('copySegmentBtn');
    if (!currentPsalm) { showCopyFeedback('⚠️ 尚未選擇詩篇', btn); return; }
    if (Number.isInteger(selectedStructureIndex)) scrollStructureBlockToTop(selectedStructureIndex);
    const content = getSelectedStructureSpeechText() || getWholePsalmSpeechText();
    speakCantonese(content, btn, '🔊 朗讀段落中');
}

function readWholePsalmRepeat() {
    const btn = document.getElementById('copyScriptureBtn');
    if (!currentPsalm) { showCopyFeedback('⚠️ 尚未選擇詩篇', btn); return; }
    const panel = document.getElementById('scripturePanel');
    if (panel) panel.scrollTo({ top: 0, behavior: 'smooth' });
    const chunks = buildRepeatPsalmChunks(getStructuredSpeechChunks());
    if (chunks.length) {
        speakSequentialChunks(chunks, btn, true);
    }
}

function readSelectedSegmentRepeat() {
    const btn = document.getElementById('copySegmentBtn');
    if (!currentPsalm) { showCopyFeedback('⚠️ 尚未選擇詩篇', btn); return; }
    if (Number.isInteger(selectedStructureIndex)) scrollStructureBlockToTop(selectedStructureIndex);
    const content = getSelectedStructureSpeechText() || getWholePsalmSpeechText();
    speakCantonese(content, btn, '🔁 循環朗讀段落中', true);
}

function bindShortAndLongPressSpeak(button, onShortPress, onLongPress) {
    if (!button) return;
    const LONG_PRESS_MS = 450;
    let timer = null;
    let longTriggered = false;
    let suppressClick = false;

    const clearTimer = () => {
        if (timer) clearTimeout(timer);
        timer = null;
    };

    const start = () => {
        clearTimer();
        longTriggered = false;
        timer = setTimeout(() => {
            longTriggered = true;
            suppressClick = true;
            onLongPress();
        }, LONG_PRESS_MS);
    };

    const end = () => {
        if (!timer && !longTriggered) return;
        clearTimer();
        if (!longTriggered) onShortPress();
    };

    button.addEventListener('pointerdown', start);
    button.addEventListener('pointerup', end);
    button.addEventListener('pointercancel', clearTimer);
    button.addEventListener('pointerleave', clearTimer);

    button.addEventListener('touchstart', (e) => {
        e.preventDefault();
        start();
    }, { passive: false });
    button.addEventListener('touchend', (e) => {
        e.preventDefault();
        end();
    }, { passive: false });
    button.addEventListener('touchcancel', clearTimer, { passive: true });

    button.addEventListener('contextmenu', (e) => e.preventDefault());
    button.addEventListener('click', (e) => {
        if (suppressClick) {
            suppressClick = false;
            e.preventDefault();
        }
    });
}

function bindRepeatPressBtn(button, onAction) {
    if (!button) return;
    const LONG_PRESS_DELAY = 500;
    const REPEAT_INTERVAL = 150;
    let pressTimer = null;
    let repeatTimer = null;
    let longActivated = false;
    let suppressClick = false;

    const cancelAll = () => {
        clearTimeout(pressTimer);
        clearInterval(repeatTimer);
        pressTimer = null;
        repeatTimer = null;
    };

    const startPress = (e) => {
        e.preventDefault();
        cancelAll();
        longActivated = false;
        pressTimer = setTimeout(() => {
            longActivated = true;
            suppressClick = true;
            onAction();
            repeatTimer = setInterval(onAction, REPEAT_INTERVAL);
        }, LONG_PRESS_DELAY);
    };

    const endPress = (e) => {
        e.preventDefault();
        const wasLong = longActivated;
        cancelAll();
        if (!wasLong) onAction();
    };

    button.addEventListener('touchstart', startPress, { passive: false });
    button.addEventListener('touchend', endPress, { passive: false });
    button.addEventListener('touchcancel', (e) => { e.preventDefault(); cancelAll(); }, { passive: false });
    button.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'touch') { cancelAll(); longActivated = false; pressTimer = setTimeout(() => { longActivated = true; suppressClick = true; onAction(); repeatTimer = setInterval(onAction, REPEAT_INTERVAL); }, LONG_PRESS_DELAY); } });
    button.addEventListener('pointerup', (e) => { if (e.pointerType !== 'touch') { const wasLong = longActivated; cancelAll(); if (!wasLong) onAction(); } });
    button.addEventListener('pointercancel', (e) => { if (e.pointerType !== 'touch') cancelAll(); });
    button.addEventListener('pointerleave', (e) => { if (e.pointerType !== 'touch') cancelAll(); });
    button.addEventListener('contextmenu', (e) => e.preventDefault());
    button.addEventListener('click', (e) => { if (suppressClick) { suppressClick = false; e.preventDefault(); e.stopPropagation(); } });
}

function cancelCurrentSpeech() {
    // 只取消朗讀，不停止順序播放（保留 sequentialPlayActive）
    if (!('speechSynthesis' in window)) return;
    speechRepeatEnabled = false;
    speechSessionId += 1;
    window.speechSynthesis.cancel();
    clearSpeakingButtonState();
    if (speechState.isSpeaking) {
        speechState.wasStopped = true;
        speechState.isSpeaking = false;
    }
}

function stopSpeaking() {
    cancelCurrentSpeech();
    // 停止順序播放
    sequentialPlayActive = false;
}

/* ===== 播放列新互動（經文列三顆+停）: 狀態/膠囊/視覺 ===== */
const MODE_BTNID = { segment: 'copySegmentBtn', whole: 'copyScriptureBtn', sequence: 'sequentialPlayBtn' };
let activeMode = null;   // 'segment'|'whole'|'sequence'
let activeLoop = false;
let activePaused = false;
let seqWrapped = false;  // 順序循環

function fillModeTone(b) {
    if (!b) return;
    b.classList.remove('play-seg', 'play-whole', 'play-seq');
    if (b.dataset.source === 'whole') b.classList.add('play-whole');
    else if (b.dataset.source === 'sequence') b.classList.add('play-seq');
    else b.classList.add('play-seg');
}
function resetPlayVisuals() {
    ['segment', 'whole', 'sequence'].forEach(k => {
        const b = document.getElementById(MODE_BTNID[k]);
        if (!b) return;
        b.classList.remove('on', 'on-pause', 'on-loop', 'pausedstate');
        b.removeAttribute('data-paused'); b.removeAttribute('data-loop');
        b.setAttribute('aria-pressed', 'false');
        fillModeTone(b);
    });
    const stop = document.getElementById('stopSpeakBtn'); if (stop) stop.classList.remove('on');
    updateTitleStatus();
}
function updatePlayVisuals() {
    ['segment', 'whole', 'sequence'].forEach(k => {
        const b = document.getElementById(MODE_BTNID[k]); if (!b) return;
        b.classList.remove('on', 'on-pause', 'on-loop', 'pausedstate');
        b.removeAttribute('data-paused');
        b.setAttribute('aria-pressed', 'false');
    });
    const stop = document.getElementById('stopSpeakBtn'); if (stop) stop.classList.add('on');
    if (!activeMode) { resetPlayVisuals(); return; }
    if (activeMode && !currentPsalm) {
        const b0 = document.getElementById(MODE_BTNID[activeMode]);
        if (b0) b0.classList.add('on');
        return;
    }
    const b = document.getElementById(MODE_BTNID[activeMode]);
    if (b) { b.classList.add('on'); b.setAttribute('aria-pressed', 'true'); }
    if (activePaused) { b.classList.add('pausedstate'); b.setAttribute('data-paused', '1'); b.classList.add('on-pause'); }
    else if (activeLoop && !activePaused) { b.classList.add('on-loop'); b.setAttribute('data-loop', '1'); }
    updateTitleStatus();
}
function resetPlayRowState() {
    // 正常播放完畢時：重設播放列（三個播放鍵 + 停止鍵）回到預設，
    // 等同按「■ 停止」後的視覺結果，但不取消任何語音。
    activeMode = null; activeLoop = false; activePaused = false; seqWrapped = false;
    resetPlayVisuals();
}
function updateTitleStatus() {
    const st = document.getElementById('playStatus');
    if (!st) return;
    st.textContent = currentPsalm ? ('詩篇第 ' + currentPsalm + ' 篇') : '';
    // 只顯示篇號，不附加「播放中/已暫停」；播放狀態由按鈕視覺呈現
}
function hasSpeech() { return !!window.speechSynthesis; }
function stopPlaybackNow() {
    if (!hasSpeech()) return;
    window.speechSynthesis.cancel();
    speechState.isSpeaking = false;
    speechState.wasStopped = true;
    speechState.wasFinished = false;
    sequentialPlayActive = false;
    activeMode = null; activeLoop = false; activePaused = false;
    resetPlayVisuals();
}
function stopPlaybackKeepVisual() {
    if (!hasSpeech()) return;
    window.speechSynthesis.cancel();
    speechState.isSpeaking = false; speechState.wasStopped = true; speechState.wasFinished = false;
    sequentialPlayActive = false;
}
function startActiveGo(mode, loop) {
    activeMode = mode; activeLoop = loop; activePaused = false;
    updatePlayVisuals();
    if (mode === 'segment') { loop ? readSelectedSegmentRepeat() : readSelectedSegment(); }
    else if (mode === 'whole') { loop ? readWholePsalmRepeat() : readWholePsalm(); }
    else { seqWrapped = loop; startSequentialPlay(); }
}
function refreshTpValues() {
    const rv = document.getElementById('rateVal');
    const pv = document.getElementById('pitchVal');
    if (rv) rv.textContent = speechRate.toFixed(2) + 'x';
    if (pv) pv.textContent = (speechPitch >= 1 ? '+' : '') + (speechPitch - 1).toFixed(2);
}
/* 短按一顆 ▶ */
function onPlayTap(mode) {
    if (!hasSpeech()) return;
    if (activeMode === mode && (window.speechSynthesis.paused || activePaused)) {
        // 續播
        try { window.speechSynthesis.resume(); } catch (e) {}
        activePaused = false; updatePlayVisuals(); return;
    }
    if (activeMode === mode) {
        // 播放中 → 暫停
        try { if (window.speechSynthesis.speaking) window.speechSynthesis.pause(); } catch (e) {}
        activePaused = true; updatePlayVisuals(); return;
    }
    stopPlaybackKeepVisual();
    startActiveGo(mode, false);
}
/* 長按一顆 ▶：切換 單次 ⇄ 循環 */
function onPlayLong(mode) {
    if (!hasSpeech()) return;
    if (activeMode === mode && activeLoop && !activePaused) {
        // 由循環切回單次
        stopPlaybackKeepVisual();
        startActiveGo(mode, false);
        return;
    }
    stopPlaybackKeepVisual();
    startActiveGo(mode, true);
}
/* ■ 完全停止 */
function onStopTap() {
    stopPlaybackNow();
    updatePlayVisuals();
}



function resumeSpeakingIfNeeded() {
    // 如果之前正在朗讀且未完成，則自動恢復朗讀
    if (speechState.wasFinished || speechState.wasStopped) {
        // 已完成或已停止，不自動恢復
        return;
    }
    if (!speechState.isSpeaking && speechState.mode) {
        // 根據之前保存的模式恢復朗讀（speed 和 pitch 保持用戶手動設定值，不從 speechState 恢復）
        if (speechState.mode === 'whole') {
            // 從選中的段落開始朗讀全篇（而不是從頭開始）
            const chunks = getStructuredSpeechChunks();
            if (chunks.length > 0 && Number.isInteger(selectedStructureIndex) && selectedStructureIndex >= 0 && selectedStructureIndex < chunks.length) {
                const btn = document.getElementById('copyScriptureBtn');
                if (speechState.isRepeat) {
                    // 循環模式：從 selectedStructureIndex 開始，到最後，再回到開頭
                    const reordered = [...chunks.slice(selectedStructureIndex), ...chunks.slice(0, selectedStructureIndex)];
                    speakSequentialChunks(reordered, btn, true);
                } else {
                    // 單次模式：只從 selectedStructureIndex 到最後，不包含前面的部分
                    const partial = chunks.slice(selectedStructureIndex);
                    speakSequentialChunks(partial, btn, false);
                }
            } else {
                // 沒有結構化段落，用傳統方式從頭開始
                if (speechState.isRepeat) {
                    readWholePsalmRepeat();
                } else {
                    readWholePsalm();
                }
            }
        } else if (speechState.mode === 'segment') {
            if (speechState.isRepeat) {
                readSelectedSegmentRepeat();
            } else {
                readSelectedSegment();
            }
        }
    }
}

function showCopyFeedback(msg, btn) {
    const orig = btn.innerHTML;
    btn.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> ${msg}`;
    btn.classList.add('bg-green-100','text-green-700');
    setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('bg-green-100','text-green-700'); }, 1800);
}

// ============================================================================
// 順序播放功能
// ============================================================================

/**
 * 根據當前篩選的 typeId 取得詩篇編號列表（按數字排序）
 * @param {number|null} typeId - 篩選的 typeId，null 表示全部
 * @returns {number[]} 詩篇編號陣列
 */
function getFilteredPsalmList(typeId) {
    const list = [];
    for (let i = 1; i <= 150; i++) {
        if (psalmMatchesFilter(i, typeId, currentFilterMajor)) list.push(i);
    }
    return list.sort((a, b) => a - b);
}

/**
 * 取得當前詩篇在篩選列表中的下一首
 * @param {number} current - 當前詩篇編號
 * @param {number[]} list - 篩選列表
 * @returns {number|null} 下一首詩篇編號，若無則返回 null
 */
function getNextPsalmInSequence(current, list) {
    const idx = list.indexOf(current);
    if (idx === -1) return null;
    if (idx + 1 < list.length) return list[idx + 1];
    return null; // 已到最後一首
}

/**
 * 開始順序播放
 * 根據當前篩選的 typeId，朗讀當前詩篇，完成後自動跳到下一首
 */
function startSequentialPlay() {
    if (!currentPsalm) {
        showCopyFeedback('⚠️ 尚未選擇詩篇', document.getElementById('sequentialPlayBtn'));
        return;
    }
    
    sequentialPlayActive = true;
    
    // 朗讀當前詩篇
    const btn = document.getElementById('copyScriptureBtn');
    const chunks = prependPsalmAnnounceToChunks(getStructuredSpeechChunks());
    if (chunks.length) {
        // 使用 speakSequentialChunks 但修改 onend 行為
        speakSequentialChunksWithCallback(chunks, btn, false);
    } else {
        const content = prependPsalmAnnounceToContent(getWholePsalmSpeechText());
        speakCantoneseWithCallback(content, btn, '🔊 順序朗讀中');
    }
}

/**
 * 帶回調的 speakCantonese，朗讀完成後檢查是否需要跳到下一首
 */
function speakCantoneseWithCallback(text, btn, successMsg) {
    const content = (text || '').trim();
    if (!content) return;
    if (!('speechSynthesis' in window) || typeof window.SpeechSynthesisUtterance !== 'function') return;
    applySpeakingButtonState(btn, false);
    speechRepeatEnabled = false;
    speechState.isSpeaking = true;
    speechState.mode = 'whole';
    speechState.isRepeat = false;
    speechState.wasFinished = false;
    speechState.wasStopped = false;
    speechState.savedRate = speechRate;
    speechState.savedPitch = speechPitch;
    const mySession = ++speechSessionId;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(content);
    utter.lang = 'zh-HK';
    utter.rate = speechRate;
    utter.pitch = speechPitch;
    const voices = window.speechSynthesis.getVoices();
    const preferred = pickBestChineseVoice(voices);
    if (preferred) utter.voice = preferred;
    utter.onerror = () => {
        speechRepeatEnabled = false;
        clearSpeakingButtonState();
        speechState.isSpeaking = false;
        speechState.wasStopped = true;
        sequentialPlayActive = false;
    };
    utter.onend = () => {
        if (mySession !== speechSessionId) return;
        clearSpeakingButtonState();
        speechState.isSpeaking = false;
        speechState.wasFinished = true;
        // 檢查順序播放是否仍活躍
        if (sequentialPlayActive) {
            onSequentialPsalmEnd();
        } else {
            // 順序已停（防護）：重設播放列為預設狀態
            resetPlayRowState();
        }
    };
    window.speechSynthesis.speak(utter);
}

/**
 * 帶回調的 speakSequentialChunks，所有段落朗讀完成後檢查是否需要跳到下一首
 */
function speakSequentialChunksWithCallback(chunks, btn, repeatCycle = false) {
    if (!chunks.length) return;
    if (!('speechSynthesis' in window) || typeof window.SpeechSynthesisUtterance !== 'function') return;
    applySpeakingButtonState(btn, repeatCycle);
    speechRepeatEnabled = repeatCycle;
    speechState.isSpeaking = true;
    speechState.mode = 'whole';
    speechState.isRepeat = repeatCycle;
    speechState.wasFinished = false;
    speechState.wasStopped = false;
    speechState.savedRate = speechRate;
    speechState.savedPitch = speechPitch;
    const mySession = ++speechSessionId;
    window.speechSynthesis.cancel();
    const voices = window.speechSynthesis.getVoices();
    const preferred = pickBestChineseVoice(voices);

    const speakAt = (idx) => {
        if (mySession !== speechSessionId) return;
        const item = chunks[idx];
        if (!item) {
            clearSpeakingButtonState();
            speechState.isSpeaking = false;
            speechState.wasFinished = true;
            // 所有段落朗讀完成，檢查順序播放
            if (sequentialPlayActive) {
                onSequentialPsalmEnd();
            } else {
                // 順序已停（防護）：重設播放列為預設狀態
                resetPlayRowState();
            }
            return;
        }
        if (Number.isInteger(item.index)) scrollStructureBlockToTop(item.index);
        const utter = new SpeechSynthesisUtterance(item.text);
        utter.lang = 'zh-HK';
        utter.rate = speechRate;
        utter.pitch = speechPitch;
        if (preferred) utter.voice = preferred;
        utter.onerror = () => {
            if (mySession !== speechSessionId) return;
            speechRepeatEnabled = false;
            clearSpeakingButtonState();
            speechState.isSpeaking = false;
            speechState.wasStopped = true;
            sequentialPlayActive = false;
        };
        utter.onend = () => {
            if (mySession !== speechSessionId) return;
            speakAt(idx + 1);
        };
        window.speechSynthesis.speak(utter);
    };

    speakAt(0);
}

/**
 * 當前詩篇朗讀完成後的回調
 * 檢查篩選類型是否改變，並跳到下一首
 */
function onSequentialPsalmEnd() {
    if (!sequentialPlayActive) return;
    
    // 獲取當前有效的篩選類型
    const effectiveTypeId = currentFilterTypeId;
    const list = getFilteredPsalmList(effectiveTypeId);
    
    if (!list.length) {
        sequentialPlayActive = false;
        resetPlayRowState();
        return;
    }
    
    // 找到當前詩篇在列表中的位置
    const currentIdx = list.indexOf(currentPsalm);
    let nextPsalm = null;
    
    if (currentIdx !== -1 && currentIdx + 1 < list.length) {
        // 同一類型中還有下一首
        nextPsalm = list[currentIdx + 1];
    } else if (currentIdx === -1 && list.length > 0) {
        // 當前詩篇不在列表中（篩選改變了），跳到列表第一首
        nextPsalm = list[0];
    } else if (currentIdx + 1 >= list.length && seqWrapped && list.length > 0) {
        // 順序「循環」：已到最後一首 → 回到清單第一首
        nextPsalm = list[0];
    }
    // 如果 currentIdx 是最後一首且非循環，nextPsalm 保持 null，順序播放結束
    
    if (nextPsalm !== null) {
        // 跳到下一首並朗讀
        const cells = document.querySelectorAll('.psalm-cell');
        let targetCell = null;
        cells.forEach(cell => { if (parseInt(cell.textContent) === nextPsalm) targetCell = cell; });
        if (targetCell) {
            showDetail(nextPsalm, targetCell);
            // showDetail 會停止朗讀，所以需要重新開始
            setTimeout(() => {
                if (sequentialPlayActive) {
                    const btn = document.getElementById('copyScriptureBtn');
                    const chunks = prependPsalmAnnounceToChunks(getStructuredSpeechChunks());
                    if (chunks.length) {
                        speakSequentialChunksWithCallback(chunks, btn, false);
                    } else {
                        const content = prependPsalmAnnounceToContent(getWholePsalmSpeechText());
                        speakCantoneseWithCallback(content, btn, '🔊 順序朗讀中');
                    }
                }
            }, 100);
        } else {
            sequentialPlayActive = false;
            resetPlayRowState();
        }
    } else {
        // 已到最後一首，結束順序播放
        sequentialPlayActive = false;
        resetPlayRowState();
        showCopyFeedback('✅ 順序朗讀完成', document.getElementById('sequentialPlayBtn'));
    }
}

function renderFacetTabs() {
    const tabs = document.getElementById('facetTabs');
    if (!tabs) return;
    tabs.innerHTML = '';
    (SEARCH_INDEX.facets || []).forEach(facet => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'facet-tab' + (facet.id === activeFacet ? ' active' : '');
        btn.textContent = facet.name;
        btn.setAttribute('aria-label', `搜尋手冊：${facet.name}`);
        btn.onclick = () => setActiveFacet(facet.id);
        tabs.appendChild(btn);
    });
}

function renderGuideTabs() {
    const tabs = document.getElementById('guideTabs');
    if (!tabs) return;
    tabs.innerHTML = '';
    const show = activeFacet === 'guide';
    tabs.classList.toggle('is-hidden', !show);
    if (!show) return;
    (GUIDE_FILTER.groups || []).forEach(group => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'guide-tab' + (group.id === activeGuideGroup ? ' active' : '');
        btn.setAttribute('data-group', group.id);
        btn.textContent = group.id;
        btn.setAttribute('aria-label', `顯示五向導 ${group.id}`);
        btn.onclick = () => setActiveGuideGroup(group.id);
        tabs.appendChild(btn);
    });
}

function renderSimpleFacetPills() {
    const legendDiv = document.getElementById('legend');
    if (!legendDiv) return;
    legendDiv.innerHTML = '';
    const facet = SEARCH_INDEX[activeFacet] || {};
    const box = document.createElement('div');
    box.className = 'guide-cat';

    box.appendChild(title);

    (facet.tags || []).forEach(tag => {

        btn.type = 'button';
        const selected = tagsForCurrentSimpleFacet().includes(tag);

        btn.textContent = `${tag} (${countSimpleTag(tag)})`;
        btn.setAttribute('aria-label', `篩選 ${tag}`);

        }

function renderGuideCategories() {
    const legendDiv = document.getElementById('legend');
    if (!legendDiv) return;
    legendDiv.innerHTML = '';
    const group = (GUIDE_FILTER.groups || []).find(g => g.id === activeGuideGroup)
        || (GUIDE_FILTER.groups || [])[0];
    if (!group) return;
    (group.categories || []).forEach(cat => {

        const box = document.createElement('div');
        box.className = 'guide-cat';
        const title = document.createElement('div');
        title.className = 'guide-cat-title';
        title.textContent = cat;
        box.appendChild(title);
        const pills = document.createElement('div');
        pills.className = 'guide-pills';
        (meta.tags || []).forEach(tag => {
            const selected = asTagList(selectedGuideTags[cat]).includes(tag);
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'guide-pill' + (selected ? ' selected' : '');
            btn.textContent = `${tag} (${countGuideTag(cat, tag)})`;
            btn.setAttribute('aria-label', `篩選 ${group.id} ${cat} ${tag}`);

    });
}

function renderSearchManual() {
    renderFacetTabs();
    renderGuideTabs();
    if (activeFacet === 'guide') renderGuideCategories();
    else renderSimpleFacetPills();
}

function init() {
    rebuildCategoriesFromClassification();

    // 初始化預設資料（若 OFFLINE_DB 缺少某篇，補上預設值並設 typeId=8 哀歌）
    for (let i = 1; i <= 150; i++) {
        if (!OFFLINE_DB[i]) OFFLINE_DB[i] = { typeId: 8, type: "哀歌", theme: `詩篇第 ${i} 篇`, content: "請自行補充內容", golden: "耶和華是我的拯救", ref: `詩篇 ${i}:1` };
        if (!FULL_TEXTS[i]) FULL_TEXTS[i] = { title: `詩篇第 ${i} 篇`, text: `詩篇第 ${i} 篇的經文將在您加入完整資料後顯示。` };
        if (!PSALM_STRUCTURE[i]) PSALM_STRUCTURE[i] = "";
    }
    generatePsalmMap(); calculateCounts();
    
    // 建立詩篇矩陣（圓點預設中性，選取篩選後由 applyGridFilter 依條件上色）
    const grid = document.getElementById('psalmGrid'); grid.innerHTML = '';
    for (let i = 1; i <= 150; i++) {
        const cell = document.createElement('button'); cell.type = 'button'; cell.className = 'psalm-cell text-slate-700'; cell.style.backgroundColor = PSALM_NEUTRAL; cell.textContent = i; cell.setAttribute('aria-label', `選擇詩篇第 ${i} 篇`);
        cell.onclick = (e) => { e.stopPropagation(); showDetail(i, cell); };
        grid.appendChild(cell);
    }

    renderSearchManual();
    applyGridFilter();

    syncLandscapeLegendLayout();
    syncPanelSwitchButtons();
    
    document.getElementById('resetBtn').onclick = () => {
        if (!sequentialPlayActive) stopSpeaking();
        clearGuideFilters();
    };




    
    document.addEventListener('keydown', (e) => { 
        if (e.key === 'Tab') handleTab(e); 
        else if (['ArrowRight','ArrowLeft','ArrowDown','ArrowUp'].includes(e.key) && currentPsalm) { 
            let t = currentPsalm; 
            if (e.key === 'ArrowRight') t+=1; 
            else if(e.key==='ArrowLeft') t-=1; 
            else if(e.key==='ArrowDown') t+=15; 
            else t-=15; 
            if(t>=1 && t<=150) moveToPsalm(t); 
        } 
    });
    
    bindShortAndLongPressSpeak(document.getElementById('copyScriptureBtn'), () => onPlayTap('whole'), () => onPlayLong('whole'));
    bindShortAndLongPressSpeak(document.getElementById('copySegmentBtn'), () => onPlayTap('segment'), () => onPlayLong('segment'));
    bindShortAndLongPressSpeak(document.getElementById('sequentialPlayBtn'), () => onPlayTap('sequence'), () => onPlayLong('sequence'));
    document.getElementById('stopSpeakBtn').addEventListener('click', onStopTap);
    document.getElementById('rateDownBtn').addEventListener('click', (e) => adjustSpeechSetting('rate', -0.05, e.currentTarget));
    document.getElementById('rateUpBtn').addEventListener('click', (e) => adjustSpeechSetting('rate', 0.05, e.currentTarget));
    document.getElementById('pitchDownBtn').addEventListener('click', (e) => adjustSpeechSetting('pitch', -0.2, e.currentTarget));
    document.getElementById('pitchUpBtn').addEventListener('click', (e) => adjustSpeechSetting('pitch', 0.2, e.currentTarget));
    // ▲▼ 語速/音調按鍵：按下瞬間變色回饋（pointer 事件，iPhone 觸控也可靠）
    document.querySelectorAll('#panel3Header .tp-btn').forEach(function(btn){
        var t;
        var add=function(){ clearTimeout(t); btn.classList.add('pressed'); };
        var rm=function(){ clearTimeout(t); t=setTimeout(function(){ btn.classList.remove('pressed'); }, 180); };
        btn.addEventListener('pointerdown', add);
        btn.addEventListener('pointerup', rm);
        btn.addEventListener('pointercancel', rm);
        btn.addEventListener('pointerleave', rm);
    });
    refreshTpValues();
    resetPlayVisuals();
    bindRepeatPressBtn(document.getElementById('prevPsalmBtn'), () => { selectRelativePsalm(-1); });
    bindRepeatPressBtn(document.getElementById('nextPsalmBtn'), () => { selectRelativePsalm(1); });

    bindRepeatPressBtn(document.getElementById('prevSectionBtn'), () => { selectRelativeStructure(-1); });
    bindRepeatPressBtn(document.getElementById('nextSectionBtn'), () => { selectRelativeStructure(1); });
    bindPanelSwitchButtons();
    window.addEventListener('resize', () => {
        syncLandscapeLegendLayout();
        syncPanelSwitchButtons();
    });
}

let hasInitialized = false;
function startApp() {
    if (hasInitialized) return;
    SEARCH_INDEX = window.SEARCH_INDEX || {};
    GUIDE_FILTER = buildGuideFilterFromIndex(SEARCH_INDEX);
    if (!window.PSALM_APP_DATA || !SEARCH_INDEX.facets || !GUIDE_FILTER.groups.length) {
        return;
    }
    hasInitialized = true;
    init();
}

document.addEventListener('psalm-data-ready', startApp, { once: true });
document.addEventListener('DOMContentLoaded', startApp, { once: true });
window.addEventListener('pageshow', startApp);
﻿function psalmNavCells(cells){
 var arr=Array.prototype.slice.call(cells||[]);
 var hit=arr.filter(function(c){return c.classList.contains("flt-hit");});
 var miss=arr.some(function(c){return c.classList.contains("flt-miss");});
 return (hit.length||miss)?hit:arr;
}
function moveToPsalm(newPsalm){
 if(newPsalm<1||newPsalm>150){return;}
 var hasFiltered=document.querySelectorAll(".psalm-cell.flt-hit").length>0||document.querySelectorAll(".psalm-cell.flt-miss").length>0;
 if(hasFiltered&&!psalmMatchesFilter(newPsalm)){return;}
 var cells=document.querySelectorAll(".psalm-cell");var targetCell=null;
 cells.forEach(function(cell){if(parseInt(cell.textContent)===newPsalm){targetCell=cell;}});
 if(!targetCell){return;}
 targetCell.click();targetCell.classList.add("active");
 if(shouldAutoScrollMatrix()){try{targetCell.scrollIntoView({behavior:"smooth",block:"nearest",inline:"nearest"});}catch(err){targetCell.scrollIntoView(true);}}
}
function selectRelativePsalm(delta){
 if(!Number.isInteger(delta)||delta===0){return;}
 var cells=Array.prototype.slice.call(document.querySelectorAll(".psalm-cell"));
 var scope=psalmNavCells(cells);if(!scope.length){return;}
 var numbers=scope.map(function(cell){return parseInt(cell.textContent);}).filter(function(n){return Number.isFinite(n);});
 if(!numbers.length){return;}
 var base=(currentPsalm&&numbers.indexOf(currentPsalm)>=0)?currentPsalm:numbers[0];
 var ci=numbers.indexOf(base);var ni=(ci+delta+numbers.length)%numbers.length;var next=numbers[ni];
 var targetCell=null;cells.forEach(function(cell){if(parseInt(cell.textContent)===next){targetCell=cell;}});
 if(!targetCell){return;}showDetail(next,targetCell);
}
function handleTab(e){
 if(e.key!=="Tab"){return;}e.preventDefault();
 var cells=Array.prototype.slice.call(document.querySelectorAll(".psalm-cell"));
 var visible=psalmNavCells(cells);if(!visible.length){return;}
 if(!currentPsalm){moveToPsalm(parseInt(visible[0].textContent));return;}
 var idx=-1;for(var i=0;i<visible.length;i++){if(parseInt(visible[i].textContent)===currentPsalm){idx=i;break;}}
 if(idx===-1){idx=0;}
 var ni=(idx+1)%visible.length;moveToPsalm(parseInt(visible[ni].textContent));
}
