<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>粵語間歇計時器 v2</title>
<style>
  :root{
    --bg1:#1b2130; --bg2:#0b0d12; --card:#151922; --line:rgba(255,255,255,.08);
    --text:#e8eaf0; --dim:#8b93a7; --green:#4ade80; --blue:#60a5fa;
    --orange:#fb923c; --red:#f87171;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; padding:24px 16px 40px;
    background:radial-gradient(circle at 50% -10%, var(--bg1), var(--bg2) 65%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei","Noto Sans HK","Helvetica Neue",sans-serif;
    display:flex; justify-content:center; min-height:100%;
  }
  .app{width:100%; max-width:430px;}
  header{text-align:center; margin-bottom:22px;}
  h1{font-size:20px; font-weight:600; letter-spacing:2px; margin:0 0 8px;}
  .hint{font-size:12px; color:var(--dim); margin:0; line-height:1.7; letter-spacing:.5px;}

  .panel{
    background:linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.012));
    border:1px solid var(--line);
    border-radius:22px;
    padding:22px 20px 20px;
    backdrop-filter:blur(8px);
  }

  .status{
    display:inline-block; padding:6px 16px; border-radius:999px;
    font-size:13px; letter-spacing:2px;
    border:1px solid rgba(255,255,255,.12);
    transition:.25s;
  }
  .status.idle   { background:rgba(96,165,250,.13); color:#93c5fd; border-color:rgba(96,165,250,.3); }
  .status.running{ background:rgba(74,222,128,.13); color:#86efac; border-color:rgba(74,222,128,.35);
                   animation:pulse 1.1s ease-in-out infinite; }
  .status.ended  { background:rgba(251,146,60,.13); color:#fdba74; border-color:rgba(251,146,60,.3); }
  .status.error  { background:rgba(248,113,113,.15); color:#fca5a5; border-color:rgba(248,113,113,.35); }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

  .counter-wrap{text-align:center; margin:26px 0 20px;}
  .counter{
    font-size:92px; font-weight:200; line-height:1;
    font-variant-numeric:tabular-nums;
    letter-spacing:-2px;
    text-shadow:0 0 40px rgba(74,222,128,.18);
  }
  .unit{font-size:13px; color:var(--dim); letter-spacing:6px; margin-top:8px;}

  .stats{display:flex; gap:10px; margin-bottom:16px;}
  .stat{
    flex:1; background:rgba(255,255,255,.035); border:1px solid var(--line);
    border-radius:14px; padding:12px 10px; text-align:center;
  }
  .stat-label{display:block; font-size:11px; color:var(--dim); letter-spacing:1.5px; margin-bottom:6px;}
  .stat-value{display:block; font-size:18px; font-weight:600; letter-spacing:.5px;}

  .toggle{
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(255,255,255,.03); border:1px solid var(--line);
    border-radius:14px; padding:12px 16px; margin-bottom:16px;
    font-size:13px; color:var(--dim); letter-spacing:.5px;
  }
  .toggle input{
    appearance:none; -webkit-appearance:none;
    width:42px; height:24px; border-radius:999px;
    background:rgba(255,255,255,.12); position:relative;
    outline:none; cursor:pointer; transition:.2s;
  }
  .toggle input:checked{background:rgba(74,222,128,.55);}
  .toggle input::after{
    content:''; position:absolute; top:2px; left:2px;
    width:20px; height:20px; border-radius:50%;
    background:#fff; transition:.2s;
  }
  .toggle input:checked::after{transform:translateX(18px);}

  .btn{
    width:100%; padding:15px; border-radius:14px; border:none;
    font-size:15px; font-weight:600; letter-spacing:1.5px;
    font-family:inherit; cursor:pointer; transition:.18s;
  }
  .btn.primary{
    background:linear-gradient(135deg,#4ade80,#22c55e); color:#062810;
    box-shadow:0 8px 26px -8px rgba(74,222,128,.55);
  }
  .btn.primary:active{transform:scale(.98);}
  .btn.primary:disabled{
    background:rgba(255,255,255,.07); color:var(--dim);
    box-shadow:none; cursor:default;
  }
  .btn.ghost{
    background:transparent; color:var(--dim); border:1px solid var(--line);
    margin-top:10px; font-size:13px; padding:12px; letter-spacing:1px;
  }
  .btn.ghost:active{background:rgba(255,255,255,.05);}

  .log-wrap{margin-top:18px;}
  .log-title{font-size:11px; color:var(--dim); letter-spacing:2px; margin:0 0 8px 4px;}
  .log{
    background:rgba(0,0,0,.28); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; height:150px; overflow-y:auto;
    font-size:12.5px; line-height:1.85; color:#9aa3b8;
    font-variant-numeric:tabular-nums;
  }
  .log .ok{color:#86efac;}
  .log .no{color:#fca5a5;}
  .log .info{color:#93c5fd;}
  .log .end{color:#fdba74;}
  .log .err{color:#fca5a5;}
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>粵語間歇計時器</h1>
    <p class="hint">講「開始」計時 ｜「停止」完成 ｜「取消」取消 ｜「結束」總結</p>
  </header>

  <div class="panel">
    <div style="text-align:center;">
      <div id="status" class="status idle">未啟動</div>
    </div>

    <div class="counter-wrap">
      <div id="counter" class="counter">0</div>
      <div class="unit">秒</div>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-label">已完成</span>
        <span id="doneCount" class="stat-value">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">總時間</span>
        <span id="totalTime" class="stat-value">0秒</span>
      </div>
    </div>

    <div class="toggle">
      <span>靜音模式（唔讀完成次數）</span>
      <input type="checkbox" id="silentMode">
    </div>

    <button id="startBtn" class="btn primary">啟動語音控制</button>
    <button id="resetBtn" class="btn ghost">重置</button>
  </div>

  <div class="log-wrap">
    <div class="log-title">記錄</div>
    <div id="log" class="log"></div>
  </div>
</main>

<script>
(function () {
  'use strict';

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  /* ---------------- DOM ---------------- */
  const $ = (id) => document.getElementById(id);
  const statusEl   = $('status');
  const counterEl  = $('counter');
  const doneEl     = $('doneCount');
  const totalEl    = $('totalTime');
  const logEl      = $('log');
  const startBtn   = $('startBtn');
  const resetBtn   = $('resetBtn');
  const silentMode = $('silentMode');

  /* ---------------- 狀態 ---------------- */
  let recognition   = null;
  let listening     = false;   // 想唔想聽
  let counting      = false;   // 而家係咪計緊時
  let ended         = false;   // 工作階段結束咗未

  let completedCount = 0;      // 即係 x
  let sessionStart   = null;   // 第一次講「開始」嘅時間
  let lapStart       = null;   // 今次「開始」嘅時間
  let secondsElapsed = 0;
  let tickHandle     = null;
  let commandLock    = 0;      // 防止同一句命令重複觸發
  let endedAt        = null;

  /* ---------------- 語音合成 ---------------- */
  let hkVoice = null;

  function loadVoices() {
    if (!('speechSynthesis' in window)) return;
    const voices = speechSynthesis.getVoices() || [];
    hkVoice =
      voices.find(v => /^zh[-_]HK$/i.test(v.lang)) ||
      voices.find(v => /^yue/i.test(v.lang)) ||
      voices.find(v => /zh[-_](HK|MO)/i.test(v.lang)) ||
      voices.find(v => /^zh/i.test(v.lang)) ||
      null;
  }
  loadVoices();
  if ('speechSynthesis' in window) {
    speechSynthesis.onvoiceschanged = loadVoices;
    setInterval(() => {
      if (speechSynthesis.speaking && speechSynthesis.paused) speechSynthesis.resume();
    }, 4000);
  }

  function speak(text, opts) {
    if (!('speechSynthesis' in window) || !text) return null;
    opts = opts || {};
    const u = new SpeechSynthesisUtterance(text);
    u.lang   = 'zh-HK';
    if (hkVoice) u.voice = hkVoice;
    u.rate   = opts.rate != null ? opts.rate : 1.0;
    u.pitch  = 1;
    u.volume = 1;
    try { speechSynthesis.speak(u); } catch (e) {}
    return u;
  }

  /* ---------------- 中文數字 ---------------- */
  const DIGITS = ['零','一','二','三','四','五','六','七','八','九'];

  function numToCantonese(n) {
    n = Math.floor(n);
    if (!isFinite(n) || n < 0) return '零';
    if (n < 10)  return DIGITS[n];
    if (n < 20)  return '十' + (n % 10 ? DIGITS[n % 10] : '');
    if (n < 100) {
      const t = Math.floor(n / 10), o = n % 10;
      return DIGITS[t] + '十' + (o ? DIGITS[o] : '');
    }
    if (n < 1000) {
      const h = Math.floor(n / 100), r = n % 100;
      if (!r) return DIGITS[h] + '百';
      if (r < 10) return DIGITS[h] + '百零' + DIGITS[r];
      return DIGITS[h] + '百' + numToCantonese(r);
    }
    if (n < 10000) {
      const k = Math.floor(n / 1000), r = n % 1000;
      if (!r) return DIGITS[k] + '千';
      if (r < 100) return DIGITS[k] + '千零' + numToCantonese(r);
      return DIGITS[k] + '千' + numToCantonese(r);
    }
    if (n < 100000000) {
      const w = Math.floor(n / 10000), r = n % 10000;
      if (!r) return numToCantonese(w) + '萬';
      if (r < 1000) return numToCantonese(w) + '萬零' + numToCantonese(r);
      return numToCantonese(w) + '萬' + numToCantonese(r);
    }
    return String(n);
  }

  function formatDuration(ms) {
    const total = Math.max(0, Math.round(ms / 1000));
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    const parts = [];
    if (h) parts.push(numToCantonese(h) + '小時');
    if (m) parts.push(numToCantonese(m) + '分');
    if (s || parts.length === 0) parts.push(numToCantonese(s) + '秒');
    return parts.join('');
  }

  /* ---------------- UI ---------------- */
  function setStatus(kind, text) {
    statusEl.className = 'status ' + kind;
    statusEl.textContent = text;
  }

  function log(text, cls) {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = text;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function refreshTotal() {
    if (sessionStart) {
      const end = endedAt || Date.now();
      totalEl.textContent = formatDuration(end - sessionStart);
    } else {
      totalEl.textContent = '0秒';
    }
  }

  /* ---------------- 計時 ---------------- */
  function speakCount(n) {
    // 靜音模式：只讀秒數，唔讀完成次數（呢個 function 只讀秒數）
    // 唔好 cancel speechSynthesis，因為 cancel 會影響其他語句
    // 唔好 abort recognition，讓佢一路收音
    speak(numToCantonese(n), { rate: 1.4 });
  }

  function tick() {
    if (!counting) return;
    const elapsed = Math.floor((Date.now() - lapStart) / 1000);
    if (elapsed > secondsElapsed) {
      secondsElapsed = elapsed;
      counterEl.textContent = secondsElapsed;
      speakCount(secondsElapsed);
    }
    refreshTotal();
  }

  function startLap() {
    if (ended || counting) return;

    if (!sessionStart) sessionStart = Date.now();
    lapStart = Date.now();
    secondsElapsed = 0;
    counting = true;

    counterEl.textContent = '0';
    setStatus('running', '計時中');
    log('▶ 開始', 'info');

    clearInterval(tickHandle);
    tickHandle = setInterval(tick, 200);
    refreshTotal();
  }

  function endLap(isCancel) {
    if (!counting) return;

    clearInterval(tickHandle);
    tickHandle = null;
    counting = false;

    const lapMs = Date.now() - lapStart;

    // 唔好 abort 識別，等佢一路開住收音
    // 但可以 cancel 之前未完嘅 TTS，讓新播報立即出
    if ('speechSynthesis' in window) speechSynthesis.cancel();

    let label;
    if (isCancel) {
      label = completedCount > 0
        ? '第' + numToCantonese(completedCount) + '次取消'
        : '取消';
      log('✕ ' + label + '（用咗 ' + formatDuration(lapMs) + '）', 'no');
    } else {
      completedCount += 1;
      label = '第' + numToCantonese(completedCount) + '次完成';
      log('✔ ' + label + '（用咗 ' + formatDuration(lapMs) + '）', 'ok');
      doneEl.textContent = completedCount;
    }

    // 靜音模式：唔讀完成次數，只播一個短音效
    if (silentMode.checked) {
      playBeep();
    } else {
      const u = speak(label, { rate: 1.35 });
      if (u) {
        u.onend = () => {
          if (listening && !ended && recognition) {
            try { recognition.start(); } catch (e) {}
          }
        };
      }
    }

    // 無論 TTS 播完未，0.3 秒後都確保識別在跑
    setTimeout(() => {
      if (listening && !ended && recognition) {
        try { recognition.start(); } catch (e) {}
      }
    }, 300);

    setStatus('idle', '待命');
    refreshTotal();
  }

  /* 短音效（靜音模式用） */
  let audioCtx = null;
  function playBeep() {
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = 880;
      g.gain.value = 0.15;
      o.connect(g).connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + 0.12);
    } catch (e) {}
  }

  function endSession() {
    if (ended) return;

    if (counting) {
      clearInterval(tickHandle);
      tickHandle = null;
      counting = false;
    }
    if ('speechSynthesis' in window) speechSynthesis.cancel();

    ended   = true;
    endedAt = Date.now();
    setStatus('ended', '已結束');

    const totalMs = sessionStart ? (endedAt - sessionStart) : 0;
    const summary =
      '今次運動，你總共完成咗' + numToCantonese(completedCount) + '次，' +
      '用咗' + formatDuration(totalMs) + '。';

    log('■ ' + summary, 'end');
    refreshTotal();

    const u = speak(summary);
    const finish = () => stopListening();

    if (u) {
      u.onend   = finish;
      u.onerror = finish;
      setTimeout(finish, 20000);
    } else {
      setTimeout(finish, 800);
    }
  }

  /* ---------------- 語音識別 ---------------- */
  function startListening() {
    if (!SpeechRecognition) {
      setStatus('error', '瀏覽器不支援');
      alert('此瀏覽器唔支援語音識別。\n請用 Chrome 或 Edge（Android / 電腦版）。');
      return false;
    }
    if (listening) return true;

    if (!recognition) {
      recognition = new SpeechRecognition();
      recognition.lang            = 'zh-HK';
      recognition.continuous      = true;
      recognition.interimResults  = true;
      recognition.maxAlternatives = 1;

      recognition.onresult = (ev) => {
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          // ★ 只處理最終結果，避免 interim 重複觸發
          if (!ev.results[i].isFinal) continue;
          const raw = (ev.results[i][0] && ev.results[i][0].transcript) || '';
          const clean = raw.replace(/[\s,，。、！!？?…·．.]/g, '');
          if (clean) handleTranscript(clean);
        }
      };

      recognition.onerror = (ev) => {
        if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
          listening = false;
          setStatus('error', '麥克風被拒絕');
          log('✖ 無法使用麥克風，請檢查權限設定', 'err');
        }
        // no-speech / aborted / network 交畀 onend 自動重啟
      };

      recognition.onend = () => {
        if (listening && !ended) {
          setTimeout(() => {
            if (listening && !ended) {
              try { recognition.start(); } catch (e) {}
            }
          }, 80);   // ★ 由 220ms 改做 80ms
        }
      };
    }

    listening = true;
    try { recognition.start(); } catch (e) {}
    return true;
  }

  function stopListening() {
    listening = false;
    if (recognition) {
      try { recognition.stop(); } catch (e) {}
    }
  }

  /* ---------------- 命令處理 ---------------- */
  function handleTranscript(text) {
    if (!text || ended) return;

    const now = Date.now();
    if (now < commandLock) return;

    let cmd = null;
    if (/結束|结束/.test(text))       cmd = 'end';
    else if (/取消/.test(text))       cmd = 'cancel';
    else if (/停/.test(text))         cmd = 'stop';
    else if (/開始|开始/.test(text))  cmd = 'start';

    if (!cmd) return;

    commandLock = now + 400;   // ★ 由 1200ms 改做 400ms

    if (cmd === 'start') {
      if (!counting) startLap();
    } else if (cmd === 'stop') {
      if (counting) endLap(false);
    } else if (cmd === 'cancel') {
      if (counting) endLap(true);
    } else if (cmd === 'end') {
      endSession();
    }
  }

  /* ---------------- 按鈕 ---------------- */
  startBtn.addEventListener('click', () => {
    // 解鎖 iOS 音頻
    try {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      speechSynthesis.speak(u);
    } catch (e) {}

    if (!startListening()) return;

    startBtn.disabled = true;
    startBtn.textContent = '語音控制啟動中…';
    setStatus('idle', '待命');
    log('● 語音控制已啟動', 'info');

    setTimeout(() => {
      speak('語音控制已啟動，請講「開始」。');
      startBtn.textContent = '語音控制已啟動';
    }, 600);
  });

  resetBtn.addEventListener('click', () => {
    if ('speechSynthesis' in window) speechSynthesis.cancel();

    clearInterval(tickHandle);
    tickHandle = null;
    counting = false;
    ended    = false;
    endedAt  = null;

    completedCount = 0;
    sessionStart   = null;
    lapStart       = null;
    secondsElapsed = 0;
    commandLock    = 0;

    counterEl.textContent = '0';
    doneEl.textContent    = '0';
    totalEl.textContent   = '0秒';
    logEl.innerHTML       = '';

    if (listening) {
      setStatus('idle', '待命');
      log('● 已重置，請講「開始」', 'info');
    } else {
      setStatus('idle', '未啟動');
      startBtn.disabled = false;
      startBtn.textContent = '啟動語音控制';
    }
  });

  /* ---------------- 初始化 ---------------- */
  setStatus('idle', '未啟動');
  log('準備好之後，撳「啟動語音控制」。', 'info');
  if (!SpeechRecognition) {
    log('⚠ 此瀏覽器不支援語音識別，請用 Chrome / Edge。', 'err');
  }
})();
</script>
</body>
</html>
