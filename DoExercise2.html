<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>粵語運動計時器</title>
<style>
  :root{
    --bg:#0e1013;
    --panel:#171b21;
    --panel2:#20262f;
    --txt:#e9edf2;
    --dim:#8b95a5;
    --accent:#22c55e;
    --accent-dim:#14532d;
    --blue:#3b82f6;
    --warn:#f59e0b;
    --danger:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Hiragino Sans CB","Microsoft JhengHei",sans-serif;
    background:var(--bg);color:var(--txt);
    display:flex;flex-direction:column;
    height:100dvh;overflow:hidden;
    padding-bottom:env(safe-area-inset-bottom);
  }

  /* ---------- 上半部 ---------- */
  .top{
    flex:0 0 auto;
    padding:10px 12px 6px;
    display:flex;flex-direction:column;gap:8px;
  }

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{
    flex:1 1 0;min-width:88px;
    padding:11px 10px;
    border:none;border-radius:12px;
    background:var(--panel2);color:var(--txt);
    font-size:14px;font-weight:600;
    font-family:inherit;
    cursor:pointer;
    transition:background .15s,transform .08s;
    white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
  }
  .btn:active{transform:scale(.96);}
  .btn.primary{background:var(--blue);color:#fff;}
  .btn.primary.on{background:var(--danger);}
  .btn.wide{flex:1 1 100%;}
  .btn.ghost{background:#232a34;color:var(--dim);}

  .stats{
    display:grid;grid-template-columns:1fr 1fr;gap:8px;
  }
  .stat{
    background:var(--panel);border-radius:12px;
    padding:8px 12px;
    display:flex;flex-direction:column;gap:2px;
  }
  .stat .label{font-size:11px;color:var(--dim);letter-spacing:.06em;}
  .stat .value{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;}

  .round{
    background:var(--panel);border-radius:14px;
    padding:10px 14px 14px;
    display:flex;flex-direction:column;align-items:center;
    gap:2px;
    position:relative;
    overflow:hidden;
  }
  .round .label{font-size:11px;color:var(--dim);letter-spacing:.08em;}
  .round .big{
    font-size:64px;line-height:1.05;font-weight:800;
    font-variant-numeric:tabular-nums;
    letter-spacing:-0.02em;
    transition:color .2s;
  }
  .round.running .big{color:var(--accent);}
  .round .status{
    font-size:13px;font-weight:600;color:var(--dim);
    letter-spacing:.05em;
  }
  .round.running .status{color:var(--accent);}

  .hint{
    font-size:11px;color:#5b6472;text-align:center;line-height:1.6;
  }
  .hint b{color:#7f8a99;}

  /* ---------- 下半部 ---------- */
  .bottom{
    flex:1 1 50%;
    min-height:0;
    display:flex;flex-direction:column;
    border-top:1px solid #232a34;
    margin-top:8px;
  }
  .hist-head{
    padding:8px 14px 6px;
    font-size:11px;color:var(--dim);
    letter-spacing:.1em;
    display:flex;justify-content:space-between;align-items:center;
  }
  .hist-head .count{color:#5b6472;font-variant-numeric:tabular-nums;}
  .history{
    flex:1;overflow-y:auto;
    padding:0 10px 14px;
    -webkit-overflow-scrolling:touch;
  }
  .hist-item{
    display:flex;align-items:center;
    padding:9px 12px;
    margin-bottom:6px;
    background:var(--panel);
    border-radius:10px;
    border-left:3px solid var(--accent);
    gap:10px;
    animation:slideIn .18s ease-out;
  }
  .hist-item.cancel{border-left-color:var(--warn);}
  @keyframes slideIn{from{opacity:0;transform:translateY(-5px);}to{opacity:1;transform:none;}}
  .hist-item .hn{
    font-size:13px;color:var(--dim);font-weight:600;
    min-width:52px;
  }
  .hist-item .ht{
    font-size:13px;font-weight:700;color:var(--accent);
    min-width:40px;
  }
  .hist-item.cancel .ht{color:var(--warn);}
  .hist-item .hs{
    margin-left:auto;
    font-size:15px;font-weight:700;
    font-variant-numeric:tabular-nums;
    color:var(--txt);
  }
  .empty{
    text-align:center;color:#454e5c;font-size:13px;
    padding:26px 0;
  }

  /* ---------- 總結橫幅 ---------- */
  .summary{
    display:none;
    margin:0 12px 12px;
    padding:14px;
    border-radius:14px;
    background:linear-gradient(135deg,#14532d,#166534);
    font-size:15px;font-weight:700;
    line-height:1.7;
    text-align:center;
    animation:slideIn .25s ease-out;
  }
  .summary.show{display:block;}
  .summary .big2{font-size:22px;display:block;margin-top:2px;}
</style>
</head>
<body>

<div class="top">
  <div class="toolbar">
    <button class="btn primary" id="btnStart">🎤 啟動語音控制</button>
    <button class="btn ghost" id="btnReset">重置</button>
  </div>
  <div class="toolbar">
    <button class="btn wide" id="btnInterval">🔔 報時：1秒</button>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="label">總時間</div>
      <div class="value" id="totalTime">00:00</div>
    </div>
    <div class="stat">
      <div class="label">已完成次數</div>
      <div class="value" id="doneCount">0</div>
    </div>
  </div>

  <div class="round" id="roundBox">
    <div class="label">本回合</div>
    <div class="big" id="roundSec">0.0</div>
    <div class="status" id="status">待機中</div>
  </div>

  <div class="hint">
    說 <b>「開始」</b> 計時　·　說 <b>「停止」</b> 完成一次　·　說 <b>「取消」</b> 取消本回合　·　說 <b>「結束」</b> 總結
  </div>
</div>

<div class="bottom">
  <div class="hist-head">
    <span>歷史記錄</span>
    <span class="count" id="histCount"></span>
  </div>
  <div class="history" id="history">
    <div class="empty">尚未有任何記錄</div>
  </div>
</div>

<div class="summary" id="summary"></div>

<script>
(function(){
'use strict';

/* ============================================================
   常數
============================================================ */
const INTERVALS = [
  {sec:1,   label:'1秒'},
  {sec:5,   label:'5秒'},
  {sec:10,  label:'10秒'},
  {sec:30,  label:'30秒'},
  {sec:60,  label:'1分鐘'},
  {sec:120, label:'2分鐘'},
  {sec:300, label:'5分鐘'}
];

const DIGITS = ['零','一','二','三','四','五','六','七','八','九'];

/* ============================================================
   狀態
============================================================ */
const S = {
  active: false,          // 語音控制已啟動
  ended:  false,          // 已說「結束」
  running:false,          // 正在計時
  completed: 0,           // 已完成次數 (x)
  roundNo: 0,             // 本回合編號
  history: [],            // {n, type:'done'|'cancel', sec}
  totalCompletedSec: 0,   // 完成回合的累計秒數
  roundStart: 0,
  lastSpokenSec: 0,
  intervalIdx: 0
};

let prioritySpeaking = false;    // 正在朗讀重要訊息（完成／取消／總結）
let cancelBlockUntil = 0;        // 防止程式自己講「取消」被誤聽
let cantoVoice = null;
let recog = null;

/* ============================================================
   工具：數字 → 粵語讀法
============================================================ */
function numCanto(n){
  n = Math.floor(n);
  if (n < 0) return '零';
  if (n < 10) return DIGITS[n];
  if (n < 20) return n === 10 ? '十' : '十' + DIGITS[n-10];
  const t = Math.floor(n/10), o = n % 10;
  return DIGITS[t] + '十' + (o ? DIGITS[o] : '');
}

/* 秒數 → 報時讀法
   1 → 一 ... 59 → 五十九
   60 → 一分鐘, 61 → 一分一, 70 → 一分十, 120 → 兩分鐘          */
function secToCanto(sec){
  sec = Math.floor(sec);
  if (sec < 60) return numCanto(sec);
  const m = Math.floor(sec/60), s = sec % 60;
  const mStr = (m === 1 ? '一' : m === 2 ? '兩' : numCanto(m)) + '分';
  if (s === 0) return mStr + '鐘';
  return mStr + numCanto(s);
}

/* 時長 → 「x分y秒」 */
function durText(sec){
  sec = Math.round(sec);
  const m = Math.floor(sec/60), s = sec % 60;
  if (m === 0) return numCanto(s) + '秒';
  if (s === 0) return numCanto(m) + '分';
  return numCanto(m) + '分' + numCanto(s) + '秒';
}

function fmtTime(sec){
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec/60), s = sec % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function fmtTimeD(sec){
  sec = Math.max(0, sec);
  const m = Math.floor(sec/60), s = sec - m*60;
  return String(m).padStart(2,'0') + ':' + s.toFixed(1).padStart(4,'0');
}

/* ============================================================
   語音合成
============================================================ */
function pickVoice(){
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  if (!vs || !vs.length) return;
  cantoVoice =
    vs.find(v => /zh[-_]HK/i.test(v.lang)) ||
    vs.find(v => /yue/i.test(v.lang)) ||
    vs.find(v => /zh[-_]TW/i.test(v.lang)) ||
    vs.find(v => /^zh/i.test(v.lang)) ||
    null;
}
if ('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

/* 快報：用來逐秒朗讀，語速按字數加快 */
function rateFor(text){
  const n = text.length;
  if (n <= 2) return 1.9;
  if (n <= 4) return 2.2;
  return 2.5;
}

function speakFast(text){
  if (!('speechSynthesis' in window)) return;
  if (prioritySpeaking) return;          // 重要訊息優先，不搶
  try{ speechSynthesis.cancel(); }catch(e){}
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-HK';
  if (cantoVoice) u.voice = cantoVoice;
  u.rate  = rateFor(text);
  u.pitch = 1.0;
  u.volume= 1.0;
  try{ speechSynthesis.speak(u); }catch(e){}
}

/* 重要朗讀：完成 / 取消 / 總結 —— 不會被逐秒朗讀打斷 */
function speakPriority(text){
  if (!('speechSynthesis' in window)){ prioritySpeaking = false; return; }

  prioritySpeaking = true;

  // 若內容含「取消」，暫時封鎖語音辨識的「取消」指令，避免自我觸發
  const hasCancel = text.indexOf('取消') >= 0;
  if (hasCancel){
    cancelBlockUntil = performance.now() + 500 + text.length * 320;
  }

  try{ speechSynthesis.cancel(); }catch(e){}

  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-HK';
  if (cantoVoice) u.voice = cantoVoice;
  u.rate  = 1.55;      // 稍快但仍清楚
  u.pitch = 1.0;
  u.volume= 1.0;

  let finished = false;
  const done = () => {
    if (finished) return;
    finished = true;
    prioritySpeaking = false;
    if (hasCancel){
      cancelBlockUntil = Math.max(cancelBlockUntil, performance.now() + 450);
    }
  };
  u.onend = done;
  u.onerror = done;

  // 保險計時器（防止 onend 不觸發）
  const guard = 400 + text.length * 350;
  setTimeout(done, guard);

  try{ speechSynthesis.speak(u); }catch(e){ done(); }
}

function warmUpTTS(){
  if (!('speechSynthesis' in window)) return;
  try{
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    u.rate = 2;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ============================================================
   語音辨識
============================================================ */
const lastCmdAt = {};
function cmdAllowed(key, gap){
  const now = performance.now();
  if (lastCmdAt[key] && now - lastCmdAt[key] < (gap || 700)) return false;
  lastCmdAt[key] = now;
  return true;
}

function processText(raw){
  if (!S.active || S.ended) return;
  const t = String(raw).replace(/[\s,，.。!！?？、；;：:''""「」『』（）()\-—…~]/g,'');
  if (!t) return;

  // 優先次序：結束 > 取消 > 停止 > 開始
  if (t.indexOf('結束') >= 0 || t.indexOf('结束') >= 0){
    if (cmdAllowed('end', 1200)) handleEnd();
    return;
  }
  if (t.indexOf('取消') >= 0){
    if (performance.now() >= cancelBlockUntil && cmdAllowed('cancel', 900)) handleCancel();
    return;
  }
  if (t.indexOf('停止') >= 0 || t.indexOf('停低') >= 0 || t.indexOf('停下') >= 0){
    if (cmdAllowed('stop', 900)) handleStop();
    return;
  }
  if (t.indexOf('開始') >= 0 || t.indexOf('开始') >= 0){
    if (cmdAllowed('start', 900)) handleStart();
    return;
  }
}

function startRecog(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){
    alert('你的瀏覽器不支援語音辨識，請使用 Chrome 或 Edge。');
    return;
  }

  if (!recog){
    recog = new SR();
    recog.lang = 'zh-HK';
    recog.continuous = true;
    recog.interimResults = true;
    recog.maxAlternatives = 1;

    recog.onresult = function(e){
      for (let i = e.resultIndex; i < e.results.length; i++){
        const r = e.results[i];
        if (r && r[0] && r[0].transcript) processText(r[0].transcript);
      }
    };
    recog.onerror = function(e){
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        S.active = false;
        setBtnIdle();
        setStatus('麥克風被拒絕');
      }
    };
    recog.onend = function(){
      if (S.active && !S.ended){
        setTimeout(function(){
          if (S.active && !S.ended){
            try{ recog.start(); }catch(err){}
          }
        }, 120);
      }
    };
  }

  S.active = true;
  S.ended = false;
  try{ recog.start(); }catch(e){}

  const btn = document.getElementById('btnStart');
  btn.textContent = '🎙 語音控制中（點擊停止）';
  btn.classList.add('on');
  setStatus('待機中');

  warmUpTTS();
}

function stopRecog(){
  S.active = false;
  if (recog){ try{ recog.stop(); }catch(e){} }
  setBtnIdle();
}

function setBtnIdle(){
  const btn = document.getElementById('btnStart');
  btn.textContent = '🎤 啟動語音控制';
  btn.classList.remove('on');
}

/* ============================================================
   核心動作
============================================================ */
function handleStart(){
  if (!S.active || S.ended || S.running) return;

  S.running = true;
  S.roundNo = S.completed + 1;
  S.roundStart = performance.now();
  S.lastSpokenSec = 0;

  document.getElementById('roundBox').classList.add('running');
  setStatus('計時中…');
  render();
}

function handleStop(){
  if (!S.running) return;

  const secs = (performance.now() - S.roundStart) / 1000;
  S.running = false;
  S.completed = S.roundNo;
  S.totalCompletedSec += secs;

  S.history.push({n: S.roundNo, type:'done', sec: secs});

  document.getElementById('roundBox').classList.remove('running');
  setStatus('完成 第' + numCanto(S.roundNo) + '次');

  try{ speechSynthesis.cancel(); }catch(e){}
  speakPriority('第' + numCanto(S.roundNo) + '次完成');

  renderHistory();
  render();
}

function handleCancel(){
  if (!S.running) return;

  const secs = (performance.now() - S.roundStart) / 1000;
  S.running = false;

  S.history.push({n: S.roundNo, type:'cancel', sec: secs});

  document.getElementById('roundBox').classList.remove('running');
  setStatus('已取消 第' + numCanto(S.roundNo) + '次');

  try{ speechSynthesis.cancel(); }catch(e){}
  speakPriority('第' + numCanto(S.roundNo) + '次取消');

  renderHistory();
  render();
}

function handleEnd(){
  if (S.ended) return;

  S.running = false;
  S.ended  = true;
  S.active = false;

  const totalSec = Math.round(S.totalCompletedSec);
  const n = S.completed;

  if (recog){ try{ recog.stop(); }catch(e){} }
  setBtnIdle();

  document.getElementById('roundBox').classList.remove('running');
  setStatus('已結束');

  showSummary(n, totalSec);

  try{ speechSynthesis.cancel(); }catch(e){}
  speakPriority('今次運動，你總共完成咗' + numCanto(n) + '次，用咗' + durText(totalSec));

  render();
}

/* ============================================================
   逐秒報時
============================================================ */
function shouldSpeakAt(sec){
  const iv = INTERVALS[S.intervalIdx].sec;
  if (sec <= 0) return false;
  if (iv === 1) return true;
  return sec % iv === 0;
}

setInterval(function(){
  if (S.running){
    const elapsed = (performance.now() - S.roundStart) / 1000;
    const whole = Math.floor(elapsed);

    if (whole > S.lastSpokenSec && whole > 0){
      // 跳報：只報最新一秒，落後的直接跳過
      S.lastSpokenSec = whole;
      if (!prioritySpeaking && shouldSpeakAt(whole)){
        speakFast(secToCanto(whole));
      }
    }
  }
  render();
}, 55);

/* ============================================================
   畫面更新
============================================================ */
function setStatus(txt){
  document.getElementById('status').textContent = txt;
}

function render(){
  let cur = 0;
  if (S.running) cur = (performance.now() - S.roundStart) / 1000;

  document.getElementById('roundSec').textContent = cur.toFixed(1);

  const total = S.totalCompletedSec + cur;
  document.getElementById('totalTime').textContent = fmtTime(total);
  document.getElementById('doneCount').textContent = S.completed;
}

function renderHistory(){
  const box = document.getElementById('history');
  const cnt = document.getElementById('histCount');

  if (!S.history.length){
    box.innerHTML = '<div class="empty">尚未有任何記錄</div>';
    cnt.textContent = '';
    return;
  }

  cnt.textContent = S.history.length + ' 筆';

  const html = S.history.slice().reverse().map(function(h){
    const cls = h.type === 'done' ? '' : 'cancel';
    const label = h.type === 'done' ? '完成' : '取消';
    return '<div class="hist-item ' + cls + '">' +
             '<span class="hn">第 ' + h.n + ' 次</span>' +
             '<span class="ht">' + label + '</span>' +
             '<span class="hs">' + fmtTimeD(h.sec) + '</span>' +
           '</div>';
  }).join('');

  box.innerHTML = html;
}

function showSummary(n, totalSec){
  const el = document.getElementById('summary');
  const m = Math.floor(totalSec/60), s = totalSec % 60;
  el.innerHTML =
    '🏁 今次運動總結' +
    '<span class="big2">總共完成咗 ' + n + ' 次</span>' +
    '<span class="big2">用咗 ' + m + ' 分 ' + s + ' 秒</span>';
  el.classList.add('show');
}

/* ============================================================
   按鈕事件
============================================================ */
document.getElementById('btnStart').addEventListener('click', function(){
  if (S.active) stopRecog();
  else {
    // 重置結束狀態，重新開始
    if (S.ended){
      S.ended = false;
    }
    startRecog();
  }
});

document.getElementById('btnReset').addEventListener('click', function(){
  S.running = false;
  S.ended = false;
  S.completed = 0;
  S.roundNo = 0;
  S.history = [];
  S.totalCompletedSec = 0;
  S.lastSpokenSec = 0;
  prioritySpeaking = false;
  cancelBlockUntil = 0;

  for (const k in lastCmdAt) delete lastCmdAt[k];

  if (recog){ try{ recog.stop(); }catch(e){} }
  S.active = false;
  setBtnIdle();

  if ('speechSynthesis' in window){ try{ speechSynthesis.cancel(); }catch(e){} }

  document.getElementById('roundBox').classList.remove('running');
  document.getElementById('summary').classList.remove('show');
  document.getElementById('summary').innerHTML = '';
  setStatus('待機中');

  renderHistory();
  render();
});

document.getElementById('btnInterval').addEventListener('click', function(){
  S.intervalIdx = (S.intervalIdx + 1) % INTERVALS.length;
  this.textContent = '🔔 報時：' + INTERVALS[S.intervalIdx].label;
});

/* ============================================================
   初始化
============================================================ */
renderHistory();
render();
setStatus('待機中');

// 若之前已有「結束」，頁面重載後自動清空
window.addEventListener('beforeunload', function(){
  if ('speechSynthesis' in window){ try{ speechSynthesis.cancel(); }catch(e){} }
});

})();
</script>
</body>
</html>
