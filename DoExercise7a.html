<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>粵語計時器 v7a</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background: #0d1015; color: #e8ecf1;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Microsoft JhengHei", "Noto Sans HK", "Helvetica Neue", sans-serif;
  overscroll-behavior: none;
  user-select: none;
}
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

#top { flex: 0 0 auto; padding: 10px 12px 8px; }

#stateRow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
#stateTag {
  font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 999px;
  background: #1c2230; color: #8d9aab; letter-spacing: .5px;
  transition: all .2s;
}
#stateTag.running { background: #0d3a26; color: #3ddc84; box-shadow: 0 0 0 1px #1c6b45 inset; }
#stateTag.done    { background: #3a2a0d; color: #ffc857; }
#micState { font-size: 12px; color: #6b7788; }

#stats { display: flex; gap: 8px; margin-bottom: 10px; }
.stat {
  flex: 1; background: #151a22; border-radius: 12px; padding: 8px 6px;
  text-align: center; border: 1px solid #1e2632;
}
.stat .lbl { font-size: 11px; color: #6b7788; margin-bottom: 2px; letter-spacing: 1px; }
.stat .val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
#statRound { color: #3ddc84; }
#statDone { color: #ffc857; }

.btnRow { display: flex; gap: 8px; margin-bottom: 8px; }
.btn {
  flex: 1; border: none; border-radius: 12px; padding: 13px 8px;
  font-size: 15px; font-weight: 700; font-family: inherit;
  background: #1c2230; color: #cfd8e3; cursor: pointer;
  transition: transform .08s, background .2s;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: linear-gradient(135deg, #1d6ef5, #0b4bc4); color: #fff; flex: 1.6; }
.btn.primary.on { background: linear-gradient(135deg, #10b981, #059669); }
.btn.warn { background: #2a1c22; color: #ff8fa3; }

.row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.row.wrap { flex-wrap: wrap; }
.rowLbl { font-size: 12px; color: #6b7788; letter-spacing: 1px; flex: 0 0 auto; }
.rateVal {
  min-width: 44px; text-align: center; font-size: 15px; font-weight: 700;
  font-variant-numeric: tabular-nums; color: #7cb0ff;
}
.mini {
  width: 42px; height: 34px; border: none; border-radius: 10px;
  background: #1c2230; color: #cfd8e3; font-size: 18px; font-weight: 700;
  cursor: pointer; font-family: inherit;
}
.mini:active { transform: scale(.94); }

.chipWrap { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
.chip {
  border: 1px solid #232c3a; background: #151a22; color: #8794a6;
  border-radius: 999px; padding: 6px 11px; font-size: 12px;
  font-family: inherit; font-weight: 600; cursor: pointer; transition: all .15s;
}
.chip.active { background: #1d6ef5; border-color: #1d6ef5; color: #fff; }
.chip:active { transform: scale(.95); }

#bottom {
  flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
  padding: 0 12px 12px;
}
#histHead {
  font-size: 11px; color: #6b7788; letter-spacing: 2px;
  padding: 8px 2px 6px; border-top: 1px solid #1a212b;
}
#histList { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; }
#histList::-webkit-scrollbar { width: 4px; }
#histList::-webkit-scrollbar-thumb { background: #2a3441; border-radius: 2px; }

.histItem {
  display: flex; align-items: center; gap: 10px;
  background: #131820; border-radius: 10px; padding: 10px 12px;
  margin-bottom: 6px; border-left: 3px solid #2a3441;
  animation: slideIn .18s ease;
}
@keyframes slideIn { from { opacity:0; transform: translateY(-4px);} to {opacity:1;transform:none;} }
.histItem.done { border-left-color: #3ddc84; }
.histItem.cancel { border-left-color: #ff6b81; }
.hIdx { font-size: 13px; color: #8794a6; flex: 0 0 auto; font-weight: 600; }
.hType { font-size: 13px; font-weight: 700; flex: 1; }
.histItem.done .hType { color: #3ddc84; }
.histItem.cancel .hType { color: #ff6b81; }
.hDur { font-size: 14px; font-variant-numeric: tabular-nums; color: #cfd8e3; font-weight: 600; }

#summary {
  flex: 0 0 auto; font-size: 14px; line-height: 1.6; color: #ffc857;
  padding: 10px 12px; background: #191f29; border-radius: 12px;
  margin-top: 8px; display: none; font-weight: 600;
  border: 1px solid #2a3441;
}
#summary.show { display: block; }

#toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
  background: #e8ecf1; color: #0d1015; padding: 10px 20px; border-radius: 999px;
  font-size: 13px; font-weight: 700; opacity: 0; pointer-events: none;
  transition: all .25s; z-index: 99;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="app">
  <div id="top">
    <div id="stateRow">
      <div id="stateTag">待機</div>
      <div id="micState">🎤 未啟動</div>
    </div>

    <div id="stats">
      <div class="stat"><div class="lbl">總時間</div><div class="val" id="statTotal">00:00</div></div>
      <div class="stat"><div class="lbl">已完成</div><div class="val" id="statDone">0</div></div>
      <div class="stat"><div class="lbl">本回合</div><div class="val" id="statRound">0.0</div></div>
    </div>

    <div class="btnRow">
      <button id="btnVoice" class="btn primary">🎤 啟動語音控制</button>
      <button id="btnReset" class="btn warn">重置</button>
      <button id="btnCopy" class="btn">匯出</button>
    </div>

    <div class="row">
      <span class="rowLbl">語速</span>
      <button id="rateDown" class="mini">−</button>
      <span id="rateVal" class="rateVal">1.3</span>
      <button id="rateUp" class="mini">＋</button>
    </div>

    <div class="row wrap">
      <span class="rowLbl">報時</span>
      <div id="intervalBtns" class="chipWrap"></div>
    </div>
  </div>

  <div id="bottom">
    <div id="histHead">歷史記錄</div>
    <div id="histList"></div>
    <div id="summary"></div>
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
'use strict';

/* =========================================================
   元素
   ========================================================= */
const $ = id => document.getElementById(id);
const elStateTag  = $('stateTag');
const elMicState  = $('micState');
const elTotal     = $('statTotal');
const elDone      = $('statDone');
const elRound     = $('statRound');
const elHistList  = $('histList');
const elSummary   = $('summary');
const elBtnVoice  = $('btnVoice');
const elBtnReset  = $('btnReset');
const elBtnCopy   = $('btnCopy');
const elRateVal   = $('rateVal');
const elRateDown  = $('rateDown');
const elRateUp    = $('rateUp');
const elIntervals = $('intervalBtns');
const elToast     = $('toast');

/* =========================================================
   狀態
   ========================================================= */
let running         = false;
let ended           = false;
let startTime       = 0;
let firstStartTime  = null;
let sessionDate     = null;
let completed       = 0;
let history         = [];
let totalMs         = 0;

let lastSpokenSec   = 0;
let lastAnnounceIdx = 0;
let announceInterval = 1;
let speechRate      = 1.3;

/* =========================================================
   中文數字
   ========================================================= */
const D = ['零','一','二','三','四','五','六','七','八','九'];

function numCN(n) {
  n = Math.round(n);
  if (n < 0) return '零';
  if (n < 10) return D[n];
  if (n < 20) return '十' + (n % 10 ? D[n % 10] : '');
  if (n < 100) {
    const t = Math.floor(n / 10), o = n % 10;
    return D[t] + '十' + (o ? D[o] : '');
  }
  return String(n);
}
function numCN2(n) {
  n = Math.round(n);
  return n === 2 ? '兩' : numCN(n);
}

function durText(s) {
  s = Math.round(s);
  if (s <= 0) return '零';
  if (s < 60) return numCN(s);
  const m = Math.floor(s / 60), sec = s % 60;
  if (sec === 0) return numCN2(m) + '分鐘';
  return numCN2(m) + '分' + numCN2(sec) + '秒';
}

function fmtDur(sec) {
  sec = Math.round(sec);
  if (sec < 60) return sec + '秒';
  const m = Math.floor(sec / 60), s = sec % 60;
  return s ? (m + '分' + s + '秒') : (m + '分鐘');
}
function fmtMMSS(ms) {
  const t = Math.floor(ms / 1000);
  const m = Math.floor(t / 60), s = t % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}
function fmtClock(d) {
  const p = n => String(n).padStart(2, '0');
  return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

/* =========================================================
   語音合成 —— v7a 核心修改 1：同步送出、無 setTimeout
   ========================================================= */
let voices = [];
function loadVoices() {
  if (!('speechSynthesis' in window)) return;
  voices = window.speechSynthesis.getVoices() || [];
}
if ('speechSynthesis' in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}
function pickVoice() {
  if (!voices.length) loadVoices();
  return voices.find(v => /^yue|yue[-_]/i.test(v.lang))
      || voices.find(v => /zh[-_]HK/i.test(v.lang))
      || voices.find(v => /zh[-_]TW/i.test(v.lang))
      || voices.find(v => /^zh/i.test(v.lang))
      || null;
}

/* 原子操作：cancel 與 speak 之間零空窗，維持 audio focus
   （這是 screen off 下能持續出聲的關鍵） */
function speak(text, interrupt) {
  if (!('speechSynthesis' in window)) return;

  if (interrupt) {
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }

  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-HK';
  u.rate = speechRate;
  u.pitch = 1;
  u.volume = 1;
  const v = pickVoice();
  if (v) u.voice = v;

  try { window.speechSynthesis.speak(u); } catch (e) {}
}

/* =========================================================
   語音辨識 —— v7a 核心修改 2 & 4：
   - 移除 isEcho（TTS 已不含觸發字，不需回音過濾）
   - 重啟延遲 220ms → 100ms
   - 補 visibilitychange
   ========================================================= */
let recog = null;
let wantRecog = false;
let recogRunning = false;
let restartTimer = null;
let lastCmdAt = 0;

function buildRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;

  const r = new SR();
  r.lang = 'zh-HK';
  r.continuous = true;
  r.interimResults = true;
  r.maxAlternatives = 3;

  r.onstart = function () { recogRunning = true; };

  r.onresult = function (e) {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const txt = e.results[i][0].transcript;
      const cmd = detectCommand(txt);
      if (!cmd) continue;

      const now = Date.now();
      if (now - lastCmdAt < 650) continue;   // 只保留防抖

      lastCmdAt = now;
      handleCommand(cmd);
    }
  };

  r.onerror = function (e) {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      wantRecog = false;
      recogRunning = false;
      elMicState.textContent = '🚫 麥克風被拒';
      elBtnVoice.classList.remove('on');
      elBtnVoice.textContent = '🎤 啟動語音控制';
    }
  };

  r.onend = function () {
    recogRunning = false;
    if (wantRecog && !ended) {
      if (restartTimer) clearTimeout(restartTimer);
      restartTimer = setTimeout(function () {
        if (!wantRecog || ended || recogRunning) return;
        try { r.start(); recogRunning = true; } catch (e) {}
      }, 100);   // ← v7a：由 220 縮到 100
    }
  };

  return r;
}

function detectCommand(text) {
  const t = text.replace(/[\s，。！？、,.!?·]/g, '');
  if (!t) return null;
  if (t.indexOf('取消') !== -1) return 'cancel';
  if (t.indexOf('停止') !== -1 || t.indexOf('停下') !== -1 || t.indexOf('停低') !== -1) return 'stop';
  if (t.indexOf('結束') !== -1 || t.indexOf('结束') !== -1 ||
      t.indexOf('完結') !== -1 || t.indexOf('完结') !== -1) return 'end';
  if (t.indexOf('開始') !== -1 || t.indexOf('开始') !== -1) return 'start';
  return null;
}

function handleCommand(cmd) {
  if (cmd === 'start') {
    if (ended) return;
    if (running) return;
    startRound();
  } else if (cmd === 'stop') {
    if (!running) return;
    stopRound('完成');
  } else if (cmd === 'cancel') {
    if (!running) return;
    stopRound('取消');
  } else if (cmd === 'end') {
    endSession();
  }
}

/* =========================================================
   計時邏輯 —— v7a 核心修改 3：TTS 內容不含觸發字
   ========================================================= */
function startRound() {
  startTime = Date.now();
  if (firstStartTime === null) {
    firstStartTime = startTime;
    sessionDate = new Date();
    totalMs = 0;
  }
  running = true;
  lastSpokenSec = 0;
  lastAnnounceIdx = 0;
  elSummary.classList.remove('show');

  // v7a：改用中性詞，避免 ASR 收到自己的回音
  speak('準備', true);

  updateStateUI();
}

function stopRound(type) {
  running = false;
  const elapsedMs = Date.now() - startTime;
  const sec = Math.max(0, Math.round(elapsedMs / 1000));

  if (type === '完成') {
    completed += 1;
    history.push({ n: completed, type: '完成', sec: sec });
    // v7a：只播「第X次」，不播「完成」二字（雖然「完成」非觸發字，
    //       但保留數字＋中性詞風格，與 v6 一致）
    speak('第' + numCN(completed) + '次', true);
  } else {
    const idx = completed + 1;
    history.push({ n: idx, type: '取消', sec: sec });
    // v7a：原本播「第X次取消」含觸發字，改為只播數字
    speak('第' + numCN(idx) + '次', true);
  }

  lastSpokenSec = 0;
  lastAnnounceIdx = 0;
  renderHistory();
  updateStateUI();
}

function endSession() {
  if (ended) return;

  if (running) running = false;

  ended = true;
  wantRecog = false;
  if (restartTimer) clearTimeout(restartTimer);
  if (recog) { try { recog.stop(); } catch (e) {} }

  if (firstStartTime !== null) {
    totalMs = Date.now() - firstStartTime;
  }
  const totalSec = Math.round(totalMs / 1000);

  // v7a：TTS 總結語全部改為數字／中性詞，絕不出現「結束」
  const m = Math.floor(totalSec / 60), s = totalSec % 60;
  let txt = numCN(completed) + '次，';
  if (m > 0 && s > 0)  txt += numCN(m) + '分' + numCN(s) + '秒';
  else if (m > 0)      txt += numCN(m) + '分鐘';
  else                 txt += numCN(s) + '秒';
  speak(txt, true);

  // 畫面文字不受影響，可以照舊寫得漂亮
  elSummary.textContent =
    '今次運動，總共完成 ' + completed + ' 次，用咗 ' + fmtDur(totalSec) + '。';
  elSummary.classList.add('show');

  elBtnVoice.classList.remove('on');
  elBtnVoice.textContent = '🎤 啟動語音控制';
  elMicState.textContent = '🏁 已結束';
  updateStateUI();
}

/* =========================================================
   tick
   ========================================================= */
function tick() {
  const now = Date.now();

  if (firstStartTime !== null && !ended) {
    totalMs = now - firstStartTime;
  }
  elTotal.textContent = fmtMMSS(totalMs);

  if (!running) return;

  const elapsedMs = now - startTime;
  elRound.textContent = (elapsedMs / 1000).toFixed(1);

  const s = Math.floor(elapsedMs / 1000);

  if (announceInterval === 1) {
    if (s >= 1 && s > lastSpokenSec) {
      lastSpokenSec = s;
      speak(durText(s), true);
    }
  } else {
    const idx = Math.floor(s / announceInterval);
    if (idx > lastAnnounceIdx && idx >= 1) {
      lastAnnounceIdx = idx;
      speak(durText(s), true);
    }
  }
}

/* =========================================================
   UI 更新
   ========================================================= */
function updateStateUI() {
  elDone.textContent = completed;

  if (ended) {
    elStateTag.textContent = '已結束';
    elStateTag.className = 'done';
    elRound.textContent = '0.0';
    return;
  }
  if (running) {
    elStateTag.textContent = '計時中';
    elStateTag.className = 'running';
  } else {
    elStateTag.textContent = '待機';
    elStateTag.className = '';
    elRound.textContent = '0.0';
  }
}

function renderHistory() {
  elHistList.innerHTML = '';
  for (let i = 0; i < history.length; i++) {
    const it = history[i];
    const d = document.createElement('div');
    d.className = 'histItem ' + (it.type === '完成' ? 'done' : 'cancel');
    d.innerHTML =
      '<span class="hIdx">第' + it.n + '次</span>' +
      '<span class="hType">' + it.type + '</span>' +
      '<span class="hDur">' + fmtDur(it.sec) + '</span>';
    elHistList.appendChild(d);
  }
  elHistList.scrollTop = elHistList.scrollHeight;
}

function toast(msg) {
  elToast.textContent = msg;
  elToast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { elToast.classList.remove('show'); }, 1600);
}

/* =========================================================
   匯出記錄
   ========================================================= */
function buildRecordText() {
  const now = new Date();
  const p = n => String(n).padStart(2, '0');
  let out = '';
  out += '粵語計時器 v7a — 運動記錄\n';
  out += '日期：' + now.getFullYear() + '-' + p(now.getMonth() + 1) + '-' + p(now.getDate()) + '\n';
  out += '匯出時間：' + fmtClock(now) + '\n';
  if (sessionDate) out += '開始時間：' + fmtClock(sessionDate) + '\n';
  out += '────────────────────────\n';

  if (!history.length) {
    out += '（無記錄）\n';
  } else {
    for (let i = 0; i < history.length; i++) {
      const it = history[i];
      out += '第' + it.n + '次\t' + it.type + '\t' + fmtDur(it.sec) + '\n';
    }
  }

  out += '────────────────────────\n';
  out += '總共完成：' + completed + ' 次\n';
  out += '總耗時：' + fmtDur(Math.round(totalMs / 1000)) + '\n';
  return out;
}

async function copyRecords() {
  const txt = buildRecordText();
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(txt);
    } else {
      throw new Error('no clipboard');
    }
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); } catch (e2) {}
    document.body.removeChild(ta);
  }
  toast('✅ 已複製到剪貼簿');
}

/* =========================================================
   重置
   ========================================================= */
function resetAll() {
  running = false;
  ended = false;
  startTime = 0;
  firstStartTime = null;
  sessionDate = null;
  completed = 0;
  history = [];
  totalMs = 0;
  lastSpokenSec = 0;
  lastAnnounceIdx = 0;

  try { window.speechSynthesis.cancel(); } catch (e) {}

  elSummary.classList.remove('show');
  elSummary.textContent = '';
  elHistList.innerHTML = '';
  updateStateUI();
  elTotal.textContent = '00:00';
  elRound.textContent = '0.0';
  toast('已重置');
}

/* =========================================================
   報時間隔按鈕
   ========================================================= */
const INTERVALS = [
  { l: '1秒',  v: 1 },
  { l: '2秒',  v: 2 },
  { l: '5秒',  v: 5 },
  { l: '10秒', v: 10 },
  { l: '30秒', v: 30 },
  { l: '1分鐘', v: 60 },
  { l: '2分鐘', v: 120 },
  { l: '5分鐘', v: 300 }
];

(function buildIntervalButtons() {
  INTERVALS.forEach(function (it) {
    const b = document.createElement('button');
    b.className = 'chip' + (it.v === 1 ? ' active' : '');
    b.textContent = it.l;
    b.dataset.v = it.v;
    b.addEventListener('click', function () {
      announceInterval = it.v;
      const all = elIntervals.querySelectorAll('.chip');
      for (let i = 0; i < all.length; i++) all[i].classList.remove('active');
      b.classList.add('active');
      lastSpokenSec = 0;
      lastAnnounceIdx = 0;
      toast('報時間隔：' + it.l);
    });
    elIntervals.appendChild(b);
  });
})();

/* =========================================================
   事件綁定
   ========================================================= */
elBtnVoice.addEventListener('click', function () {
  if (ended) {
    toast('已結束，請先按「重置」');
    return;
  }

  if (!recog) {
    recog = buildRecognition();
    if (!recog) {
      toast('此瀏覽器不支援語音辨識，請用 Chrome');
      return;
    }
  }

  if (wantRecog) {
    wantRecog = false;
    if (restartTimer) clearTimeout(restartTimer);
    try { recog.stop(); } catch (e) {}
    elBtnVoice.classList.remove('on');
    elBtnVoice.textContent = '🎤 啟動語音控制';
    elMicState.textContent = '🎤 已暫停';
  } else {
    wantRecog = true;
    try { recog.start(); recogRunning = true; } catch (e) {}
    elBtnVoice.classList.add('on');
    elBtnVoice.textContent = '🎙️ 語音控制中（點擊暫停）';
    elMicState.textContent = '🎤 聆聽中…';
    // 解鎖語音合成（部分瀏覽器首次朗讀需暖機）
    try {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
});

elBtnReset.addEventListener('click', resetAll);
elBtnCopy.addEventListener('click', copyRecords);

elRateDown.addEventListener('click', function () {
  speechRate = Math.max(0.5, Math.round((speechRate - 0.1) * 10) / 10);
  elRateVal.textContent = speechRate.toFixed(1);
});
elRateUp.addEventListener('click', function () {
  speechRate = Math.min(2.5, Math.round((speechRate + 0.1) * 10) / 10);
  elRateVal.textContent = speechRate.toFixed(1);
});

/* =========================================================
   v7a 核心修改 4：回到前台時補啟動辨識
   ========================================================= */
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && wantRecog && !recogRunning && !ended) {
    try { recog.start(); recogRunning = true; } catch (e) {}
  }
});

/* =========================================================
   啟動
   ========================================================= */
elRateVal.textContent = speechRate.toFixed(1);
updateStateUI();
setInterval(tick, 50);

document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

})();
</script>
</body>
</html>
