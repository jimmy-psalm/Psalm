<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1117">
<title>粵語運動計時器</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2430;
  --accent:#3fb950; --blue:#58a6ff; --warn:#f0883e; --danger:#f85149;
  --text:#e6edf3; --dim:#8b949e; --line:#30363d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","PingFang TC","Microsoft JhengHei","Noto Sans CJK HK",sans-serif;
  height:100vh;height:100dvh;overflow:hidden;
  display:flex;flex-direction:column;
  user-select:none;
}
header{
  flex:0 0 auto;padding:10px 14px 4px;
  font-size:15px;font-weight:700;letter-spacing:.5px;
  display:flex;align-items:center;gap:8px;
}
header .dot{width:8px;height:8px;border-radius:50%;background:#555;transition:.2s;}
header .dot.on{background:var(--accent);box-shadow:0 0 8px var(--accent);}

.stats{display:flex;gap:8px;padding:8px 12px 4px;flex:0 0 auto;}
.stat{
  flex:1;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:7px 4px;text-align:center;min-width:0;
}
.stat .lbl{font-size:10.5px;color:var(--dim);letter-spacing:.5px;}
.stat .val{
  font-size:23px;font-weight:800;line-height:1.15;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.stat .val.small{font-size:19px;}

.row{display:flex;gap:8px;padding:6px 12px 0;flex:0 0 auto;}
.btn{
  flex:1;padding:11px 6px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel2);color:var(--text);
  font-size:14.5px;font-weight:700;cursor:pointer;
  transition:filter .12s, transform .06s;
  font-family:inherit;
}
.btn:active{transform:scale(.97);}
.btn.primary{background:linear-gradient(180deg,#238636,#17652a);border-color:#2ea043;}
.btn.listening{background:linear-gradient(180deg,#da3633,#9e2b28);border-color:#f85149;}
.btn.wide{flex:1;}
.btn.small{flex:0 0 54px;font-size:19px;padding:11px 0;}

.rateline{display:flex;align-items:center;gap:8px;padding:6px 12px 0;flex:0 0 auto;}
.rateline .btn{flex:0 0 56px;padding:9px 0;font-size:18px;}
.rateline .val{
  flex:1;text-align:center;font-size:13.5px;color:var(--dim);
  background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:10px 0;font-weight:700;
}

.statusbar{
  flex:0 0 auto;margin:8px 12px 0;padding:8px 12px;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  font-size:12.5px;color:var(--dim);line-height:1.5;
  display:flex;flex-direction:column;gap:2px;
}
.statusbar b{color:var(--text);font-weight:700;}
.statusbar .heard{color:var(--blue);}

.history{
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  margin:10px 12px 10px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  overflow:hidden;
}
.history .title{
  flex:0 0 auto;padding:9px 14px;font-size:12.5px;font-weight:700;color:var(--dim);
  border-bottom:1px solid var(--line);letter-spacing:.6px;
}
.history ul{
  flex:1 1 auto;overflow-y:auto;margin:0;padding:8px;list-style:none;
  -webkit-overflow-scrolling:touch;
}
.history li{
  display:flex;align-items:center;gap:10px;
  padding:9px 11px;margin-bottom:6px;
  background:var(--panel2);border-radius:10px;
  border-left:4px solid var(--line);
  font-size:14px;
}
.history li.done{border-left-color:var(--accent);}
.history li.cancel{border-left-color:var(--warn);}
.history li.summary{border-left-color:var(--blue);background:#132030;}
.history li .no{font-weight:800;min-width:64px;}
.history li .tag{
  font-size:11.5px;padding:2px 8px;border-radius:20px;font-weight:700;
}
.history li.done .tag{background:rgba(63,185,80,.18);color:var(--accent);}
.history li.cancel .tag{background:rgba(240,136,62,.18);color:var(--warn);}
.history li.summary .tag{background:rgba(88,166,255,.18);color:var(--blue);}
.history li .time{
  margin-left:auto;font-variant-numeric:tabular-nums;color:var(--dim);
  font-weight:700;font-size:13.5px;
}
.history .empty{
  color:#4b5563;text-align:center;padding:22px 0;font-size:13px;
}
.history li.summary{font-size:13px;}
</style>
</head>
<body>

<header>
  <span class="dot" id="dot"></span>
  <span>粵語運動計時器</span>
</header>

<div class="stats">
  <div class="stat"><div class="lbl">總時間</div><div class="val" id="totalTime">00:00</div></div>
  <div class="stat"><div class="lbl">已完成</div><div class="val" id="doneCount">0</div></div>
  <div class="stat"><div class="lbl">本回合（秒）</div><div class="val small" id="roundSec">0</div></div>
</div>

<div class="row">
  <button class="btn primary wide" id="voiceBtn">🎤 啟動語音控制</button>
  <button class="btn wide" id="resetBtn">↺ 重置</button>
</div>

<div class="row">
  <button class="btn wide" id="intervalBtn">報時間隔：1 秒</button>
</div>

<div class="rateline">
  <button class="btn" id="rateDown">－</button>
  <div class="val" id="rateLabel">語速 1.3×</div>
  <button class="btn" id="rateUp">＋</button>
</div>

<div class="statusbar">
  <div>狀態：<b id="statusText">待機中 — 按「啟動語音控制」</b></div>
  <div class="heard">聽到：<span id="heardText">—</span></div>
</div>

<div class="history">
  <div class="title">歷史記錄</div>
  <ul id="historyList"><li class="empty">尚無記錄</li></ul>
</div>

<script>
/* ============================================================
   粵語運動計時器
   ============================================================ */

const $ = id => document.getElementById(id);

const elDot      = $('dot');
const elTotal    = $('totalTime');
const elCount    = $('doneCount');
const elRound    = $('roundSec');
const elVoiceBtn = $('voiceBtn');
const elResetBtn = $('resetBtn');
const elIntBtn   = $('intervalBtn');
const elRateUp   = $('rateUp');
const elRateDown = $('rateDown');
const elRateLbl  = $('rateLabel');
const elStatus   = $('statusText');
const elHeard    = $('heardText');
const elHistory  = $('historyList');

/* ---------------- 狀態 ---------------- */
const state = {
  running:      false,   // 是否正在計時
  startTime:    0,       // 本回合開始時間
  totalStart:   0,       // 第一次「開始」的時間
  currentSec:   0,
  lastRoundSec: 0,
  totalSec:     0,
  completedCount: 0,     // x
  interval:     1,       // 報時間隔（秒）
  rate:         1.3,     // 語速
  voiceOn:      false,
  history:      [],
  finished:     false
};

/* ---------------- 數字 → 粵語 ---------------- */
const DIG = ['零','一','二','三','四','五','六','七','八','九'];

function numToCantonese(n){
  if (n < 10) return DIG[n];
  if (n < 20) return '十' + (n % 10 ? DIG[n % 10] : '');
  if (n < 100){
    const t = Math.floor(n / 10), o = n % 10;
    return DIG[t] + '十' + (o ? DIG[o] : '');
  }
  return String(n);
}

/* 0–59：直接讀數字；60 →「一分鐘」；61 →「一分一」 */
function timeSpeech(sec){
  if (sec < 60) return numToCantonese(sec);
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  if (s === 0) return numToCantonese(m) + '分鐘';
  return numToCantonese(m) + '分' + numToCantonese(s);
}

/* ---------------- 語音合成 ---------------- */
let cachedVoice = null;

function pickVoice(){
  if (cachedVoice) return cachedVoice;
  if (!('speechSynthesis' in window)) return null;
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return null;
  let v =
    voices.find(v => /yue/i.test(v.lang)) ||
    voices.find(v => /zh[-_]HK/i.test(v.lang)) ||
    voices.find(v => /zh[-_]TW/i.test(v.lang)) ||
    voices.find(v => /zh/i.test(v.lang));
  cachedVoice = v || null;
  return cachedVoice;
}

if ('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = () => { cachedVoice = null; pickVoice(); };
  pickVoice();
}

/* 盡量快速發聲 */
function speak(text){
  if (!('speechSynthesis' in window)) return;
  try { speechSynthesis.resume(); } catch(_){}
  const u = new SpeechSynthesisUtterance(text);
  u.lang   = 'yue-Hant-HK';
  u.rate   = state.rate;
  u.pitch  = 1;
  u.volume = 1;
  const v = pickVoice();
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

/* 清空佇列再講（用於重要提示，避免延遲） */
function speakNow(text){
  if (!('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); } catch(_){}
  speak(text);
}

/* ---------------- 畫面更新 ---------------- */
function fmt(sec){
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function setStatus(t){ elStatus.textContent = t; }
function setHeard(t){ elHeard.textContent = t || '—'; }

function updateCount(){ elCount.textContent = state.completedCount; }

function renderHistory(){
  if (!state.history.length){
    elHistory.innerHTML = '<li class="empty">尚無記錄</li>';
    return;
  }
  elHistory.innerHTML = state.history.map(h => {
    if (h.type === 'summary'){
      return `<li class="summary">
        <span class="no">總結</span>
        <span class="tag">${h.tag}</span>
        <span class="time">${fmt(h.sec)}</span>
      </li>`;
    }
    return `<li class="${h.type}">
      <span class="no">${h.no}</span>
      <span class="tag">${h.tag}</span>
      <span class="time">${fmt(h.sec)}</span>
    </li>`;
  }).join('');
  elHistory.scrollTop = elHistory.scrollHeight;
}

function addHistory(item){
  state.history.push(item);
  renderHistory();
}

/* ---------------- 主計時器 ---------------- */
let tickHandle = null;

function tick(){
  const now = Date.now();

  // 總時間（由第一次「開始」到現在，包含休息時間）
  if (state.totalStart){
    const ts = Math.floor((now - state.totalStart) / 1000);
    if (ts !== state.totalSec){
      state.totalSec = ts;
      elTotal.textContent = fmt(ts);
    }
  }

  // 本回合逐秒報時
  if (state.running){
    const rs = Math.floor((now - state.startTime) / 1000);
    if (rs !== state.currentSec){
      state.currentSec = rs;
      elRound.textContent = rs;
      if (rs > 0 && rs % state.interval === 0){
        speak(timeSpeech(rs));
      }
    }
  }
}

function startTicker(){
  if (tickHandle) return;
  tickHandle = setInterval(tick, 100);
}

/* ---------------- 指令處理 ---------------- */
const cmdCooldown = {};

function fire(cmd){
  const now = Date.now();
  if (cmdCooldown[cmd] && now - cmdCooldown[cmd] < 1500) return;
  cmdCooldown[cmd] = now;
  commands[cmd]();
}

const commands = {

  /* 開始 */
  start(){
    if (state.running) return;
    const now = Date.now();
    if (!state.totalStart) state.totalStart = now;
    state.startTime  = now;
    state.running    = true;
    state.currentSec = 0;
    state.finished   = false;
    elRound.textContent = '0';
    speakNow('開始');
    setStatus('計時中…');
    updateCount();
  },

  /* 停止 → 第 x 次完成 */
  stop(){
    if (!state.running) return;
    const now = Date.now();
    const sec = Math.floor((now - state.startTime) / 1000);
    state.running    = false;
    state.lastRoundSec = sec;
    state.completedCount += 1;
    const x = state.completedCount;

    speakNow('第' + x + '次完成');

    addHistory({ type:'done', no:'第 ' + x + ' 次', tag:'完成', sec });
    updateCount();
    setStatus(`已完成 ${x} 次，等待「開始」`);
    elRound.textContent = sec;
  },

  /* 取消 → 第 x 次取消（x 不變） */
  cancel(){
    if (!state.running) return;
    const now = Date.now();
    const sec = Math.floor((now - state.startTime) / 1000);
    state.running    = false;
    state.lastRoundSec = sec;
    const x = state.completedCount;

    speakNow(x > 0 ? ('第' + x + '次取消') : '取消');

    addHistory({
      type:'cancel',
      no: x > 0 ? ('第 ' + x + ' 次') : '未完成',
      tag:'取消',
      sec
    });
    setStatus(`已取消（完成次數維持 ${x} 次）`);
    elRound.textContent = sec;
  },

  /* 結束 → 總結 */
  end(){
    const now = Date.now();
    state.running = false;

    let total = 0;
    if (state.totalStart) total = Math.floor((now - state.totalStart) / 1000);

    const m = Math.floor(total / 60);
    const s = total % 60;
    const x = state.completedCount;

    // 關閉語音控制
    state.voiceOn = false;
    if (recognition){ try { recognition.stop(); } catch(_){} }
    updateVoiceBtn();

    elTotal.textContent = fmt(total);
    elRound.textContent = state.lastRoundSec;

    addHistory({
      type:'summary',
      tag:`完成 ${x} 次`,
      sec: total
    });

    const summary = `今次運動，你總共完成咗 ${x} 次，用咗 ${m} 分 ${s} 秒`;
    speakNow(summary);
    setStatus(summary);
    state.finished = true;
    state.totalStart = 0; // 停止總時間繼續跳
  }
};

/* ---------------- 語音辨識 ---------------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let recognizing = false;

function initRecognition(){
  if (!SR) return null;
  const r = new SR();
  r.lang = 'yue-Hant-HK';
  r.continuous = true;
  r.interimResults = true;
  r.maxAlternatives = 1;

  r.onstart = () => {
    recognizing = true;
    setStatus('語音控制已啟動 — 請說「開始」');
  };

  r.onresult = (e) => {
    let txt = '';
    for (let i = e.resultIndex; i < e.results.length; i++){
      txt += e.results[i][0].transcript;
    }
    txt = txt.replace(/\s/g, '');
    if (!txt) return;
    setHeard(txt);
    dispatch(txt);
  };

  r.onerror = (e) => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      setStatus('麥克風權限被拒絕，請在瀏覽器設定中允許');
      state.voiceOn = false;
      updateVoiceBtn();
    } else if (e.error === 'no-speech'){
      /* 忽略 */
    } else if (e.error === 'network'){
      setStatus('語音辨識網絡錯誤');
    }
  };

  r.onend = () => {
    recognizing = false;
    if (state.voiceOn){
      setTimeout(() => {
        if (state.voiceOn && !recognizing){
          try { recognition.start(); } catch(_){}
        }
      }, 200);
    }
  };

  return r;
}

/* 指令判斷（順序：結束 > 取消 > 停止 > 開始） */
function dispatch(t){
  if (/結束|结束/.test(t)) return fire('end');
  if (/取消/.test(t))      return fire('cancel');
  if (/停止|停下|停/.test(t)) return fire('stop');
  if (/開始|开始/.test(t))  return fire('start');
}

function updateVoiceBtn(){
  if (state.voiceOn){
    elVoiceBtn.textContent = '⏹ 停止語音控制';
    elVoiceBtn.classList.add('listening');
    elVoiceBtn.classList.remove('primary');
    elDot.classList.add('on');
  } else {
    elVoiceBtn.textContent = '🎤 啟動語音控制';
    elVoiceBtn.classList.remove('listening');
    elVoiceBtn.classList.add('primary');
    elDot.classList.remove('on');
  }
}

function startVoice(){
  if (!SR){
    setStatus('此瀏覽器不支援語音辨識，請用 Chrome / Edge / Android Chrome');
    return;
  }
  if (!recognition) recognition = initRecognition();
  state.voiceOn = true;
  // 先用一個空發聲「解鎖」語音合成（手機瀏覽器需要）
  try {
    const u = new SpeechSynthesisUtterance('');
    speechSynthesis.speak(u);
  } catch(_){}
  try { recognition.start(); } catch(_){}
  updateVoiceBtn();
}

function stopVoice(){
  state.voiceOn = false;
  if (recognition){ try { recognition.stop(); } catch(_){} }
  updateVoiceBtn();
  setStatus('語音控制已停止');
}

/* ---------------- 重置 ---------------- */
function resetAll(){
  state.running      = false;
  state.startTime    = 0;
  state.totalStart   = 0;
  state.currentSec   = 0;
  state.lastRoundSec = 0;
  state.totalSec     = 0;
  state.completedCount = 0;
  state.history      = [];
  state.finished     = false;

  try { speechSynthesis.cancel(); } catch(_){}

  elTotal.textContent = '00:00';
  elRound.textContent = '0';
  elCount.textContent = '0';
  setHeard('—');
  setStatus(state.voiceOn ? '已重置 — 請說「開始」' : '已重置 — 待機中');
  renderHistory();
}

/* ---------------- 報時間隔 ---------------- */
const INTERVALS = [
  { v:1,   label:'1 秒'   },
  { v:5,   label:'5 秒'   },
  { v:10,  label:'10 秒'  },
  { v:30,  label:'30 秒'  },
  { v:60,  label:'1 分鐘' },
  { v:120, label:'2 分鐘' },
  { v:300, label:'5 分鐘' }
];
let intervalIdx = 0;

function cycleInterval(){
  intervalIdx = (intervalIdx + 1) % INTERVALS.length;
  state.interval = INTERVALS[intervalIdx].v;
  elIntBtn.textContent = '報時間隔：' + INTERVALS[intervalIdx].label;
}

/* ---------------- 語速 ---------------- */
function setRate(delta){
  let r = Math.round((state.rate + delta) * 10) / 10;
  r = Math.min(2.5, Math.max(0.5, r));
  state.rate = r;
  elRateLbl.textContent = '語速 ' + r.toFixed(1) + '×';
}

/* ---------------- 綁定事件 ---------------- */
elVoiceBtn.addEventListener('click', () => {
  if (state.voiceOn) stopVoice();
  else startVoice();
});

elResetBtn.addEventListener('click', resetAll);
elIntBtn.addEventListener('click', cycleInterval);
elRateUp.addEventListener('click', () => setRate(0.1));
elRateDown.addEventListener('click', () => setRate(-0.1));

/* 初始化 */
updateVoiceBtn();
updateCount();
renderHistory();
startTicker();

/* 頁面隱藏時保持運作（部分瀏覽器會暫停 timers） */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state.voiceOn && recognition && !recognizing){
    try { recognition.start(); } catch(_){}
  }
});
</script>
</body>
</html>
