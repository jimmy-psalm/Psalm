<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0f14">
<title>粵語計時教練</title>
<style>
  :root{
    --bg:#0d0f14; --panel:#171b23; --panel2:#1f242e; --panel3:#262c38;
    --accent:#4ade80; --accent2:#22d3ee; --danger:#f87171; --warn:#fbbf24;
    --text:#e6e9ef; --dim:#8b93a3; --line:#2a3140;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg); color:var(--text); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans CJK HK","Microsoft JhengHei",sans-serif;
    height:100vh; height:100dvh;
    -webkit-user-select:none; user-select:none;
  }
  .wrap{
    display:flex; flex-direction:column; height:100%;
    max-width:560px; margin:0 auto; padding:10px 12px 12px; gap:8px;
  }

  /* ---------- 頂欄 ---------- */
  .topbar{display:flex; gap:8px;}
  .btn{
    flex:1; border:none; border-radius:12px; padding:14px 10px;
    font-size:16px; font-weight:700; color:var(--text);
    background:var(--panel2); cursor:pointer;
    transition:transform .08s, background .15s, box-shadow .15s;
    font-family:inherit;
  }
  .btn:active{transform:scale(.96);}
  .btn.primary{background:linear-gradient(135deg,#2563eb,#1d4ed8);}
  .btn.primary.on{
    background:linear-gradient(135deg,#059669,#10b981);
    box-shadow:0 0 0 2px rgba(74,222,128,.35), 0 0 18px rgba(74,222,128,.35);
  }
  .btn.ghost{background:var(--panel2);}

  /* ---------- 狀態 ---------- */
  .status{
    text-align:center; font-size:15px; font-weight:700; letter-spacing:1px;
    padding:8px; border-radius:10px; background:var(--panel);
    color:var(--dim); transition:all .2s;
  }
  .status.running{color:#052e16;background:linear-gradient(90deg,#4ade80,#22d3ee);}
  .status.ended{color:#450a0a;background:linear-gradient(90deg,#fca5a5,#f87171);}
  .status.listening{color:var(--accent2);}

  /* ---------- 數據卡 ---------- */
  .stats{display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:8px;}
  .stat{
    background:var(--panel); border-radius:12px; padding:10px 8px;
    text-align:center; border:1px solid var(--line);
  }
  .stat .label{font-size:12px;color:var(--dim);margin-bottom:4px;letter-spacing:.5px;}
  .stat .value{
    font-size:22px; font-weight:800; font-variant-numeric:tabular-nums;
    color:var(--text);
  }
  .stat .value.acc{color:var(--accent);}
  .stat .value.cy{color:var(--accent2);}

  /* ---------- 控制列 ---------- */
  .controls{display:flex; gap:8px; align-items:stretch;}
  .btn.small{
    flex:1.2; padding:12px 8px; font-size:15px; border-radius:12px;
    background:var(--panel2); border:1px solid var(--line);
  }
  .rate{
    flex:1; display:flex; align-items:center; justify-content:space-between;
    background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:4px 6px; gap:4px;
  }
  .rate .rlabel{font-size:12px;color:var(--dim);padding-left:4px;}
  .btn.tiny{
    flex:0 0 auto; width:38px; height:38px; padding:0; border-radius:10px;
    font-size:20px; line-height:1; background:var(--panel3); color:var(--text);
  }
  #rateVal{
    font-size:14px; font-weight:700; min-width:46px; text-align:center;
    font-variant-numeric:tabular-nums; color:var(--warn);
  }

  /* ---------- 歷史 ---------- */
  .hist-head{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:2px 4px; font-size:13px; color:var(--dim); letter-spacing:.5px;
  }
  .hist-head b{color:var(--text);}
  .history{
    flex:1; min-height:90px; overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:var(--panel); border-radius:12px; border:1px solid var(--line);
    padding:6px; display:flex; flex-direction:column; gap:6px;
  }
  .history::-webkit-scrollbar{width:4px;}
  .history::-webkit-scrollbar-thumb{background:#3a4254;border-radius:4px;}
  .empty{color:var(--dim);font-size:13px;text-align:center;padding:18px 0;}
  .hist-item{
    display:flex; align-items:center; gap:8px;
    padding:9px 11px; border-radius:9px; background:var(--panel2);
    border-left:4px solid var(--accent);
    animation:slideIn .22s ease-out;
  }
  .hist-item.cancel{border-left-color:var(--danger);}
  @keyframes slideIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
  .hi-idx{font-weight:800;font-size:15px;min-width:64px;}
  .hi-res{
    font-size:12px; font-weight:700; padding:2px 9px; border-radius:20px;
    background:rgba(74,222,128,.15); color:var(--accent);
  }
  .hist-item.cancel .hi-res{background:rgba(248,113,113,.15);color:var(--danger);}
  .hi-time{margin-left:auto;font-variant-numeric:tabular-nums;font-size:14px;color:var(--dim);}

  /* ---------- 總結 ---------- */
  .summary{
    background:linear-gradient(135deg,#1e293b,#0f172a);
    border:1px solid var(--accent2); border-radius:12px;
    padding:12px 14px; font-size:15px; line-height:1.7; text-align:center;
    animation:slideIn .3s ease-out;
  }
  .summary .big{font-size:20px;font-weight:800;color:var(--accent2);}
  .hidden{display:none !important;}

  /* 提示 */
  .hint{font-size:11px;color:var(--dim);text-align:center;letter-spacing:.3px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <button id="voiceBtn" class="btn primary">🎤 啟動語音控制</button>
    <button id="resetBtn" class="btn ghost">🔄 重置</button>
  </div>

  <div id="status" class="status">待機中 — 請按「啟動語音控制」</div>

  <div class="stats">
    <div class="stat"><div class="label">總時間</div><div id="totalTime" class="value acc">00:00</div></div>
    <div class="stat"><div class="label">完成次數</div><div id="completedVal" class="value cy">0</div></div>
    <div class="stat"><div class="label">本回合</div><div id="roundSec" class="value">0</div></div>
  </div>

  <div class="controls">
    <button id="reportBtn" class="btn small">⏱ 報時：1秒</button>
    <div class="rate">
      <span class="rlabel">語速</span>
      <button id="rateDown" class="btn tiny">−</button>
      <span id="rateVal">1.5x</span>
      <button id="rateUp" class="btn tiny">＋</button>
    </div>
  </div>

  <div class="hist-head">
    <span>歷史記錄</span>
    <span>共 <b id="histCount">0</b> 條</span>
  </div>
  <div id="history" class="history">
    <div class="empty">暫無記錄</div>
  </div>

  <div id="summary" class="summary hidden"></div>
  <div class="hint">說「開始」計時・「停止」完成・「取消」取消・「結束」總結</div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     一、DOM 與狀態
     ========================================================= */
  const $ = (id) => document.getElementById(id);

  const voiceBtn    = $('voiceBtn');
  const resetBtn    = $('resetBtn');
  const statusEl    = $('status');
  const totalTimeEl = $('totalTime');
  const completedEl = $('completedVal');
  const roundSecEl  = $('roundSec');
  const reportBtn   = $('reportBtn');
  const rateValEl   = $('rateVal');
  const rateDownBtn = $('rateDown');
  const rateUpBtn   = $('rateUp');
  const historyEl   = $('history');
  const histCountEl = $('histCount');
  const summaryEl   = $('summary');

  const STATE = { IDLE: 'idle', RUNNING: 'running', ENDED: 'ended' };

  let state            = STATE.IDLE;
  let completedCount   = 0;      // x
  let totalMs          = 0;      // 累計運動毫秒
  let roundStartMs     = 0;
  let roundSec         = 0;
  let lastReportedSec  = 0;
  let reportInterval   = 1;      // 秒
  let reportStepIndex  = 0;
  let speechRate       = 1.5;
  let voiceControlOn   = false;
  let history          = [];
  let tickTimer        = null;
  let cantoVoice       = null;
  let sessionEnded     = false;

  const REPORT_STEPS  = [1, 5, 10, 30, 60, 120, 300];
  const REPORT_LABELS = { 1:'1秒', 5:'5秒', 10:'10秒', 30:'30秒', 60:'1分鐘', 120:'2分鐘', 300:'5分鐘' };

  /* =========================================================
     二、粵語數字 / 時間朗讀字串
     ========================================================= */
  const DIGITS = ['零','一','二','三','四','五','六','七','八','九'];

  function numToCanto(n) {
    n = Math.floor(n);
    if (n <= 0) return '零';
    if (n < 10) return DIGITS[n];
    if (n < 20) return '十' + (n % 10 ? DIGITS[n % 10] : '');
    if (n < 100) {
      const t = Math.floor(n / 10), o = n % 10;
      return DIGITS[t] + '十' + (o ? DIGITS[o] : '');
    }
    const h = Math.floor(n / 100), r = n % 100;
    return DIGITS[h] + '百' + (r === 0 ? '' : (r < 10 ? '零' + DIGITS[r] : numToCanto(r)));
  }

  /** 秒數 → 粵語讀法： 60→「一分鐘」, 61→「一分一」, 125→「兩分五」 */
  function secToCanto(sec) {
    sec = Math.floor(sec);
    if (sec < 60) return sec <= 0 ? '零' : numToCanto(sec);
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    let mStr;
    if (m === 1) mStr = '一分';
    else if (m === 2) mStr = '兩分';
    else mStr = numToCanto(m) + '分';
    if (s === 0) return mStr + '鐘';
    return mStr + numToCanto(s);
  }

  /* =========================================================
     三、語音合成 (TTS)
     ========================================================= */
  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices() || [];
    cantoVoice =
      vs.find(v => /zh[-_]HK/i.test(v.lang)) ||
      vs.find(v => /yue/i.test(v.lang)) ||
      vs.find(v => /zh[-_]TW/i.test(v.lang)) ||
      vs.find(v => /zh/i.test(v.lang)) ||
      null;
  }
  if ('speechSynthesis' in window) {
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
  }

  /**
   * 朗讀。interrupt = true 時會先取消正在排隊/正在講的句子，
   * 確保「最新指令」永遠最快出聲，減少與用戶說話重疊的時間。
   */
  function speak(text, interrupt) {
    if (!('speechSynthesis' in window)) return;
    try {
      if (interrupt !== false) speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-HK';
      if (cantoVoice) u.voice = cantoVoice;
      u.rate = speechRate;
      u.pitch = 1;
      u.volume = 1;
      speechSynthesis.speak(u);
    } catch (e) { /* ignore */ }
  }

  /* =========================================================
     四、語音辨識 (ASR)
     ========================================================= */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let recognitionRunning = false;
  let restartTimer = null;
  let lastCmd = '';
  let lastCmdAt = 0;

  function initRecognition() {
    if (!SR) return null;
    const r = new SR();
    r.lang = 'zh-HK';
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;

    r.onresult = (e) => {
      let text = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        text += e.results[i][0].transcript;
      }
      text = text.replace(/[\s,，。.!！?？、·]/g, '');
      if (text) dispatch(text);
    };

    r.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        voiceControlOn = false;
        updateUI();
        alert('麥克風權限被拒絕，請在瀏覽器設定中允許使用麥克風。');
      }
      // no-speech / aborted / network → 交給 onend 重啟
    };

    r.onend = () => {
      recognitionRunning = false;
      if (voiceControlOn && !sessionEnded) {
        clearTimeout(restartTimer);
        restartTimer = setTimeout(startRecognition, 120);
      }
    };

    return r;
  }
  recognition = initRecognition();

  function startRecognition() {
    if (!recognition || recognitionRunning) return;
    try {
      recognition.start();
      recognitionRunning = true;
    } catch (e) {
      // 已經在跑 / 正在啟動
      recognitionRunning = false;
      clearTimeout(restartTimer);
      restartTimer = setTimeout(() => {
        if (voiceControlOn && !sessionEnded) startRecognition();
      }, 250);
    }
  }

  function stopRecognition() {
    clearTimeout(restartTimer);
    if (!recognition) return;
    try { recognition.stop(); } catch (e) {}
    recognitionRunning = false;
  }

  /* =========================================================
     五、指令分派
     注意：TTS 只會朗讀數字與「第X次完成／取消」，
     其中不含「開始／停止／取消／結束」以外的觸發字。
     因此凡是含觸發字的辨識結果，一律視為用戶指令；
     純數字（TTS 回音）則直接忽略。
     ========================================================= */
  function dispatch(raw) {
    if (sessionEnded) return;

    // 去重：同一個指令 900ms 內只觸發一次
    const now = Date.now();

    // 優先級：結束 > 開始 > 停止 > 取消
    if (/結束|结束/.test(raw)) { fire('end', now); return; }
    if (/開始|开始/.test(raw)) { fire('start', now); return; }
    if (/停止|停下|停下嚟/.test(raw)) { fire('stop', now); return; }
    if (/取消/.test(raw)) { fire('cancel', now); return; }

    // 其餘一律忽略（多數是 TTS 回音）
  }

  function fire(cmd, now) {
    if (cmd === lastCmd && now - lastCmdAt < 900) return;
    lastCmd = cmd; lastCmdAt = now;

    switch (cmd) {
      case 'start':  if (state === STATE.IDLE)    startRound();  break;
      case 'stop':   if (state === STATE.RUNNING) finishRound(); break;
      case 'cancel': if (state === STATE.RUNNING) cancelRound(); break;
      case 'end':    endSession(); break;
    }
  }

  /* =========================================================
     六、核心計時邏輯
     ========================================================= */
  function startRound() {
    if (state === STATE.ENDED) return;
    state = STATE.RUNNING;
    roundStartMs = performance.now();
    roundSec = 0;
    lastReportedSec = 0;
    if (!tickTimer) tickTimer = setInterval(tick, 30);
    updateUI();
  }

  function tick() {
    if (state !== STATE.RUNNING) return;

    const elapsedMs = performance.now() - roundStartMs;
    const sec = Math.floor(elapsedMs / 1000);

    if (sec !== roundSec) {
      roundSec = sec;
      roundSecEl.textContent = sec;
    }
    totalTimeEl.textContent = formatMs(totalMs + elapsedMs);

    if (sec >= 1 && sec > lastReportedSec) {
      lastReportedSec = sec;
      if (reportInterval === 1 || sec % reportInterval === 0) {
        speak(secToCanto(sec), true);
      }
    }
  }

  function stopTick() {
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
  }

  function finishRound() {
    if (state !== STATE.RUNNING) return;
    const elapsedMs = performance.now() - roundStartMs;
    const sec = Math.floor(elapsedMs / 1000);

    totalMs += elapsedMs;
    state = STATE.IDLE;
    completedCount += 1;

    addHistory(completedCount, '完成', sec);
    updateUI();
    speak('第' + numToCanto(completedCount) + '次完成', true);
  }

  function cancelRound() {
    if (state !== STATE.RUNNING) return;
    const elapsedMs = performance.now() - roundStartMs;
    const sec = Math.floor(elapsedMs / 1000);

    totalMs += elapsedMs;
    state = STATE.IDLE;

    addHistory(completedCount, '取消', sec);
    updateUI();
    speak('第' + numToCanto(completedCount) + '次取消', true);
  }

  function endSession() {
    if (sessionEnded) return;

    // 若仍在計時，先無聲停止（此回合不計入完成／取消）
    if (state === STATE.RUNNING) {
      state = STATE.IDLE;
    }
    sessionEnded = true;
    state = STATE.ENDED;
    voiceControlOn = false;
    stopRecognition();
    stopTick();

    const totalSec = Math.floor(totalMs / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;

    let timeStr;
    if (m > 0 && s === 0) {
      timeStr = (m === 2 ? '兩分' : numToCanto(m) + '分') + '鐘';
    } else if (m > 0) {
      timeStr = (m === 2 ? '兩分' : numToCanto(m) + '分') + numToCanto(s) + '秒';
    } else {
      timeStr = numToCanto(s) + '秒';
    }

    const doneStr = completedCount > 0 ? numToCanto(completedCount) + '次' : '零次';

    speak('今日運動結束。總共完成' + doneStr + '，用咗' + timeStr + '。', true);

    summaryEl.classList.remove('hidden');
    summaryEl.innerHTML =
      '🏁 今次運動總結<br>' +
      '總共完成 <span class="big">' + completedCount + '</span> 次<br>' +
      '用咗 <span class="big">' + timeStr + '</span>' +
      (completedCount === 0 ? '<br><span style="font-size:12px;color:#8b93a3">（未有任何完成記錄）</span>' : '');

    updateUI();
  }

  /* =========================================================
     七、UI 更新
     ========================================================= */
  function formatMs(ms) {
    const t = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(t / 3600);
    const m = Math.floor((t % 3600) / 60);
    const s = t % 60;
    const mm = String(m).padStart(2, '0');
    const ss = String(s).padStart(2, '0');
    return h > 0 ? h + ':' + mm + ':' + ss : mm + ':' + ss;
  }

  function formatSec(sec) {
    sec = Math.floor(sec);
    if (sec < 60) return sec + '秒';
    const m = Math.floor(sec / 60), s = sec % 60;
    return m + '分' + String(s).padStart(2, '0') + '秒';
  }

  function updateUI() {
    // 狀態列
    statusEl.className = 'status';
    if (state === STATE.RUNNING) {
      statusEl.textContent = '🔴 計時中… 講「停止」或「取消」';
      statusEl.classList.add('running');
    } else if (state === STATE.ENDED) {
      statusEl.textContent = '✅ 已結束';
      statusEl.classList.add('ended');
    } else if (voiceControlOn) {
      statusEl.textContent = '👂 聽緊… 請講「開始」';
      statusEl.classList.add('listening');
    } else {
      statusEl.textContent = '待機中 — 請按「啟動語音控制」';
    }

    // 語音控制按鈕
    if (voiceControlOn) {
      voiceBtn.textContent = '🎤 語音控制中（點擊關閉）';
      voiceBtn.classList.add('on');
    } else {
      voiceBtn.textContent = '🎤 啟動語音控制';
      voiceBtn.classList.remove('on');
    }
    voiceBtn.disabled = sessionEnded;

    // 數據
    if (state !== STATE.RUNNING) {
      totalTimeEl.textContent = formatMs(totalMs);
      roundSecEl.textContent = '0';
    }
    completedEl.textContent = completedCount;
    histCountEl.textContent = history.length;
  }

  /* =========================================================
     八、歷史記錄
     ========================================================= */
  function addHistory(index, result, sec) {
    history.push({ index, result, sec });
    renderHistory();
  }

  function renderHistory() {
    if (!history.length) {
      historyEl.innerHTML = '<div class="empty">暫無記錄</div>';
      histCountEl.textContent = '0';
      return;
    }
    historyEl.innerHTML = history.map(h => {
      const cls = h.result === '完成' ? '' : 'cancel';
      return '<div class="hist-item ' + cls + '">' +
               '<span class="hi-idx">第 ' + h.index + ' 次</span>' +
               '<span class="hi-res">' + h.result + '</span>' +
               '<span class="hi-time">' + formatSec(h.sec) + '</span>' +
             '</div>';
    }).join('');
    histCountEl.textContent = history.length;
    historyEl.scrollTop = historyEl.scrollHeight;
  }

  /* =========================================================
     九、按鈕事件
     ========================================================= */
  voiceBtn.addEventListener('click', () => {
    if (sessionEnded) return;
    if (!recognition) {
      alert('此瀏覽器不支援語音辨識。\n請使用 Chrome 或 Edge（桌面版 / Android）。');
      return;
    }
    voiceControlOn = !voiceControlOn;
    if (voiceControlOn) {
      startRecognition();
      speak('準備好', true);   // 確認音效（不含觸發字）
    } else {
      stopRecognition();
      speechSynthesis.cancel();
    }
    updateUI();
  });

  resetBtn.addEventListener('click', () => {
    stopTick();
    state = STATE.IDLE;
    sessionEnded = false;
    completedCount = 0;
    totalMs = 0;
    roundSec = 0;
    lastReportedSec = 0;
    roundStartMs = 0;
    history = [];
    lastCmd = ''; lastCmdAt = 0;
    summaryEl.classList.add('hidden');
    summaryEl.innerHTML = '';
    try { speechSynthesis.cancel(); } catch (e) {}
    renderHistory();
    updateUI();
  });

  reportBtn.addEventListener('click', () => {
    reportStepIndex = (reportStepIndex + 1) % REPORT_STEPS.length;
    reportInterval = REPORT_STEPS[reportStepIndex];
    reportBtn.textContent = '⏱ 報時：' + REPORT_LABELS[reportInterval];
    // 切換後重新對齊，避免同一秒重複讀
    lastReportedSec = state === STATE.RUNNING ? roundSec : 0;
  });

  rateDownBtn.addEventListener('click', () => changeRate(-0.1));
  rateUpBtn.addEventListener('click', () => changeRate(0.1));

  function changeRate(d) {
    speechRate = Math.round((speechRate + d) * 10) / 10;
    speechRate = Math.max(0.5, Math.min(3, speechRate));
    rateValEl.textContent = speechRate.toFixed(1) + 'x';
  }

  /* =========================================================
     十、初始化
     ========================================================= */
  function init() {
    rateValEl.textContent = speechRate.toFixed(1) + 'x';
    reportBtn.textContent = '⏱ 報時：' + REPORT_LABELS[reportInterval];
    renderHistory();
    updateUI();

    // 預熱語音引擎（部分瀏覽器首次朗讀會延遲）
    if ('speechSynthesis' in window) {
      try {
        const u = new SpeechSynthesisUtterance(' ');
        u.volume = 0;
        u.lang = 'zh-HK';
        speechSynthesis.speak(u);
      } catch (e) {}
    }
  }
  init();

  // 頁面隱藏時不要讓 interval 空轉
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      // 保留計時（用 performance.now 計算，回來會自動補正）
    } else {
      if (state === STATE.RUNNING && !tickTimer) {
        tickTimer = setInterval(tick, 30);
      }
    }
  });

  // 防止手機雙擊縮放
  document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

})();
</script>
</body>
</html>
